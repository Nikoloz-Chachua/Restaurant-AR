<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Lions — AR</title>
    <script>
        (async () => {
            try {
                const KILL_KEY = 'bl-killswitch-v41';
                if (localStorage.getItem(KILL_KEY)) return;
                if (!('serviceWorker' in navigator)) return;
                const regs = await navigator.serviceWorker.getRegistrations();
                const cacheNames = await caches.keys();
                if (regs.length === 0 && cacheNames.length === 0) {
                    localStorage.setItem(KILL_KEY, '1');
                    return;
                }
                localStorage.setItem(KILL_KEY, '1');
                await Promise.all(regs.map(r => r.unregister().catch(() => {})));
                await Promise.all(cacheNames.map(n => caches.delete(n).catch(() => {})));
                location.reload();
            } catch (_) {}
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        button { touch-action: manipulation; }

        body {
            background: #0f0b07;
            color: #ede6d4;
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        #splash {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 40px 24px 60px;
            min-height: 100vh;
        }

        .brand {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3.2rem, 18vw, 7rem);
            letter-spacing: 10px;
            color: #f2b535;
            line-height: 1;
            text-align: center;
        }

        .tagline {
            font-size: 0.65rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #8a7a62;
            font-weight: 700;
            text-align: center;
            margin-top: 8px;
        }

        #start-btn {
            background: #f2b535;
            color: #0f0b07;
            border: none;
            border-radius: 16px;
            padding: 22px 0;
            width: 84%;
            max-width: 340px;
            font-family: 'Nunito', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;

            margin-top: 44px;

        }
        #start-btn:active { opacity: 0.7; transition: opacity 0.08s; }
        #start-btn:disabled { opacity: 0.45; cursor: wait; }

        .start-sub {
            font-size: 0.65rem;
            letter-spacing: 1px;
            color: #8a7a62;
            text-align: center;
            margin-top: 12px;
        }

        #no-ar-msg {
            color: #8a7a62;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 32px;
            line-height: 1.5;
            max-width: 280px;
        }

        /* iOS strip */
        #ios-strip-wrap {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: 36px;
        }

        .strip-label {
            font-size: 0.6rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #8a7a62;
            font-weight: 700;
            margin-bottom: 10px;
        }

        #ios-strip {
            display: flex;
            flex-direction: row;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 24px 8px;
            width: 100%;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        #ios-strip::-webkit-scrollbar { display: none; }

        .ios-item {
            flex-shrink: 0;
            background: rgba(242,181,53,0.08);
            border: 1.5px solid rgba(242,181,53,0.18);
            border-radius: 14px;

            transition: background 0.12s, border-color 0.12s;
        }
        .ios-item.selected {
            background: rgba(242,181,53,0.22);
            border-color: #f2b535;
        }
        .ios-item-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.88rem;

        /* WebXR overlay — same as main app */
        #xr-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 51;
            pointer-events: none;
        }
        #xr-gesture-layer {
            display: none;
            position: absolute;
            inset: 0;
            pointer-events: all;
            z-index: 1;

        #xr-place-hint {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: 'Nunito', sans-serif;
            font-size: 14px;
            background: rgba(0,0,0,0.65);
            padding: 10px 20px;
            border-radius: 20px;
            white-space: normal;
            text-align: center;
            width: 80%;
            max-width: 320px;
        }
        #xr-nav-row {
            display: none;
            position: absolute;
            z-index: 2;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: all;
            align-items: center;
            gap: 16px;
            background: rgba(0,0,0,0.65);
            padding: 8px 20px;
            border-radius: 30px;
        }
        #xr-nav-row button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.35);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            pointer-events: all;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #xr-move-hint {
            display: none;
            position: absolute;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-family: 'Nunito', sans-serif;
            font-size: 12px;
            white-space: normal;
            text-align: center;
            max-width: 80%;
        }
        #xr-exit, #xr-carousel-toggle, #xr-label-toggle, #xr-place-again, #xr-hide-ui {
            pointer-events: all;
            position: absolute;
            z-index: 2;
            background: rgba(0,0,0,0.65);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;

        #xr-exit             { top: 18px; right: 18px; }
        #xr-place-again      { top: 62px; right: 18px; display: none; }
        #xr-hide-ui          { top: 18px; left: 18px; display: block; transition: opacity 0.25s; }
        #xr-carousel-toggle  { top: 62px; left: 18px; display: none; }
        #xr-label-toggle     { top: 106px; left: 18px; display: none; }
        #xr-hide-ui.ui-hidden { opacity: 0.35; }
        #xr-scale-gauge {
            display: none;
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.65);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;

        #xr-scale-track {

        #xr-scale-fill {
            position: absolute;

        #xr-scale-mark {
            position: absolute;
            top: -3px;
            width: 2px;
            height: 10px;
            background: rgba(255,255,255,0.55);
            border-radius: 1px;
            left: calc(53.7% - 1px);
        }
        #xr-scale-pct {
            font-family: 'Nunito', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }
        #xr-hint-step { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.5); margin-bottom: 3px; }
        #xr-hint-main { font-size: 14px; color: #fff; }
    </style>
</head>
<body>

    <div id="splash">
        <div class="brand">Burger Lions</div>
        <div class="tagline">Taste the Wild</div>

        <div id="ios-strip-wrap">
            <div class="strip-label">Choose a dish</div>
            <div id="ios-strip"></div>
        </div>

        <button id="start-btn" disabled>Loading…</button>
        <div class="start-sub" id="start-sub">tap surface to place &middot; swipe to browse all dishes</div>
        <div id="no-ar-msg" style="display:none">AR is not available on this device.<br>Open this link on an Android or iPhone.</div>
    </div>

    <div id="xr-overlay">
        <div id="xr-gesture-layer"></div>
        <div id="xr-place-hint">
            <div id="xr-hint-step"></div>
            <div id="xr-hint-main"></div>
        </div>
        <div id="xr-nav-row">
            <button id="xr-prev">&#10094;</button>
            <button id="xr-next">&#10095;</button>
        </div>
        <div id="xr-move-hint">Drag to move &middot; Twist two fingers to rotate</div>
        <button id="xr-exit">Exit AR</button>
        <button id="xr-place-again">Place Again</button>
        <button id="xr-carousel-toggle"></button>
        <button id="xr-label-toggle"></button>
        <button id="xr-hide-ui">HIDE UI</button>
        <div id="xr-scale-gauge">
            <div id="xr-scale-track">
                <div id="xr-scale-fill"></div>
                <div id="xr-scale-mark"></div>
            </div>
            <span id="xr-scale-pct">100%</span>
        </div>
    </div>

    <!-- WebXR — Three.js loaded lazily on first AR tap -->
    <script>
    (function () {
        let THREE, GLTFLoader, GLTFExporter;
        let renderer, scene, camera, reticle, xrCanvas;
        let carouselRoot, slotGroups = [];
        let gestureLayer, xrOverlay;
        let hitTestSource = null, xrSession = null, xrStarting = false;
        let placed = false, isAnimating = false, _ignoreNextSelect = false;
        let _reticleWasVisible = false;
        let _xrSingleItem = (localStorage.getItem('bl-xr-view') || 'single') === 'single';

        let MENU = [], N = 0;
        const mod = i => ((i % N) + N) % N;
        let currentCenterMenu = 0;
        let slotOf     = { left: 0, center: 1, right: 2, hidden: 3 };
        let menuOf     = [0, 0, 0, 0];
        let hiddenSide = 'farRight';
        const meshObjs   = [null, null, null, null];
        const modelGLTFs = {};
        let loader;
        let labelMesh = null, labelCanvas = null, labelCtx = null, labelTexture = null;
        let labelMode = localStorage.getItem('bl-xr-label') || 'float';

        const CFG = {
            farLeft:  { x: -0.35, z: -0.12, s: 0.85, opacity: 0    },
            left:     { x: -0.14, z: -0.08, s: 0.85, opacity: 0.65 },
            center:   { x:  0,    z:  0,    s: 1.0,  opacity: 1.0  },
            right:    { x:  0.14, z: -0.08, s: 0.85, opacity: 0.65 },
            farRight: { x:  0.35, z: -0.12, s: 0.85, opacity: 0    },
        };
        const _roleOp = role => _xrSingleItem ? (role === 'center' ? 1.0 : 0) : CFG[role].opacity;

        const INIT_ROLES    = ['left', 'center', 'right', 'farRight'];
        const DUR           = 350;
        const ROTATE_SCALE  = 0.0125;
        const INERTIA_DAMP  = 0.88;
        let   _rotVelocity  = 0;
        const SCALE_MIN     = 0.2;
        const SCALE_MAX     = 4.0;
        const DEAD_ZONE     = 3;
        const MAX_DELTA     = 40;
        const activeTouches = new Map();
        let _pinchDist0 = null, _pinchScale0 = null, _scaleHideTimer = null;
        let _xrUIHidden = false;
        let _lastTouchStart = null;
        const _LOG_MIN = Math.log(SCALE_MIN), _LOG_MAX = Math.log(SCALE_MAX);

        const UI = {
            en: {
                hintStep1: 'STEP 1 OF 2', hintScan: 'Move slowly over a table or floor',
                hintStep2: 'STEP 2 OF 2', hintTap: 'Tap to place your dish',
                moveHint: 'Drag to move · Pinch to scale',
                exitAR: 'Exit AR', placeAgain: 'Place Again',
                carouselBtn: 'CAROUSEL', singleBtn: 'SINGLE ITEM',
                onTable: 'ON TABLE', floating: 'FLOATING',
                hideUI: 'HIDE UI', showUI: 'SHOW UI',
            }
        };

        function _showScaleGauge() {
            if (_xrUIHidden) return;
            const s = carouselRoot.scale.x;
            const fill = (Math.log(s) - _LOG_MIN) / (_LOG_MAX - _LOG_MIN) * 100;
            document.getElementById('xr-scale-fill').style.width = fill.toFixed(1) + '%';
            document.getElementById('xr-scale-pct').textContent  = Math.round(s * 100) + '%';
            document.getElementById('xr-scale-gauge').style.display = 'block';
            if (_scaleHideTimer) { clearTimeout(_scaleHideTimer); _scaleHideTimer = null; }
        }
        function _hideScaleGauge(delay) {
            if (_scaleHideTimer) clearTimeout(_scaleHideTimer);
            _scaleHideTimer = setTimeout(() => {
                document.getElementById('xr-scale-gauge').style.display = 'none';
                _scaleHideTimer = null;
            }, delay);
        }

        function _rrPath(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y,     x + w, y + r,     r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x,     y + h, x,         y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x,     y,     x + r,     y,         r);
            ctx.closePath();
        }

        function _wrapText(ctx, text, x, y, maxW, lh, maxLines) {
            const words = text.split(' ');
            let line = '', count = 0;
            for (const word of words) {
                const test = line ? line + ' ' + word : word;
                if (ctx.measureText(test).width > maxW && line) {
                    ctx.fillText(line, x, y + count * lh);
                    if (++count >= maxLines) return;
                    line = word;
                } else { line = test; }
            }
            if (line) ctx.fillText(line, x, y + count * lh);
        }

        function drawLabel(item) {
            if (!labelCtx) return;
            const ctx = labelCtx;
            const W = labelCanvas.width, H = labelCanvas.height;
            const name = item.name;
            const desc = item.description;
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(8, 8, 8, 0.92)';
            _rrPath(ctx, 6, 6, W - 12, H - 12, 20);
            ctx.fill();
            ctx.strokeStyle = 'rgba(240, 192, 64, 0.7)';
            ctx.lineWidth = 3;
            _rrPath(ctx, 6, 6, W - 12, H - 12, 20);
            ctx.stroke();
            ctx.fillStyle = '#f0c040';
            ctx.font = 'bold 44px Arial, sans-serif';
            ctx.fillText(name, 28, 52, W - 56);
            ctx.strokeStyle = 'rgba(240, 192, 64, 0.30)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(28, 66); ctx.lineTo(W - 28, 66); ctx.stroke();
            ctx.fillStyle = '#c0c0c0';
            ctx.font = '22px Arial, sans-serif';
            _wrapText(ctx, desc, 28, 88, W - 56, 28, 3);
            ctx.fillStyle = '#f0c040';
            ctx.font = 'bold 36px Arial, sans-serif';
            ctx.fillText(item.price, 28, H - 20);
            if (labelTexture) labelTexture.needsUpdate = true;
        }

        function createLabelMesh() {
            const W = 512, H = 210;
            labelCanvas = document.createElement('canvas');
            labelCanvas.width = W; labelCanvas.height = H;
            labelCtx = labelCanvas.getContext('2d');
            labelTexture = new THREE.CanvasTexture(labelCanvas);
            const mat = new THREE.MeshBasicMaterial({
                map: labelTexture, transparent: true, depthWrite: false, depthTest: false, side: THREE.DoubleSide
            });
            const planeW = 0.15, planeH = planeW * H / W;
            labelMesh = new THREE.Mesh(new THREE.PlaneGeometry(planeW, planeH), mat);
            labelMesh.position.set(0, 0.22, 0.015);
            labelMesh.visible = false;
            carouselRoot.add(labelMesh);
        }

        function updateLabelTransform() {
            if (!labelMesh) return;
            if (labelMode === 'float') labelMesh.position.set(0, 0.22, 0.015);
            const btn = document.getElementById('xr-label-toggle');
            if (btn) btn.textContent = labelMode === 'float' ? UI.en.onTable : UI.en.floating;
        }

        function preloadModels() {
            const paths = [...new Set(MENU.map(m => m.model).filter(Boolean))];
            return Promise.allSettled(paths.map(p => {
                if (modelGLTFs[p]) return Promise.resolve();
                if (_modelLoadPromises[p]) return _modelLoadPromises[p];
                _modelLoadPromises[p] = new Promise((res, rej) =>
                    loader.load(p, gltf => { modelGLTFs[p] = gltf; res(); }, undefined, rej)
                );
                return _modelLoadPromises[p];
            }));
        }

        function cloneModel(menuIdx) {
            const gltf = modelGLTFs[MENU[menuIdx].model];
            if (!gltf) return null;
            const obj = gltf.scene.clone(true);
            obj.traverse(n => { if (n.isMesh && n.material) n.material = n.material.clone(); });
            return obj;
        }

        function setSlotModel(slotIdx, menuIdx) {
            const old = meshObjs[slotIdx];
            if (old) slotGroups[slotIdx].remove(old);
            const obj = cloneModel(menuIdx);
            if (obj) {
                const arScale = MENU[menuIdx].ar_scale || 1.0;
                if (arScale !== 1.0) obj.scale.setScalar(arScale);
                const seated = new THREE.Box3().setFromObject(obj);
                if (isFinite(seated.min.y)) obj.position.y = -seated.min.y;
                slotGroups[slotIdx].add(obj);
                meshObjs[slotIdx] = obj;
            }
        }

        function initSlots() {
            const c = currentCenterMenu;
            menuOf = [mod(c - 1), c, mod(c + 1), mod(c + 2)];
            for (let i = 0; i < 4; i++) setSlotModel(i, menuOf[i]);
            const opacities = [_roleOp('left'), _roleOp('center'), _roleOp('right'), 0];
            INIT_ROLES.forEach((role, i) => {
                slotGroups[i].position.x = CFG[role].x;
                slotGroups[i].position.z = CFG[role].z;
                slotGroups[i].scale.setScalar(CFG[role].s);
                slotGroups[i].rotation.set(0, 0, 0);
                setOpacity(i, opacities[i]);
            });
        }

        function setOpacity(idx, opacity) {
            const obj = meshObjs[idx];
            if (!obj) return;
            obj.traverse(n => {
                if (n.isMesh && n.material) {
                    n.material.transparent = opacity < 1.0;
                    n.material.opacity     = Math.max(0, Math.min(1, opacity));
                    n.material.needsUpdate = true;
                }
            });
        }

        function animOpacity(idx, from, to, dur) {
            const t0 = performance.now();
            (function tick(now) {
                const t = Math.min((now - t0) / dur, 1);
                const e = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
                setOpacity(idx, from + (to - from) * e);
                if (t < 1) requestAnimationFrame(tick);
            })(performance.now());
        }

        function snapSlot(idx, role) {
            slotGroups[idx].position.x = CFG[role].x;
            slotGroups[idx].position.z = CFG[role].z;
            slotGroups[idx].scale.setScalar(CFG[role].s);
        }

        function animSlot(idx, role, dur) {
            const x0 = slotGroups[idx].position.x, x1 = CFG[role].x;
            const z0 = slotGroups[idx].position.z, z1 = CFG[role].z;
            const s0 = slotGroups[idx].scale.x,    s1 = CFG[role].s;
            const t0 = performance.now();
            (function tick(now) {
                const t = Math.min((now - t0) / dur, 1);
                const e = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
                slotGroups[idx].position.x = x0 + (x1 - x0) * e;
                slotGroups[idx].position.z = z0 + (z1 - z0) * e;
                slotGroups[idx].scale.setScalar(s0 + (s1 - s0) * e);
                if (t < 1) requestAnimationFrame(tick);
            })(performance.now());
        }

        function goNext() {
            if (isAnimating) return;
            isAnimating = true;
            const { left: lIdx, center: cIdx, right: rIdx, hidden: hIdx } = slotOf;
            if (hiddenSide === 'farLeft') snapSlot(hIdx, 'farRight');
            menuOf[hIdx] = mod(menuOf[rIdx] + 1);
            setSlotModel(hIdx, menuOf[hIdx]); setOpacity(hIdx, 0);
            animSlot(lIdx, 'farLeft', DUR); animSlot(cIdx, 'left',  DUR);
            animSlot(rIdx, 'center',  DUR); animSlot(hIdx, 'right', DUR);
            animOpacity(lIdx, _roleOp('left'),    0,                DUR);
            animOpacity(cIdx, _roleOp('center'),  _roleOp('left'),  DUR);
            animOpacity(rIdx, _roleOp('right'),   _roleOp('center'), DUR);
            animOpacity(hIdx, 0,                  _roleOp('right'), DUR);
            setTimeout(() => {
                slotOf = { left: cIdx, center: rIdx, right: hIdx, hidden: lIdx };
                hiddenSide = 'farLeft'; currentCenterMenu = mod(currentCenterMenu + 1);
                isAnimating = false;
                if (labelMesh && labelMesh.visible) drawLabel(MENU[currentCenterMenu]);
            }, DUR + 10);
        }

        function goPrev() {
            if (isAnimating) return;
            isAnimating = true;
            const { left: lIdx, center: cIdx, right: rIdx, hidden: hIdx } = slotOf;
            if (hiddenSide === 'farRight') snapSlot(hIdx, 'farLeft');
            menuOf[hIdx] = mod(menuOf[lIdx] - 1);
            setSlotModel(hIdx, menuOf[hIdx]); setOpacity(hIdx, 0);
            animSlot(rIdx, 'farRight', DUR); animSlot(cIdx, 'right', DUR);
            animSlot(lIdx, 'center',   DUR); animSlot(hIdx, 'left',  DUR);
            animOpacity(rIdx, _roleOp('right'),   0,                 DUR);
            animOpacity(cIdx, _roleOp('center'),  _roleOp('right'),  DUR);
            animOpacity(lIdx, _roleOp('left'),    _roleOp('center'), DUR);
            animOpacity(hIdx, 0,                  _roleOp('left'),   DUR);
            setTimeout(() => {
                slotOf = { left: hIdx, center: lIdx, right: cIdx, hidden: rIdx };
                hiddenSide = 'farRight'; currentCenterMenu = mod(currentCenterMenu - 1);

            const scale    = arScale || 1.0;
            const cacheKey = scale !== 1.0 ? `${modelUrl}::${scale}` : modelUrl;
            if (_iosSeatedBlobs[cacheKey]) return _iosSeatedBlobs[cacheKey];
            const root = gltf.scene.clone(true);
            root.traverse(n => { if (n.isMesh && n.material) n.material = n.material.clone(); });
            if (scale !== 1.0) root.scale.setScalar(scale);
            root.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(root);
            if (isFinite(box.min.y) && box.min.y < -0.001) {
                root.position.y = -box.min.y;
                root.updateMatrixWorld(true);
            }
            return new Promise(resolve => {
                try {
                    new GLTFExporter().parse(
                        root,
                        glb => {
                            const url = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
                            _iosSeatedBlobs[cacheKey] = url;
                            resolve(url);
                        },
                        err => { console.warn('iOS seat export:', err); resolve(null); },
                        { binary: true }
                    );

            });

                // Background preload for seated blobs
                setTimeout(() => window.XR?.backgroundPreload?.(items), 300);
            } else {
                // Android WebXR: background preload
                setTimeout(() => window.XR?.backgroundPreload?.(items), 200);
            }

            btn.disabled = false;
            btn.textContent = 'TAP TO START AR';

            btn.addEventListener('click', async () => {
                if (_arOpening) return;
                _arOpening = true;
                btn.disabled = true;
                btn.textContent = 'Loading…';

                if (cap === 'arkit') {
                    const item    = allItems[_iosSelectedIdx];
                    const launcher = _getARLauncher(item.model, item.ar_scale);
                    _launchIOSAR(launcher, item);
                } else {
                    try {
                        await window.XR.start(0, allItems);
                    } catch (e) {
                        console.error(e);
                        _arOpening = false;
                        btn.disabled = false;
                        btn.textContent = 'TAP TO START AR';
                    }
                }
            });
        }

        init();
    })();
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            let _swReloaded = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (_swReloaded) return;
                _swReloaded = true;
                location.reload();
            });
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../sw.js', { updateViaCache: 'none' }).then(reg => {
                    reg.update().catch(() => {});
                    reg.addEventListener('updatefound', () => {
                        const newSW = reg.installing;
                        if (!newSW) return;
                        newSW.addEventListener('statechange', () => {
                            if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                                newSW.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                }).catch(() => {});
            });
        }
    </script>
</body>
</html>
