<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D AR Menu</title>
    <meta name="description" content="Interactive 3D AR Menu. View dishes in Augmented Reality before you order.">
    <meta property="og:title" content="3D AR Menu">
    <meta property="og:description" content="Browse the menu and place dishes on your table in Augmented Reality.">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        :root { --t: 0.22s ease; }

        [data-theme="night"] {
            --bg:          #0f0b07;
            --card:        #1d1610;
            --card2:       #261d13;
            --border:      rgba(242,181,53,0.22);
            --text:        #ede6d4;
            --dim:         #8a7a62;
            --accent:      #f2b535;
            --accent-text: #0f0b07;
            --thumb-bg:    #0a0806;
            --modal-bg:    #0f0b07;
        }

        [data-theme="day"] {
            --bg:          #f2e8d2;
            --card:        #f8f0de;
            --card2:       #e8dcca;
            --border:      rgba(155,98,8,0.22);
            --text:        #1c1308;
            --dim:         #6b5a3c;
            --accent:      #c07808;
            --accent-text: #ffffff;
            --thumb-bg:    #c8b898;
            --modal-bg:    #f2e8d2;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        button { touch-action: manipulation; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            padding: 0 16px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background var(--t), color var(--t);
            overflow-x: hidden;
        }

        .header {
            width: 100%;
            max-width: 450px;
            text-align: center;
            padding: 64px 0 24px;
        }

        .header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.8rem, 10vw, 3.8rem);
            letter-spacing: 8px;
            color: var(--accent);
            line-height: 1;
            transition: color var(--t);
        }

        .tagline {
            font-size: 0.68rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--dim);
            margin-top: 6px;
            font-weight: 700;
            transition: color var(--t);
        }

        #theme-toggle, #lang-toggle {
            position: fixed;
            top: 14px;
            z-index: 1000;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px 16px;
            cursor: pointer;
            color: var(--text);
            font-family: 'Nunito', sans-serif;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: background var(--t), color var(--t), border-color var(--t);
        }
        #theme-toggle { right: 14px; }
        #lang-toggle  { left: 14px; }
        #theme-toggle:active, #lang-toggle:active { opacity: 0.65; }

        .menu-list {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .menu-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: grid;
            grid-template-columns: 108px 1fr;
            grid-template-rows: auto 1fr;
            grid-template-areas: "name  right" "left  right";
            padding: 12px;
            column-gap: 12px;
            row-gap: 6px;
            transition: background var(--t), border-color var(--t);
            contain: content;
            touch-action: manipulation;
        }
        .menu-item:active { opacity: 0.75; transition: opacity 0.08s; }

        .thumb-wrap {
            width: 108px;
            height: 100%;
            min-height: 108px;
            border-radius: 14px;
            overflow: hidden;
            background: var(--thumb-bg);
            border: 1px solid var(--border);
            transition: background var(--t), border-color var(--t);
        }
        .thumb-wrap model-viewer {
            width: 100%;
            height: 100%;
            min-height: 108px;
            background: transparent;
            display: block;
            touch-action: pan-y;
        }
        .thumb-wrap .thumb-img {
            width: 100%;
            height: 100%;
            min-height: 108px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        .item-left {
            grid-area: left;
        }

        .item-right {
            grid-area: right;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            user-select: none;
        }

        .item-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            flex-shrink: 0;
            min-height: 34px;
        }

        .item-name {
            grid-area: name;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 1px;
            color: var(--accent);
            line-height: 1.2;
            transition: color var(--t);
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .ar-btn {
            background: var(--accent);
            color: var(--accent-text);
            border: none;
            border-radius: 9px;
            padding: 7px 10px;
            font-size: 0.63rem;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            letter-spacing: 0.8px;
            cursor: pointer;
            white-space: nowrap;
            text-transform: uppercase;
            display: block;
            width: 100%;
            margin-top: 6px;
            transition: background var(--t), opacity 0.15s;
        }
        .ar-btn:active { opacity: 0.7; transition: opacity 0.08s; }
        .ar-btn:disabled { opacity: 0.45; cursor: wait; }

        .ingredients {
            flex: 1;
            font-size: 0.72rem;
            color: var(--dim);
            line-height: 1.3;
            transition: color var(--t);
            overflow-wrap: break-word;
        }

        .price {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 1px;
            color: var(--accent);
            transition: color var(--t);
        }

        .category-header {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 5px;
            color: var(--accent);
            padding: 20px 4px 8px;
            border-bottom: 1px solid var(--border);
            width: 100%;
            max-width: 450px;
            transition: color var(--t), border-color var(--t);
        }

        /* ── Modal ── */
        #modal {
            position: fixed;
            inset: 0;
            background: var(--modal-bg);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s, background var(--t);
        }
        #modal.active { opacity: 1; }

        #modal-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(1.8rem, 6vw, 2.6rem);
            letter-spacing: 4px;
            color: var(--accent);
            text-align: center;
            width: 100%;
            padding: 0 24px;
            margin-top: 56px;
            line-height: 1.2;
            transition: color var(--t);
        }

        #modal-qty-wrap {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
        #modal-price {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(1.4rem, 5vw, 2rem);
            letter-spacing: 3px;
            color: var(--accent);
            text-align: center;
            margin-top: 6px;
            transition: color var(--t);
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--card2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            transition: background var(--t), color var(--t);
        }

        #modal-viewer {
            width: 95vw;
            height: 68vh;
            background: transparent;
            margin-top: 8px;
        }

        .tip {
            margin-top: 4px;
            color: var(--dim);
            font-size: 0.82rem;
            letter-spacing: 1px;
            transition: color var(--t);
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.5);
            color: var(--text);
            font-size: 1.4rem;
            line-height: 1;
            padding: 0;
            cursor: pointer;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-arrow:active { opacity: 0.65; }
        .left-arrow  { left: 10px; }
        .right-arrow { right: 10px; }

        /* ── WebXR overlay ── */
        #xr-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 51;
            pointer-events: none;
        }
        #xr-gesture-layer {
            display: none;
            position: absolute;
            inset: 0;
            pointer-events: all;
        }
        #xr-place-hint {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    background: rgba(0,0,0,0.65);
    padding: 10px 20px;
    border-radius: 20px;
    white-space: normal;
    text-align: center;
    width: 80%;
    max-width: 320px;
}
        #xr-nav-row {
            display: none;
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: all;
            align-items: center;
            gap: 16px;
            background: rgba(0,0,0,0.65);
            padding: 8px 20px;
            border-radius: 30px;
        }
        #xr-nav-row button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.35);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            pointer-events: all;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #xr-move-hint {
            display: none;
            position: absolute;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-family: 'Nunito', sans-serif;
            font-size: 12px;
            white-space: normal;
            text-align: center;
            max-width: 80%;
        }
        #xr-exit, #xr-carousel-toggle, #xr-label-toggle, #xr-place-again {
            pointer-events: all;
            position: absolute;
            background: rgba(0,0,0,0.65);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 13px;
            cursor: pointer;
        }
        #xr-exit             { top: 18px; right: 18px; }
        #xr-place-again      { top: 62px; right: 18px; display: none; }
        #xr-carousel-toggle  { top: 18px; left: 18px; display: none; }
        #xr-label-toggle     { top: 58px; left: 18px; display: none; }
        #xr-add-btn {
            display: none;
            pointer-events: all;
            position: absolute;
            bottom: 55px;
            right: 18px;
            background: rgba(0,0,0,0.45);
            color: rgba(255,255,255,0.55);
            border: 1.5px solid rgba(255,255,255,0.25);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        #xr-add-btn.visible   { display: flex; }
        #xr-add-btn.in-basket { background: rgba(240,192,64,0.92); color: #0d0d0d; border-color: transparent; }
        #xr-hint-step {
            font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
            color: rgba(255,255,255,.5); margin-bottom: 3px;
        }
        #xr-hint-main { font-size: 14px; color: #fff; }
        #xr-scale-gauge {
            display: none;
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.65);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 8px 16px;
            pointer-events: none;
            min-width: 130px;
            text-align: center;
        }
        #xr-scale-track {
            height: 4px;
            background: rgba(255,255,255,0.18);
            border-radius: 2px;
            position: relative;
            margin-bottom: 5px;
        }
        #xr-scale-fill {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            background: #f0c040;
            border-radius: 2px;
        }
        #xr-scale-mark {
            position: absolute;
            top: -3px;
            width: 2px;
            height: 10px;
            background: rgba(255,255,255,0.55);
            border-radius: 1px;
            left: calc(53.7% - 1px);
        }
        #xr-scale-pct {
            font-family: 'Nunito', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        /* ── Category filter bar ── */
        .cat-filter {
            width: 100%;
            max-width: 450px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 0 4px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .cat-filter::-webkit-scrollbar { display: none; }

        .cat-pill {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px 14px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--dim);
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background var(--t), border-color var(--t), color var(--t);
            touch-action: manipulation;
        }
        .cat-pill:active { opacity: 0.7; transition: opacity 0.08s; }
        .cat-pill.active {
            background: var(--accent);
            color: var(--accent-text);
            border-color: var(--accent);
        }

        .cat-section { display: contents; }

        /* ── Quantity stepper (add-to-basket control) ── */
        .qty-ctrl { flex-shrink: 0; }

        .qty-add-btn {
            background: transparent;
            color: var(--accent);
            border: 1.5px solid var(--accent);
            border-radius: 9px;
            width: 34px;
            height: 34px;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background var(--t), color var(--t), border-color var(--t), opacity 0.15s;
            touch-action: manipulation;
        }
        .qty-add-btn:active { opacity: 0.7; transition: opacity 0.08s; }

        .qty-stepper {
            display: none;
            align-items: stretch;
            border: 1.5px solid var(--accent);
            border-radius: 9px;
            overflow: hidden;
            height: 34px;
            box-sizing: border-box;
            transition: border-color var(--t);
        }
        .qty-stepper.visible { display: flex; }

        .qty-dec, .qty-inc {
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: 1rem;
            font-weight: 700;
            padding: 0 10px;
            cursor: pointer;
            line-height: 1;
            display: flex;
            align-items: center;
            touch-action: manipulation;
            transition: background var(--t), color var(--t);
            user-select: none;
        }
        .qty-dec { border-right: 1px solid var(--accent); }
        .qty-inc { border-left:  1px solid var(--accent); }
        .qty-dec:active, .qty-inc:active {
            background: var(--accent);
            color: var(--accent-text);
            transition: none;
        }

        .qty-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            color: var(--accent);
            min-width: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 2px;
            user-select: none;
            transition: color var(--t);
        }

        /* ── Basket bar (fixed bottom) ── */
        #basket-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--accent);
            color: var(--accent-text);
            padding: 15px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 5000;
            cursor: pointer;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), background var(--t);
            touch-action: manipulation;
            font-family: 'Nunito', sans-serif;
        }
        #basket-bar.visible { transform: translateY(0); }
        body.basket-bar-visible { padding-bottom: 80px; }
        #basket-bar-count { font-size: 0.82rem; font-weight: 700; }
        #basket-bar-delete {
            background: transparent;
            border: 1.5px solid var(--accent-text);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            color: var(--accent-text);
            display: flex;
            align-items: center;
            opacity: 0.75;
            touch-action: manipulation;
            transition: opacity 0.15s;
            flex-shrink: 0;
        }
        #basket-bar-delete:active { opacity: 1; transition: none; }
        #basket-bar-total {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 2px;
        }

        /* ── Basket panel ── */
        #basket-panel {
            position: fixed;
            inset: 0;
            z-index: 9000;
            display: none;
            flex-direction: column;
            background: var(--bg);
            opacity: 0;
            transition: opacity 0.22s ease, background var(--t);
        }
        #basket-panel.active { opacity: 1; }

        .basket-header {
            display: flex;
            align-items: center;
            padding: 20px 20px 14px;
            border-bottom: 1px solid var(--border);
            gap: 10px;
            transition: border-color var(--t);
        }
        #basket-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 4px;
            color: var(--accent);
            flex: 1;
            transition: color var(--t);
        }
        #basket-clear {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 12px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--dim);
            cursor: pointer;
            touch-action: manipulation;
            transition: border-color var(--t), color var(--t);
        }
        #basket-close {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 14px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            touch-action: manipulation;
            transition: background var(--t), color var(--t), border-color var(--t);
        }
        #basket-items {
            flex: 1;
            overflow-y: auto;
            padding: 8px 20px;
        }
        .basket-empty {
            color: var(--dim);
            text-align: center;
            padding: 48px 0;
            font-size: 0.9rem;
            transition: color var(--t);
        }
        .basket-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 0;
            border-bottom: 1px solid var(--border);
            transition: border-color var(--t);
        }
        .basket-item-name {
            flex: 1;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            color: var(--accent);
            transition: color var(--t);
        }
        .basket-qty {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card2);
            border-radius: 8px;
            padding: 3px 8px;
            transition: background var(--t);
        }
        .qty-btn {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1.1rem;
            width: 26px;
            height: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            transition: color var(--t);
        }
        .qty-count {
            font-weight: 700;
            font-size: 0.88rem;
            min-width: 18px;
            text-align: center;
            color: var(--text);
            transition: color var(--t);
        }
        .basket-item-price {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            color: var(--text);
            min-width: 56px;
            text-align: right;
            transition: color var(--t);
        }
.basket-footer {
            padding: 16px 20px;
            border-top: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color var(--t);
        }
        #basket-total-label {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: var(--dim);
            transition: color var(--t);
        }
        #basket-total {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 3px;
            color: var(--accent);
            transition: color var(--t);
        }

        /* ── Responsive: desktop grid layout ── */
        @media (min-width: 640px) {
            body { padding: 0 32px 64px; }

            .header, .cat-filter { max-width: 880px; }
            .cat-filter { justify-content: center; }

            .menu-list {
                max-width: 880px;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
                align-items: start;
            }

            .category-header {
                max-width: none;
                grid-column: 1 / -1;
                padding: 24px 2px 10px;
            }

            .menu-item {
                display: flex;
                flex-direction: column;
                padding: 0;
                overflow: hidden;
            }

            .item-left  { order: 1; width: 100%; }
            .item-name  { order: 2; padding: 10px 14px 4px; }
            .item-right { order: 3; padding: 4px 14px 14px; }

            .item-left .thumb-wrap {
                width: 100%;
                height: 220px;
                min-height: unset;
                border-radius: 16px 16px 0 0;
                border-bottom: none;
            }

        }

        @media (min-width: 1100px) {
            .header, .cat-filter { max-width: 1160px; }

            .menu-list {
                max-width: 1160px;
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }

            .item-left .thumb-wrap { height: 240px; }
        }

        /* ── Modal AR button ── */
        #modal-ar-btn {
            display: none;
            background: var(--accent);
            color: var(--accent-text);
            border: none;
            border-radius: 12px;
            padding: 14px 0;
            width: 80%;
            max-width: 320px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 14px;
            transition: background var(--t), opacity 0.15s;
            touch-action: manipulation;
        }
        #modal-ar-btn:active  { opacity: 0.7; transition: opacity 0.08s; }
        #modal-ar-btn:disabled { opacity: 0.45; cursor: wait; }

    </style>
</head>
<body>

    <button id="theme-toggle" aria-label="Toggle theme">Day</button>
    <button id="lang-toggle" aria-label="Toggle language">KA</button>

    <div class="header">
        <h1>3D AR Menu</h1>
        <div class="tagline" id="tagline"></div>
    </div>

    <div id="cat-filter" class="cat-filter"></div>

    <div class="menu-list" id="menu-list"></div>

    <div id="modal">
        <button class="nav-arrow left-arrow"  id="modal-prev">&#10094;</button>
        <button class="nav-arrow right-arrow" id="modal-next">&#10095;</button>
        <button class="close-btn" id="close-btn">Close</button>
        <div id="modal-title"></div>
        <div style="position:relative;display:inline-block;width:95vw;">
            <model-viewer id="modal-viewer"
                camera-controls
                shadow-intensity="1"
                min-camera-orbit="auto 0deg auto"
                max-camera-orbit="auto 85deg auto">
            </model-viewer>
            <div style="position:absolute;inset:0;pointer-events:none;border-radius:inherit;
                        background:radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.55) 100%);">
            </div>
        </div>
        <div id="modal-price"></div>
        <div id="modal-qty-wrap">
            <div class="qty-ctrl" id="modal-qty-ctrl" data-idx="0">
                <button class="qty-add-btn" aria-label="Add to basket"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></button>
                <div class="qty-stepper">
                    <button class="qty-dec">&#8722;</button>
                    <span class="qty-num">1</span>
                    <button class="qty-inc">+</button>
                </div>
            </div>
        </div>
        <button id="modal-ar-btn"></button>
        <p class="tip" id="modal-tip">Drag to rotate</p>
    </div>

    <div id="xr-overlay">
        <div id="xr-gesture-layer"></div>
        <div id="xr-place-hint">
            <div id="xr-hint-step"></div>
            <div id="xr-hint-main"></div>
        </div>
        <div id="xr-nav-row">
            <button id="xr-prev">&#10094;</button>
            <button id="xr-next">&#10095;</button>
        </div>
        <div id="xr-move-hint">Drag to move &middot; Twist two fingers to rotate</div>
        <button id="xr-exit">Exit AR</button>
        <button id="xr-place-again"></button>
        <button id="xr-carousel-toggle"></button>
        <button id="xr-label-toggle"></button>
        <div id="xr-scale-gauge">
            <div id="xr-scale-track">
                <div id="xr-scale-fill"></div>

            </div>
            <span id="xr-scale-pct">100%</span>
        </div>
        <button id="xr-add-btn" aria-label="Add to basket">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        </button>
    </div>


    <!-- Basket bar -->
    <div id="basket-bar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;margin-right:8px"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span id="basket-bar-count"></span>
        <span id="basket-bar-total"></span>
        <button id="basket-bar-delete" aria-label="Clear basket">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
    </div>

    <!-- Basket panel -->
    <div id="basket-panel">
        <div class="basket-header">
            <span id="basket-title">Basket</span>
            <button id="basket-clear">Clear</button>
            <button id="basket-close">Close</button>
        </div>
        <div id="basket-items"></div>
        <div class="basket-footer">
            <span id="basket-total-label">Total</span>
            <span id="basket-total">0 ₾</span>
        </div>
    </div>

    <!-- WebXR — Three.js loaded lazily on first AR tap, not on page load -->
    <script>
    (function () {
        let THREE, GLTFLoader;
        let renderer, scene, camera, reticle, xrCanvas;
        let carouselRoot, slotGroups = [];
        let gestureLayer, xrOverlay;
        let hitTestSource = null, xrSession = null, xrStarting = false;
        let placed = false, isAnimating = false, _ignoreNextSelect = false;
        let _reticleWasVisible = false;
        let _xrSingleItem = (localStorage.getItem('bl-xr-view') || 'single') === 'single';

        let MENU = [], N = 0;
        const mod = i => ((i % N) + N) % N;
        let currentCenterMenu = 0;
        let slotOf     = { left: 0, center: 1, right: 2, hidden: 3 };
        let menuOf     = [0, 0, 0, 0];
        let hiddenSide = 'farRight';
        const meshObjs   = [null, null, null, null];
        const modelGLTFs = {};
        let loader;
        let labelMesh = null, labelCanvas = null, labelCtx = null, labelTexture = null;
        let labelMode = localStorage.getItem('bl-xr-label') || 'float';

        const CFG = {
            farLeft:  { x: -0.35, z: -0.12, s: 0.85, opacity: 0    },
            left:     { x: -0.14, z: -0.08, s: 0.85, opacity: 0.65 },
            center:   { x:  0,    z:  0,    s: 1.0,  opacity: 1.0  },
            right:    { x:  0.14, z: -0.08, s: 0.85, opacity: 0.65 },
            farRight: { x:  0.35, z: -0.12, s: 0.85, opacity: 0    },
        };
        // Returns target opacity for a role based on current view mode
        const _roleOp = role => _xrSingleItem ? (role === 'center' ? 1.0 : 0) : CFG[role].opacity;

        const INIT_ROLES    = ['left', 'center', 'right', 'farRight'];
        const DUR           = 350;
        const ROTATE_SCALE  = 0.0125;
        const INERTIA_DAMP  = 0.88;
        let   _rotVelocity  = 0;
        const SCALE_MIN     = 0.2;
        const SCALE_MAX     = 4.0;
        const DEAD_ZONE     = 3;
        const MAX_DELTA     = 40;
        const activeTouches = new Map();
        let _pinchDist0 = null, _pinchScale0 = null, _scaleHideTimer = null;
        const _LOG_MIN = Math.log(SCALE_MIN), _LOG_MAX = Math.log(SCALE_MAX);
        function _showScaleGauge() {
            const s = carouselRoot.scale.x;
            const fill = (Math.log(s) - _LOG_MIN) / (_LOG_MAX - _LOG_MIN) * 100;
            document.getElementById('xr-scale-fill').style.width = fill.toFixed(1) + '%';
            document.getElementById('xr-scale-pct').textContent  = Math.round(s * 100) + '%';
            document.getElementById('xr-scale-gauge').style.display = 'block';
            if (_scaleHideTimer) { clearTimeout(_scaleHideTimer); _scaleHideTimer = null; }
        }
        function _hideScaleGauge(delay) {
            if (_scaleHideTimer) clearTimeout(_scaleHideTimer);
            _scaleHideTimer = setTimeout(() => {
                document.getElementById('xr-scale-gauge').style.display = 'none';
                _scaleHideTimer = null;
            }, delay);
        }

        // ── AR label (museum card) ────────────────────────────────────
        function _rrPath(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y,     x + w, y + r,     r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x,     y + h, x,         y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x,     y,     x + r,     y,         r);
            ctx.closePath();
        }

        function _wrapText(ctx, text, x, y, maxW, lh, maxLines) {
            const words = text.split(' ');
            let line = '', count = 0;
            for (const word of words) {
                const test = line ? line + ' ' + word : word;
                if (ctx.measureText(test).width > maxW && line) {
                    ctx.fillText(line, x, y + count * lh);
                    if (++count >= maxLines) return;
                    line = word;
                } else { line = test; }
            }
            if (line) ctx.fillText(line, x, y + count * lh);
        }

        function drawLabel(item) {
            if (!labelCtx) return;
            const ctx = labelCtx;
            const W = labelCanvas.width, H = labelCanvas.height;
            const lang = window.__lang || 'en';
            const name = (lang === 'ka' && item.name_ka)        ? item.name_ka        : item.name;
            const desc = (lang === 'ka' && item.description_ka) ? item.description_ka : item.description;

            ctx.clearRect(0, 0, W, H);

            ctx.fillStyle = 'rgba(8, 8, 8, 0.92)';
            _rrPath(ctx, 6, 6, W - 12, H - 12, 20);
            ctx.fill();

            ctx.strokeStyle = 'rgba(240, 192, 64, 0.7)';
            ctx.lineWidth = 3;
            _rrPath(ctx, 6, 6, W - 12, H - 12, 20);
            ctx.stroke();

            ctx.fillStyle = '#f0c040';
            ctx.font = 'bold 44px Arial, sans-serif';
            ctx.fillText(name, 28, 52, W - 56);

            ctx.strokeStyle = 'rgba(240, 192, 64, 0.30)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(28, 66); ctx.lineTo(W - 28, 66); ctx.stroke();

            ctx.fillStyle = '#c0c0c0';
            ctx.font = '22px Arial, sans-serif';
            _wrapText(ctx, desc, 28, 88, W - 56, 28, 3);

            ctx.fillStyle = '#f0c040';
            ctx.font = 'bold 36px Arial, sans-serif';
            ctx.fillText(item.price, 28, H - 20);

            if (labelTexture) labelTexture.needsUpdate = true;
        }

        function createLabelMesh() {
            const W = 512, H = 210;
            labelCanvas = document.createElement('canvas');
            labelCanvas.width = W; labelCanvas.height = H;
            labelCtx = labelCanvas.getContext('2d');
            labelTexture = new THREE.CanvasTexture(labelCanvas);
            const mat = new THREE.MeshBasicMaterial({
                map: labelTexture, transparent: true, depthWrite: false, side: THREE.DoubleSide
            });
            const planeW = 0.15, planeH = planeW * H / W;
            labelMesh = new THREE.Mesh(new THREE.PlaneGeometry(planeW, planeH), mat);
            labelMesh.position.set(0, 0.28, 0.06);
            labelMesh.visible = false;
            carouselRoot.add(labelMesh);
        }

        function updateLabelTransform() {
            if (!labelMesh) return;
            if (labelMode === 'float') {
                labelMesh.position.set(0, 0.28, 0.06);
            }
            // surface rotation updated per-frame in render loop
            const btn = document.getElementById('xr-label-toggle');
            const u = UI[window.__lang || 'en'];
            if (btn) btn.textContent = labelMode === 'float' ? u.onTable : u.floating;
        }

        // ── Models ────────────────────────────────────────────────────
        function preloadModels() {
            const paths = [...new Set(MENU.map(m => m.model || 'food.glb'))];
            return Promise.all(paths.map(p =>
                new Promise((res, rej) =>
                    loader.load(p, gltf => { modelGLTFs[p] = gltf; res(); }, undefined, rej)
                )
            ));
        }

        function cloneModel(menuIdx) {
            const gltf = modelGLTFs[MENU[menuIdx].model || 'food.glb'];
            if (!gltf) return null;
            const obj = gltf.scene.clone(true);
            obj.traverse(n => { if (n.isMesh && n.material) n.material = n.material.clone(); });
            return obj;
        }

        function setSlotModel(slotIdx, menuIdx) {
            const old = meshObjs[slotIdx];
            if (old) slotGroups[slotIdx].remove(old);
            const obj = cloneModel(menuIdx);
            if (obj) {
                // Trust the GLB's own scale (1 unit = 1 metre).
                // ar_scale is an optional per-item override (default 1.0 = no change).
                const arScale = MENU[menuIdx].ar_scale || 1.0;
                if (arScale !== 1.0) obj.scale.setScalar(arScale);
                // Seat the model: bottom of bounding box sits at y=0
                const seated = new THREE.Box3().setFromObject(obj);
                if (isFinite(seated.min.y)) obj.position.y = -seated.min.y;
                slotGroups[slotIdx].add(obj);
                meshObjs[slotIdx] = obj;
            }
        }

        function initSlots() {
            const c = currentCenterMenu;
            menuOf = [mod(c - 1), c, mod(c + 1), mod(c + 2)];
            for (let i = 0; i < 4; i++) setSlotModel(i, menuOf[i]);
            const opacities = [_roleOp('left'), _roleOp('center'), _roleOp('right'), 0];
            INIT_ROLES.forEach((role, i) => {
                slotGroups[i].position.x = CFG[role].x;
                slotGroups[i].position.z = CFG[role].z;
                slotGroups[i].scale.setScalar(CFG[role].s);
                slotGroups[i].rotation.set(0, 0, 0);
                setOpacity(i, opacities[i]);
            });
            _syncXRAddBtn();
        }

        // ── Opacity ───────────────────────────────────────────────────
        function setOpacity(idx, opacity) {
            const obj = meshObjs[idx];
            if (!obj) return;
            obj.traverse(n => {
                if (n.isMesh && n.material) {
                    n.material.transparent = opacity < 1.0;
                    n.material.opacity     = Math.max(0, Math.min(1, opacity));
                    n.material.needsUpdate = true;
                }
            });
        }

        function animOpacity(idx, from, to, dur) {
            const t0 = performance.now();
            (function tick(now) {
                const t = Math.min((now - t0) / dur, 1);
                const e = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
                setOpacity(idx, from + (to - from) * e);
                if (t < 1) requestAnimationFrame(tick);
            })(performance.now());
        }

        // ── Slot animation ────────────────────────────────────────────
        function snapSlot(idx, role) {
            slotGroups[idx].position.x = CFG[role].x;
            slotGroups[idx].position.z = CFG[role].z;
            slotGroups[idx].scale.setScalar(CFG[role].s);
        }

        function animSlot(idx, role, dur) {
            const x0 = slotGroups[idx].position.x, x1 = CFG[role].x;
            const z0 = slotGroups[idx].position.z, z1 = CFG[role].z;
            const s0 = slotGroups[idx].scale.x,    s1 = CFG[role].s;
            const t0 = performance.now();
            (function tick(now) {
                const t = Math.min((now - t0) / dur, 1);
                const e = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
                slotGroups[idx].position.x = x0 + (x1 - x0) * e;
                slotGroups[idx].position.z = z0 + (z1 - z0) * e;
                slotGroups[idx].scale.setScalar(s0 + (s1 - s0) * e);
                if (t < 1) requestAnimationFrame(tick);
            })(performance.now());
        }

        // ── Navigation ────────────────────────────────────────────────
        function goNext() {
            if (isAnimating) return;
            isAnimating = true;
            const { left: lIdx, center: cIdx, right: rIdx, hidden: hIdx } = slotOf;
            if (hiddenSide === 'farLeft') snapSlot(hIdx, 'farRight');
            menuOf[hIdx] = mod(menuOf[rIdx] + 1);
            setSlotModel(hIdx, menuOf[hIdx]); setOpacity(hIdx, 0);
            animSlot(lIdx, 'farLeft', DUR); animSlot(cIdx, 'left',  DUR);
            animSlot(rIdx, 'center',  DUR); animSlot(hIdx, 'right', DUR);
            animOpacity(lIdx, _roleOp('left'),    0,                DUR);
            animOpacity(cIdx, _roleOp('center'),  _roleOp('left'),  DUR);
            animOpacity(rIdx, _roleOp('right'),   _roleOp('center'), DUR);
            animOpacity(hIdx, 0,                  _roleOp('right'), DUR);
            setTimeout(() => {
                slotOf = { left: cIdx, center: rIdx, right: hIdx, hidden: lIdx };
                hiddenSide = 'farLeft'; currentCenterMenu = mod(currentCenterMenu + 1);
                isAnimating = false;
                if (labelMesh && labelMesh.visible) drawLabel(MENU[currentCenterMenu]);
                _syncXRAddBtn();
                const _nItem = MENU[currentCenterMenu];
                const _nIdx  = (_nItem && window.__menuItems) ? window.__menuItems.indexOf(_nItem) : -1;
                if (_nIdx >= 0) window._arViewedItems?.add(_nIdx);
                window.track?.('xr_nav', _nIdx >= 0 ? _nIdx : null, { direction: 'next' });
            }, DUR + 10);
        }

        function goPrev() {
            if (isAnimating) return;
            isAnimating = true;
            const { left: lIdx, center: cIdx, right: rIdx, hidden: hIdx } = slotOf;
            if (hiddenSide === 'farRight') snapSlot(hIdx, 'farLeft');
            menuOf[hIdx] = mod(menuOf[lIdx] - 1);
            setSlotModel(hIdx, menuOf[hIdx]); setOpacity(hIdx, 0);
            animSlot(rIdx, 'farRight', DUR); animSlot(cIdx, 'right', DUR);
            animSlot(lIdx, 'center',   DUR); animSlot(hIdx, 'left',  DUR);
            animOpacity(rIdx, _roleOp('right'),   0,                 DUR);
            animOpacity(cIdx, _roleOp('center'),  _roleOp('right'),  DUR);
            animOpacity(lIdx, _roleOp('left'),    _roleOp('center'), DUR);
            animOpacity(hIdx, 0,                  _roleOp('left'),   DUR);
            setTimeout(() => {
                slotOf = { left: hIdx, center: lIdx, right: cIdx, hidden: rIdx };
                hiddenSide = 'farRight'; currentCenterMenu = mod(currentCenterMenu - 1);
                isAnimating = false;
                if (labelMesh && labelMesh.visible) drawLabel(MENU[currentCenterMenu]);
                _syncXRAddBtn();
                const _pItem = MENU[currentCenterMenu];
                const _pIdx  = (_pItem && window.__menuItems) ? window.__menuItems.indexOf(_pItem) : -1;
                if (_pIdx >= 0) window._arViewedItems?.add(_pIdx);
                window.track?.('xr_nav', _pIdx >= 0 ? _pIdx : null, { direction: 'prev' });
            }, DUR + 10);
        }

        // ── Scan/tap hint state ───────────────────────────────────────
        function _updateScanHint(found) {
            const stepEl = document.getElementById('xr-hint-step');
            const mainEl = document.getElementById('xr-hint-main');
            if (!stepEl) return;
            const u = UI[window.__lang || 'en'];
            stepEl.textContent = found ? u.hintStep2 : u.hintStep1;
            mainEl.textContent = found ? u.hintTap   : u.hintScan;
        }

        // ── Add-btn basket state sync ─────────────────────────────────
        function _syncXRAddBtn() {
            const btn = document.getElementById('xr-add-btn');
            if (!btn || !window.__menuItems) return;
            const item = MENU.length ? MENU[currentCenterMenu] : null;
            const idx  = item ? window.__menuItems.indexOf(item) : -1;
            const inBasket = idx >= 0 && window._basket && window._basket.has(String(idx));
            btn.classList.toggle('in-basket', inBasket);
        }

        // ── Placement ─────────────────────────────────────────────────
        function onSelect() {
            if (_ignoreNextSelect) { _ignoreNextSelect = false; return; }
            if (placed || !reticle.visible) return;
            carouselRoot.position.setFromMatrixPosition(reticle.matrix);
            carouselRoot.quaternion.setFromRotationMatrix(reticle.matrix);
            carouselRoot.visible = true;
            reticle.visible      = false;
            placed               = true;
            const _plItem = MENU[currentCenterMenu];
            const _plIdx  = (_plItem && window.__menuItems) ? window.__menuItems.indexOf(_plItem) : -1;
            window.track?.('ar_placed', _plIdx >= 0 ? _plIdx : null);
            gestureLayer.style.display = 'block';
            document.getElementById('xr-place-hint').style.display      = 'none';
            document.getElementById('xr-place-again').style.display     = 'block';
            document.getElementById('xr-nav-row').style.display          = 'flex';
            document.getElementById('xr-move-hint').style.display        = 'block';
            document.getElementById('xr-carousel-toggle').style.display  = 'block';
            if (labelMesh) { drawLabel(MENU[currentCenterMenu]); updateLabelTransform(); labelMesh.visible = true; }
            document.getElementById('xr-label-toggle').style.display = 'block';
        }

        function _resetPlacement() {
            _ignoreNextSelect = true;
            placed = false;
            carouselRoot.scale.setScalar(1);
            _pinchDist0 = null; _pinchScale0 = null;
            if (_scaleHideTimer) { clearTimeout(_scaleHideTimer); _scaleHideTimer = null; }
            document.getElementById('xr-scale-gauge').style.display = 'none';
            carouselRoot.visible = false;
            reticle.visible = false;
            gestureLayer.style.display = 'none';
            document.getElementById('xr-place-hint').style.display      = '';
            _reticleWasVisible = false; _updateScanHint(false);
            document.getElementById('xr-place-again').style.display     = 'none';
            document.getElementById('xr-nav-row').style.display          = 'none';
            document.getElementById('xr-move-hint').style.display        = 'none';
            document.getElementById('xr-carousel-toggle').style.display  = 'none';
            document.getElementById('xr-label-toggle').style.display     = 'none';
            if (labelMesh) labelMesh.visible = false;
        }

        // ── One-time init — deferred until first AR tap ───────────────
        let _setupDone = false;

        async function _setup() {
            if (_setupDone) return;
            _setupDone = true;

            const [threeNS, loaderMod, dracoMod] = await Promise.all([
                import('https://esm.sh/three@0.155.0'),
                import('https://esm.sh/three@0.155.0/examples/jsm/loaders/GLTFLoader'),
                import('https://esm.sh/three@0.155.0/examples/jsm/loaders/DRACOLoader'),
            ]);
            THREE      = threeNS;
            GLTFLoader = loaderMod.GLTFLoader;

                track('ar_fallback', _fbIdx >= 0 ? _fbIdx : null);
                openModal(e.detail.fallbackIdx, _fbItems);

                track('ar_duration', null, { duration_ms: _arEndMs - _arStartTime });
            }
            _arStartTime = null;
        });

        // ── Modal ──────────────────────────────────────────────────────
        const modal       = document.getElementById('modal');
        const modalViewer = document.getElementById('modal-viewer');
        const modalTitle  = document.getElementById('modal-title');
        const modalPrice  = document.getElementById('modal-price');

        let modalItems = [];
        let modalIndex = 0;

        const modalQtyCtrl = document.getElementById('modal-qty-ctrl');
        modalQtyCtrl.querySelector('.qty-add-btn').addEventListener('click', e => { e.stopPropagation(); const k = modalQtyCtrl.dataset.idx; addToBasket(k, modalItems[modalIndex]); });
        modalQtyCtrl.querySelector('.qty-dec').addEventListener('click',     e => { e.stopPropagation(); const k = modalQtyCtrl.dataset.idx; const en = _basket.get(k); if (en) _setQty(k, en.qty - 1); });

            closeModal();

            e.stopPropagation();

            e.stopPropagation();
            modalIndex = (modalIndex + 1) % modalItems.length;

        function updateModal() {
            const item = modalItems[modalIndex];
            if (!item) return;
            modalViewer.src        = item.model || '';
            if (item.thumbnail_url) modalViewer.setAttribute('poster', item.thumbnail_url);
            else modalViewer.removeAttribute('poster');
            modalTitle.textContent = t(item, 'name');
            modalPrice.textContent = item.price;
            const key = String(modalIndex);
            document.getElementById('modal-qty-ctrl').dataset.idx = key;
            _syncQtyCtrl(key);
        }

        function openModal(localIdx, catItems) {
            modalItems = catItems || menuItems;
            modalIndex = localIdx;
            const _viewItem = modalItems[localIdx];
            const _viewIdx  = (_viewItem && menuItems) ? menuItems.indexOf(_viewItem) : null;
            _modalOpenTime = Date.now();
            const _repeatView = _viewIdx >= 0 && _modalViewedItems.has(_viewIdx);
            if (_viewIdx >= 0) _modalViewedItems.add(_viewIdx);
            track('item_view', _viewIdx >= 0 ? _viewIdx : null, _repeatView ? { repeat: true } : null);
            _trackFirstInteraction('3d');
            updateModal();
            const cap = window.__arCap;
            modalArBtn.textContent  = UI[window.__lang].viewAR;
            modalArBtn.style.display = (cap && cap !== 'none') ? '' : 'none';
            modal.style.display = 'flex';
            requestAnimationFrame(() => modal.classList.add('active'));
            document.body.style.overflow = 'hidden';
            // Defer thumbnail teardown past the modal fade-in frame so it doesn't block animation
            requestAnimationFrame(() => {
                document.querySelectorAll('.thumb-wrap model-viewer').forEach(mv => {
                    if (!mv.src) return;
                    const t = _thumbUnload.get(mv);
                    if (t) { clearTimeout(t); _thumbUnload.delete(mv); }
                    mv.dataset.pausedSrc = mv.src;
                    mv.removeAttribute('src');
                });
            });
        }

        function closeModal() {
            const _closeItem = modalItems[modalIndex];
            const _closeIdx  = (_closeItem && menuItems) ? menuItems.indexOf(_closeItem) : null;
            track('modal_close', _closeIdx >= 0 ? _closeIdx : null,
                  { duration_ms: _modalOpenTime ? Date.now() - _modalOpenTime : null });
            _modalOpenTime = null;
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
                modalViewer.removeAttribute('src');
                document.querySelectorAll('.thumb-wrap model-viewer').forEach(mv => {
                    if (!mv.dataset.pausedSrc) return;
                    delete mv.dataset.pausedSrc;
                    const r = mv.getBoundingClientRect();
                    if (r.bottom > -100 && r.top < window.innerHeight + 100) _scheduleThumb(mv);
                });
            }, 200);
            document.body.style.overflow = '';
        }

        // ── AR capability detection ────────────────────────────────────
        async function detectAR() {
            const cached = localStorage.getItem('bl-ar-cap');
            const ts = parseInt(localStorage.getItem('bl-ar-cap-ts') || '0');
            if (cached && (Date.now() - ts < 7 * 24 * 60 * 60 * 1000)) { window.__arCap = cached; return cached; }

            const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            let cap = 'none';
            if (navigator.xr) {
                try {
                    if (await navigator.xr.isSessionSupported('immersive-ar')) cap = 'webxr';
                } catch {}
            }
            if (cap === 'none' && isIOS) cap = 'arkit';
            window.__arCap = cap;
            localStorage.setItem('bl-ar-cap', cap);
            localStorage.setItem('bl-ar-cap-ts', String(Date.now()));
            return cap;
        }

        function setARButtonsState(loading) {
            const u = UI[window.__lang];
            const label = loading ? u.loading : (window.__arCap === 'none' ? u.view3D : u.viewAR);
            document.querySelectorAll('.ar-btn').forEach(b => {
                b.textContent = label;
                b.disabled    = loading;
            });
        }

        // ── iOS AR launcher — hidden model-viewers pre-load so activateAR()
        //    can fire synchronously from the tap without losing the gesture context.
        const _arLaunchers = {};
        function _getARLauncher(src) {
            if (!_arLaunchers[src]) {
                const mv = document.createElement('model-viewer');
                mv.setAttribute('ar', '');
                mv.setAttribute('ar-modes', 'quick-look');
                mv.src = src;
                mv.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;top:-9999px;left:-9999px;';
                mv.addEventListener('load', () => {
                    if (!mv.model) return;
                    mv.model.materials.forEach(mat => {
                        const pbr = mat.pbrMetallicRoughness;
                        if (pbr) pbr.setMetallicFactor(0);
                    });
                });
                document.body.appendChild(mv);
                _arLaunchers[src] = mv;
            }
            return _arLaunchers[src];
        }

        // Pre-load both models on iOS so USDZ is ready before the user taps
        const _isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (_isIOS) {
            ['food.glb', 'Druidi.glb'].forEach(src => _getARLauncher(src));
            if (!window.__arCap) window.__arCap = 'arkit';
        }

        function _launchIOSAR(launcher, localIdx) {
            function onARStatus(e) {
                const s = e.detail.status;
                const _iosItem = _arCatItems ? _arCatItems[localIdx] : null;
                const _iosIdx  = (_iosItem && menuItems) ? menuItems.indexOf(_iosItem) : null;
                const _iosGIdx = _iosIdx >= 0 ? _iosIdx : null;
                if (s === 'failed') {
                    launcher.removeEventListener('ar-status', onARStatus);
                    track('ar_fallback', _iosGIdx);
                    setARButtonsState(false);
                    _arOpening = false;
                    openModal(localIdx, _arCatItems);
                } else if (s === 'session-started') {
                    launcher.removeEventListener('ar-status', onARStatus);
                    track('ar_success', _iosGIdx);
                }
            }
            launcher.addEventListener('ar-status', onARStatus);
            launcher.activateAR();
            setTimeout(() => { setARButtonsState(false); _arOpening = false; }, 2500);
        }

        // ── AR routing ─────────────────────────────────────────────────
        let _arOpening  = false;
        let _arCatItems = null;

        async function openAR(localIdx, catItems) {
            if (_arOpening) return;
            _arOpening  = true;
            _arCatItems = catItems || menuItems;
            const _tapItem = _arCatItems[localIdx];
            const _tapIdx  = (_tapItem && menuItems) ? menuItems.indexOf(_tapItem) : null;
            track('ar_tap', _tapIdx >= 0 ? _tapIdx : null,
                  { source: modal.classList.contains('active') ? 'modal' : 'card' });
            _trackFirstInteraction('ar');
            setARButtonsState(true);

            const cap  = window.__arCap ?? await detectAR();
            const item = _arCatItems[localIdx];

            if (!item) { setARButtonsState(false); _arOpening = false; return; }

            if (cap === 'webxr' && window.XR) {
                try {
                    await window.XR.start(localIdx, _arCatItems);
                } catch (err) {
                    console.error('XR start failed:', err);
                    openModal(localIdx, _arCatItems);
                    setARButtonsState(false);
                    _arOpening = false;
                }
            } else if (cap === 'arkit') {
                _launchIOSAR(_getARLauncher(item.model || 'food.glb'), localIdx);
            } else {
                // No AR support (non-ARCore Android, desktop) — open 3D modal
                openModal(localIdx, _arCatItems);
                setARButtonsState(false);
                _arOpening = false;
            }
        }

        // ── Thumbnail loader — staggered load, delayed unload ──────────────
        // Stagger prevents simultaneous WebGL context init spikes on page load.
        // No hard cap — every visible thumbnail loads; unload after 2s off-screen.
        const _thumbPending = new Set();
        const _thumbUnload  = new WeakMap();
        let   _thumbTimer   = null;

        function _drainThumbs() {
            _thumbTimer = null;
            const mv = _thumbPending.values().next().value;
            if (!mv) return;
            _thumbPending.delete(mv);
            if (mv.isConnected && !mv.src) mv.src = mv.dataset.src;
            if (_thumbPending.size > 0) _thumbTimer = setTimeout(_drainThumbs, 150);
        }

        function _scheduleThumb(mv) {
            const t = _thumbUnload.get(mv);
            if (t) { clearTimeout(t); _thumbUnload.delete(mv); }
            if (_thumbPending.has(mv) || mv.src) return;
            _thumbPending.add(mv);
            if (!_thumbTimer) _thumbTimer = setTimeout(_drainThumbs, 0);
        }

        function _unscheduleThumb(mv) {
            _thumbPending.delete(mv);
            if (!mv.src) return;
            const t = setTimeout(() => {
                _thumbUnload.delete(mv);
                if (!mv.dataset.pausedSrc) mv.removeAttribute('src');
                if (_thumbPending.size > 0 && !_thumbTimer)
                    _thumbTimer = setTimeout(_drainThumbs, 0);
            }, 2000);
            _thumbUnload.set(mv, t);
        }

        const thumbObserver = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) _scheduleThumb(entry.target);
                else                       _unscheduleThumb(entry.target);
            });
        }, { rootMargin: '200px' });

        // ── Build menu ─────────────────────────────────────────────────

        // Fetch theme config from Supabase and apply as CSS overrides
        async function applyRemoteTheme() {
            if (!_sbClient) return;
            try {
                const { data } = await _sbClient.from('theme_config').select('key,value');
                if (!data || !data.length) return;
                const cfg = Object.fromEntries(data.map(r => [r.key, r.value]));
                const varMap = {
                    bg: '--bg', card: '--card', card2: '--card2', border: '--border',
                    text: '--text', dim: '--dim', accent: '--accent',
                    accent_text: '--accent-text', thumb_bg: '--thumb-bg', modal_bg: '--modal-bg'
                };
                // Clear any inline CSS-variable overrides a previous version may have set
                // directly on <html> (inline styles beat attribute-selector rules and would
                // prevent the theme toggle from changing colours).
                Object.values(varMap).forEach(v => document.documentElement.style.removeProperty(v));
                // Inject a <style> block that overrides both themes regardless of which is active
                let css = '[data-theme="night"] {';
                Object.entries(varMap).forEach(([k, cssVar]) => {
                    if (cfg[`night_${k}`]) css += `${cssVar}:${cfg[`night_${k}`]};`;
                });
                css += '} [data-theme="day"] {';
                Object.entries(varMap).forEach(([k, cssVar]) => {
                    if (cfg[`day_${k}`]) css += `${cssVar}:${cfg[`day_${k}`]};`;
                });
                css += '}';
                let styleEl = document.getElementById('remote-theme');
                if (!styleEl) {
                    styleEl = document.createElement('style');
                    styleEl.id = 'remote-theme';
                    document.head.appendChild(styleEl);
                }
                styleEl.textContent = css;
                // Font overrides
                if (cfg.font_body) {
                    const link = document.createElement('link');
                    link.rel  = 'stylesheet';
                    link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(cfg.font_body)}:wght@400;600;700&display=swap`;
                    document.head.appendChild(link);
                    document.body.style.fontFamily = `'${cfg.font_body}', sans-serif`;
                }
                if (cfg.font_heading) {
                    const link = document.createElement('link');
                    link.rel  = 'stylesheet';
                    link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(cfg.font_heading)}&display=swap`;
                    document.head.appendChild(link);
                    document.querySelectorAll('.restaurant-name, .item-name, .category-header')
                        .forEach(el => { el.style.fontFamily = `'${cfg.font_heading}', sans-serif`; });
                }
                // Branding
                if (cfg.site_name || cfg.site_name_ka) {
                    document.querySelectorAll('[data-brand]').forEach(el => {
                        el.textContent = (window.__lang === 'ka' && cfg.site_name_ka)
                            ? cfg.site_name_ka : (cfg.site_name || el.textContent);
                    });
                }
            } catch (_) {}
        }

                    } else {
                        const name = lang === 'ka' ? p.dataset.catKa : p.dataset.cat;
                        p.textContent = name;
                    }
                });
            };

            applyLang(window.__lang);

            // Correct button labels once AR detection resolves (instant if cap was cached)
            arCapPromise.then(() => {
                const u = UI[window.__lang];
                const finalLabel = window.__arCap === 'none' ? u.view3D : u.viewAR;
                if (finalLabel !== initialLabel)
                    document.querySelectorAll('.ar-btn:not(:disabled)').forEach(b => { b.textContent = finalLabel; });
            });
        }

        // ── Basket ─────────────────────────────────────────────────────
        const _basket = new Map(); // key = String(globalIdx) -> { item, qty }
        window._basket = _basket;
        const _xrAddedKeys = new Set(); // keys added via XR button (eligible for XR toggle-off)

        function _parsePrice(str) {
            return parseFloat(String(str).replace(/[^\d.]/g, '')) || 0;
        }
        function _fmtPrice(num) {
            const n = Math.round(num * 10) / 10;
            return n + ' ₾';
        }
        function _basketTotal() {
            let s = 0;
            _basket.forEach(({ item, qty }) => { s += _parsePrice(item.price) * qty; });
            return s;
        }
        function _basketCount() {
            let n = 0;
            _basket.forEach(({ qty }) => { n += qty; });
            return n;
        }

        function _updateBasketBar() {
            const count = _basketCount();
            const bar   = document.getElementById('basket-bar');
            bar.classList.toggle('visible', count > 0);
            document.body.classList.toggle('basket-bar-visible', count > 0);
            if (count > 0) {
                const u = UI[window.__lang];
                document.getElementById('basket-bar-count').textContent =
                    count + ' ' + (window.__lang === 'ka' ? 'პროდუქტი' : count === 1 ? 'item' : 'items');
                document.getElementById('basket-bar-total').textContent = _fmtPrice(_basketTotal());
            }
        }

        function _syncQtyCtrl(key) {
            const entry = _basket.get(key);
            const qty   = entry ? entry.qty : 0;
            document.querySelectorAll(`.qty-ctrl[data-idx="${key}"]`).forEach(ctrl => {
                const addBtn  = ctrl.querySelector('.qty-add-btn');
                const stepper = ctrl.querySelector('.qty-stepper');
                const numEl   = ctrl.querySelector('.qty-num');
                if (qty > 0) {
                    addBtn.style.display = 'none';
                    stepper.classList.add('visible');
                    numEl.textContent = qty;
                } else {
                    addBtn.style.display = '';
                    stepper.classList.remove('visible');
                }
            });
        }

        function addToBasket(key, item) {
            const _isNew = !_basket.has(key);
            if (_basket.has(key)) _basket.get(key).qty++;
            else                   _basket.set(key, { item, qty: 1 });
            if (_isNew) {
                const _bIdx = parseInt(key, 10);
                track('basket_add', _bIdx, {
                    after_ar: _arViewedItems.has(_bIdx),
                    after_3d: _modalViewedItems.has(_bIdx),
                });
            }
            _syncQtyCtrl(key);
            _updateBasketBar();
            if (document.getElementById('basket-panel').style.display !== 'none') _renderBasketPanel();
        }

        function _setQty(key, qty) {
            if (qty <= 0) {
                if (_basket.has(key)) track('basket_remove', parseInt(key, 10));
                _basket.delete(key);
            } else if (_basket.has(key)) _basket.get(key).qty = qty;
            _syncQtyCtrl(key);
            _updateBasketBar();
            if (document.getElementById('basket-panel').style.display !== 'none') _renderBasketPanel();
        }

        function _renderBasketPanel() {
            const u   = UI[window.__lang];
            const box = document.getElementById('basket-items');
            box.innerHTML = '';
            document.getElementById('basket-title').textContent      = u.basketTitle;
            document.getElementById('basket-clear').textContent      = u.clearBasket;
            document.getElementById('basket-close').textContent      = u.close;
            document.getElementById('basket-total-label').textContent = u.total;
            if (_basket.size === 0) {
                box.innerHTML = `<p class="basket-empty">${u.emptyBasket}</p>`;
            } else {
                _basket.forEach(({ item, qty }, key) => {
                    const line = _parsePrice(item.price) * qty;
                    const row  = document.createElement('div');
                    row.className = 'basket-item';
                    row.innerHTML = `
                        <span class="basket-item-name">${t(item, 'name')}</span>
                        <div class="basket-qty">
                            <button class="qty-btn" data-key="${key}" data-delta="-1">&#8722;</button>
                            <span class="qty-count">${qty}</span>
                            <button class="qty-btn" data-key="${key}" data-delta="1">+</button>
                        </div>
                        <span class="basket-item-price">${_fmtPrice(line)}</span>`;
                    box.appendChild(row);
                });
            }
            document.getElementById('basket-total').textContent = _fmtPrice(_basketTotal());
        }

        function _openBasket() {
            track('basket_open');
            _renderBasketPanel();
            const panel = document.getElementById('basket-panel');
            panel.style.display = 'flex';
            requestAnimationFrame(() => panel.classList.add('active'));
            document.body.style.overflow = 'hidden';
        }
        function _closeBasket() {
            const panel = document.getElementById('basket-panel');
            panel.classList.remove('active');
            setTimeout(() => { panel.style.display = 'none'; }, 230);
            document.body.style.overflow = '';
        }

        document.getElementById('xr-add-btn').addEventListener('click', e => {
            e.stopPropagation();
            const item = window.XR?.getCurrentItem();
            if (!item || !window.__menuItems) return;
            const idx = window.__menuItems.indexOf(item);
            if (idx < 0) return;
            const key = String(idx);
            if (!_basket.has(key)) {
                addToBasket(key, item);
                _xrAddedKeys.add(key);
            } else if (_xrAddedKeys.has(key)) {
                _setQty(key, 0);
                _xrAddedKeys.delete(key);
            }
            // Already in basket from outside — do nothing
            document.getElementById('xr-add-btn').classList.toggle('in-basket', _basket.has(key));
        });

        document.getElementById('basket-bar').addEventListener('click', _openBasket);
        document.getElementById('basket-bar-delete').addEventListener('click', e => {
            e.stopPropagation();
            const keys = [..._basket.keys()];
            _basket.clear();
            keys.forEach(k => _syncQtyCtrl(k));
            _updateBasketBar();
        });
        document.getElementById('basket-close').addEventListener('click', _closeBasket);
        document.getElementById('basket-panel').addEventListener('click', e => {
            if (e.target === document.getElementById('basket-panel')) _closeBasket();
        });
        document.getElementById('basket-clear').addEventListener('click', () => {
            if (_basket.size > 0) {
                const snapshot = [];
                let total = 0;
                _basket.forEach(({ item, qty }) => {
                    snapshot.push({ name: item.name, qty, price: item.price });
                    total += _parsePrice(item.price) * qty;
                });
                track('basket_clear', null, {
                    item_count: snapshot.length,
                    items: snapshot,
                    total_gel: Math.round(total * 10) / 10,
                });
            }
            const keys = [..._basket.keys()];
            _basket.clear();
            keys.forEach(k => _syncQtyCtrl(k));
            _updateBasketBar();
            _renderBasketPanel();
        });
document.getElementById('basket-items').addEventListener('click', e => {
            const btn = e.target.closest('.qty-btn');
            if (!btn) return;
            const entry = _basket.get(btn.dataset.key);
            if (entry) _setQty(btn.dataset.key, entry.qty + parseInt(btn.dataset.delta));
        });

        buildMenu();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
