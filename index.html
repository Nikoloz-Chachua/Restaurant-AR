<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Lions — AR Menu</title>
    <meta name="description" content="Burger Lions restaurant menu. View dishes in Augmented Reality before you order.">
    <meta property="og:title" content="Burger Lions — AR Menu">
    <meta property="og:description" content="Browse our menu and place dishes on your table in Augmented Reality.">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root { --t: 0.22s ease; }

        [data-theme="night"] {
            --bg:          #0d0d0d;
            --card:        #161616;
            --card2:       #1c1c1c;
            --border:      rgba(240,192,64,0.2);
            --text:        #e0e0e0;
            --dim:         #888888;
            --accent:      #f0c040;
            --accent-text: #0d0d0d;
            --thumb-bg:    #1a1a1a;
            --modal-bg:    #0d0d0d;
        }

        [data-theme="day"] {
            --bg:          #f4f4f4;
            --card:        #ffffff;
            --card2:       #eeeeee;
            --border:      rgba(160,110,0,0.2);
            --text:        #1a1a1a;
            --dim:         #666666;
            --accent:      #a87000;
            --accent-text: #ffffff;
            --thumb-bg:    #e8e8e8;
            --modal-bg:    #f0f0f0;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        button { touch-action: manipulation; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            padding: 0 16px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background var(--t), color var(--t);
            overflow-x: hidden;
        }

        .header {
            width: 100%;
            max-width: 450px;
            text-align: center;
            padding: 64px 0 24px;
        }

        .header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.8rem, 10vw, 3.8rem);
            letter-spacing: 8px;
            color: var(--accent);
            line-height: 1;
            transition: color var(--t);
        }

        .tagline {
            font-size: 0.68rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--dim);
            margin-top: 6px;
            font-weight: 700;
            transition: color var(--t);
        }

        #theme-toggle, #lang-toggle {
            position: fixed;
            top: 14px;
            z-index: 1000;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px 16px;
            cursor: pointer;
            color: var(--text);
            font-family: 'Nunito', sans-serif;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: background var(--t), color var(--t), border-color var(--t);
        }
        #theme-toggle { right: 14px; }
        #lang-toggle  { left: 14px; }
        #theme-toggle:active, #lang-toggle:active { opacity: 0.65; }

        .menu-list {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .menu-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex;
            padding: 12px;
            gap: 12px;
            align-items: center;
            transition: background var(--t), border-color var(--t);
            contain: content;
            touch-action: manipulation;
        }
        .menu-item:active { opacity: 0.75; transition: opacity 0.08s; }

        .thumb-wrap {
            width: 108px;
            height: 108px;
            flex-shrink: 0;
            border-radius: 14px;
            overflow: hidden;
            background: var(--thumb-bg);
            border: 1px solid var(--border);
            transition: background var(--t), border-color var(--t);
        }
        .thumb-wrap model-viewer {
            width: 100%;
            height: 100%;
            background: transparent;
            display: block;
            touch-action: pan-y;
        }

        .item-details { flex: 1; min-width: 0; user-select: none; }

        .item-header {
            margin-bottom: 5px;
        }

        .item-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 1px;
            color: var(--accent);
            line-height: 1.2;
            transition: color var(--t);
            overflow-wrap: break-word;
            word-break: keep-all;
            min-width: 0;
        }

        .ar-btn {
            background: var(--accent);
            color: var(--accent-text);
            border: none;
            border-radius: 9px;
            padding: 7px 10px;
            font-size: 0.63rem;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            letter-spacing: 0.8px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            text-transform: uppercase;
            transition: background var(--t), opacity 0.15s;
        }
        .ar-btn:active { opacity: 0.7; transition: opacity 0.08s; }
        .ar-btn:disabled { opacity: 0.45; cursor: wait; }

        .ingredients {
            font-size: 0.72rem;
            color: var(--dim);
            margin-bottom: 7px;
            line-height: 1.3;
            transition: color var(--t);
            overflow-wrap: break-word;
        }

        .price-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 2px;
        }

        .price {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 1px;
            color: var(--accent);
            transition: color var(--t);
        }

        .category-header {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 5px;
            color: var(--accent);
            padding: 20px 4px 8px;
            border-bottom: 1px solid var(--border);
            width: 100%;
            max-width: 450px;
            transition: color var(--t), border-color var(--t);
        }

        /* ── Modal ── */
        #modal {
            position: fixed;
            inset: 0;
            background: var(--modal-bg);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s, background var(--t);
        }
        #modal.active { opacity: 1; }

        #modal-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(1.8rem, 6vw, 2.6rem);
            letter-spacing: 4px;
            color: var(--accent);
            text-align: center;
            width: 100%;
            padding: 0 24px;
            margin-top: 56px;
            line-height: 1.2;
            transition: color var(--t);
        }

        #modal-price {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(1.4rem, 5vw, 2rem);
            letter-spacing: 3px;
            color: var(--accent);
            text-align: center;
            margin-top: 6px;
            transition: color var(--t);
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--card2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            transition: background var(--t), color var(--t);
        }

        #modal-viewer {
            width: 95vw;
            height: 68vh;
            background: transparent;
            margin-top: 8px;
        }

        .tip {
            margin-top: 4px;
            color: var(--dim);
            font-size: 0.82rem;
            letter-spacing: 1px;
            transition: color var(--t);
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.5);
            color: var(--text);
            font-size: 1.4rem;
            cursor: pointer;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-arrow:active { opacity: 0.65; }
        .left-arrow  { left: 10px; }
        .right-arrow { right: 10px; }

        /* ── WebXR overlay ── */
        #xr-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 51;
            pointer-events: none;
        }
        #xr-gesture-layer {
            display: none;
            position: absolute;
            inset: 0;
            pointer-events: all;
        }
        #xr-place-hint {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    background: rgba(0,0,0,0.65);
    padding: 10px 20px;
    border-radius: 20px;
    white-space: normal;
    text-align: center;
    width: 80%;
    max-width: 320px;
}
        #xr-nav-row {
            display: none;
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: all;
            align-items: center;
            gap: 16px;
            background: rgba(0,0,0,0.65);
            padding: 8px 20px;
            border-radius: 30px;
        }
        #xr-nav-row button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.35);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            pointer-events: all;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #xr-move-hint {
            display: none;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-family: 'Nunito', sans-serif;
            font-size: 12px;
            white-space: nowrap;
        }
        #xr-exit, #xr-carousel-toggle, #xr-label-toggle {
            pointer-events: all;
            position: absolute;
            background: rgba(0,0,0,0.65);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 13px;
            cursor: pointer;
        }
        #xr-exit             { top: 18px; right: 18px; }
        #xr-carousel-toggle  { top: 18px; left: 18px; display: none; }
        #xr-label-toggle     { top: 58px; left: 18px; display: none; }


    </style>
</head>
<body>

    <button id="theme-toggle" aria-label="Toggle theme">Day</button>
    <button id="lang-toggle" aria-label="Toggle language">KA</button>

    <div class="header">
        <h1>Burger Lions</h1>
        <div class="tagline" id="tagline">Taste the Wild</div>
    </div>

    <div class="menu-list" id="menu-list"></div>

    <div id="modal">
        <button class="nav-arrow left-arrow"  id="modal-prev">&#10094;</button>
        <button class="nav-arrow right-arrow" id="modal-next">&#10095;</button>
        <button class="close-btn" id="close-btn">Close</button>
        <div id="modal-title"></div>
        <model-viewer id="modal-viewer"
            camera-controls
            shadow-intensity="1"
            min-camera-orbit="auto 0deg auto"
            max-camera-orbit="auto 85deg auto">
        </model-viewer>
        <div id="modal-price"></div>
        <p class="tip" id="modal-tip">Drag to rotate</p>
    </div>

    <div id="xr-overlay">
        <div id="xr-gesture-layer"></div>
        <div id="xr-place-hint">Point at a flat surface, then tap to place</div>
        <div id="xr-nav-row">
            <button id="xr-prev">&#10094;</button>
            <button id="xr-next">&#10095;</button>
        </div>
        <div id="xr-move-hint">Drag to move &middot; Twist two fingers to rotate</div>
        <button id="xr-exit">Exit AR</button>
        <button id="xr-carousel-toggle"></button>
        <button id="xr-label-toggle"></button>
    </div>


    <!-- WebXR — Three.js loaded lazily on first AR tap, not on page load -->
    <script>
    (function () {
        let THREE, GLTFLoader;
        let renderer, scene, camera, reticle, xrCanvas;
        let carouselRoot, slotGroups = [];
        let gestureLayer, xrOverlay;
        let hitTestSource = null, xrSession = null, xrStarting = false;
        let placed = false, isAnimating = false;
        let _xrSingleItem = (localStorage.getItem('bl-xr-view') || 'single') === 'single';

        let MENU = [], N = 0;
        const mod = i => ((i % N) + N) % N;
        let currentCenterMenu = 0;
        let slotOf     = { left: 0, center: 1, right: 2, hidden: 3 };
        let menuOf     = [0, 0, 0, 0];
        let hiddenSide = 'farRight';
        const meshObjs   = [null, null, null, null];
        const modelGLTFs = {};
        let loader;
        let labelMesh = null, labelCanvas = null, labelCtx = null, labelTexture = null;
        let labelMode = localStorage.getItem('bl-xr-label') || 'float';

        const CFG = {
            farLeft:  { x: -0.35, z: -0.12, s: 0.20, opacity: 0    },
            left:     { x: -0.14, z: -0.08, s: 0.20, opacity: 0.65 },
            center:   { x:  0,    z:  0,    s: 0.25, opacity: 1.0  },
            right:    { x:  0.14, z: -0.08, s: 0.20, opacity: 0.65 },
            farRight: { x:  0.35, z: -0.12, s: 0.20, opacity: 0    },
        };
        // Returns target opacity for a role based on current view mode
        const _roleOp = role => _xrSingleItem ? (role === 'center' ? 1.0 : 0) : CFG[role].opacity;

        const INIT_ROLES    = ['left', 'center', 'right', 'farRight'];
        const DUR           = 350;
        const MOVE_SCALE    = 0.0015;
        const ROTATE_SCALE  = 0.005;
        const DEAD_ZONE     = 3;
        const MAX_DELTA     = 40;
        const activeTouches = new Map();

        // ── AR label (museum card) ────────────────────────────────────
        function _rrPath(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y,     x + w, y + r,     r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x,     y + h, x,         y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x,     y,     x + r,     y,         r);
            ctx.closePath();
        }

        function _wrapText(ctx, text, x, y, maxW, lh, maxLines) {
            const words = text.split(' ');
            let line = '', count = 0;
            for (const word of words) {
                const test = line ? line + ' ' + word : word;
                if (ctx.measureText(test).width > maxW && line) {
                    ctx.fillText(line, x, y + count * lh);
                    if (++count >= maxLines) return;
                    line = word;
                } else { line = test; }
            }
            if (line) ctx.fillText(line, x, y + count * lh);
        }

        function drawLabel(item) {
            if (!labelCtx) return;
            const ctx = labelCtx;
            const W = labelCanvas.width, H = labelCanvas.height;
            const lang = window.__lang || 'en';
            const name = (lang === 'ka' && item.name_ka)        ? item.name_ka        : item.name;
            const desc = (lang === 'ka' && item.description_ka) ? item.description_ka : item.description;

            ctx.clearRect(0, 0, W, H);

            ctx.fillStyle = 'rgba(8, 8, 8, 0.92)';
            _rrPath(ctx, 6, 6, W - 12, H - 12, 20);
            ctx.fill();

            ctx.strokeStyle = 'rgba(240, 192, 64, 0.7)';
            ctx.lineWidth = 3;
            _rrPath(ctx, 6, 6, W - 12, H - 12, 20);
            ctx.stroke();

            ctx.fillStyle = '#f0c040';
            ctx.font = 'bold 44px Arial, sans-serif';
            ctx.fillText(name, 28, 52, W - 56);

            ctx.strokeStyle = 'rgba(240, 192, 64, 0.30)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(28, 66); ctx.lineTo(W - 28, 66); ctx.stroke();

            ctx.fillStyle = '#c0c0c0';
            ctx.font = '22px Arial, sans-serif';
            _wrapText(ctx, desc, 28, 88, W - 56, 28, 3);

            ctx.fillStyle = '#f0c040';
            ctx.font = 'bold 36px Arial, sans-serif';
            ctx.fillText(item.price, 28, H - 20);

            if (labelTexture) labelTexture.needsUpdate = true;
        }

        function createLabelMesh() {
            const W = 512, H = 210;
            labelCanvas = document.createElement('canvas');
            labelCanvas.width = W; labelCanvas.height = H;
            labelCtx = labelCanvas.getContext('2d');
            labelTexture = new THREE.CanvasTexture(labelCanvas);
            const mat = new THREE.MeshBasicMaterial({
                map: labelTexture, transparent: true, depthWrite: false, side: THREE.DoubleSide
            });
            const planeW = 0.30, planeH = planeW * H / W;
            labelMesh = new THREE.Mesh(new THREE.PlaneGeometry(planeW, planeH), mat);
            labelMesh.position.set(0, 0.28, 0.06);
            labelMesh.visible = false;
            carouselRoot.add(labelMesh);
        }

        function updateLabelTransform() {
            if (!labelMesh) return;
            if (labelMode === 'surface') {
                labelMesh.position.set(0, 0.004, 0.22);
                labelMesh.rotation.set(-Math.PI / 2, 0, 0);
            } else {
                labelMesh.position.set(0, 0.28, 0.06);
                labelMesh.rotation.set(0, 0, 0);
            }
            const btn = document.getElementById('xr-label-toggle');
            const u = UI[window.__lang || 'en'];
            if (btn) btn.textContent = labelMode === 'float' ? u.onTable : u.floating;
        }

        // ── Models ────────────────────────────────────────────────────
        function preloadModels() {
            const paths = [...new Set(MENU.map(m => m.model || 'food.glb'))];
            return Promise.all(paths.map(p =>
                new Promise((res, rej) =>
                    loader.load(p, gltf => { modelGLTFs[p] = gltf; res(); }, undefined, rej)
                )
            ));
        }

        function cloneModel(menuIdx) {
            const gltf = modelGLTFs[MENU[menuIdx].model || 'food.glb'];
            if (!gltf) return null;
            const obj = gltf.scene.clone(true);
            obj.traverse(n => { if (n.isMesh && n.material) n.material = n.material.clone(); });
            return obj;
        }

        function setSlotModel(slotIdx, menuIdx) {
            const old = meshObjs[slotIdx];
            if (old) slotGroups[slotIdx].remove(old);
            const obj = cloneModel(menuIdx);
            if (obj) {
                // Normalize: longest bounding-box axis = 1 unit so slot group scale = real-world metres
                const box = new THREE.Box3().setFromObject(obj);
                const size = box.getSize(new THREE.Vector3());
                const longest = Math.max(size.x, size.y, size.z);
                if (longest > 0 && isFinite(longest)) obj.scale.setScalar(1 / longest);
                const seated = new THREE.Box3().setFromObject(obj);
                if (isFinite(seated.min.y)) obj.position.y = -seated.min.y;
                slotGroups[slotIdx].add(obj);
                meshObjs[slotIdx] = obj;
            }
        }

        function initSlots() {
            const c = currentCenterMenu;
            menuOf = [mod(c - 1), c, mod(c + 1), mod(c + 2)];
            for (let i = 0; i < 4; i++) setSlotModel(i, menuOf[i]);
            const opacities = [_roleOp('left'), _roleOp('center'), _roleOp('right'), 0];
            INIT_ROLES.forEach((role, i) => {
                slotGroups[i].position.x = CFG[role].x;
                slotGroups[i].position.z = CFG[role].z;
                slotGroups[i].scale.setScalar(CFG[role].s);
                slotGroups[i].rotation.set(0, 0, 0);
                setOpacity(i, opacities[i]);
            });
        }

        // ── Opacity ───────────────────────────────────────────────────
        function setOpacity(idx, opacity) {
            const obj = meshObjs[idx];
            if (!obj) return;
            obj.traverse(n => {
                if (n.isMesh && n.material) {
                    n.material.transparent = opacity < 1.0;
                    n.material.opacity     = Math.max(0, Math.min(1, opacity));
                    n.material.needsUpdate = true;
                }
            });
        }

        function animOpacity(idx, from, to, dur) {
            const t0 = performance.now();
            (function tick(now) {
                const t = Math.min((now - t0) / dur, 1);
                const e = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
                setOpacity(idx, from + (to - from) * e);
                if (t < 1) requestAnimationFrame(tick);
            })(performance.now());
        }

        // ── Slot animation ────────────────────────────────────────────
        function snapSlot(idx, role) {
            slotGroups[idx].position.x = CFG[role].x;
            slotGroups[idx].position.z = CFG[role].z;
            slotGroups[idx].scale.setScalar(CFG[role].s);
        }

        function animSlot(idx, role, dur) {
            const x0 = slotGroups[idx].position.x, x1 = CFG[role].x;
            const z0 = slotGroups[idx].position.z, z1 = CFG[role].z;
            const s0 = slotGroups[idx].scale.x,    s1 = CFG[role].s;
            const t0 = performance.now();
            (function tick(now) {
                const t = Math.min((now - t0) / dur, 1);
                const e = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
                slotGroups[idx].position.x = x0 + (x1 - x0) * e;
                slotGroups[idx].position.z = z0 + (z1 - z0) * e;
                slotGroups[idx].scale.setScalar(s0 + (s1 - s0) * e);
                if (t < 1) requestAnimationFrame(tick);
            })(performance.now());
        }

        // ── Navigation ────────────────────────────────────────────────
        function goNext() {
            if (isAnimating) return;
            isAnimating = true;
            const { left: lIdx, center: cIdx, right: rIdx, hidden: hIdx } = slotOf;
            if (hiddenSide === 'farLeft') snapSlot(hIdx, 'farRight');
            menuOf[hIdx] = mod(menuOf[rIdx] + 1);
            setSlotModel(hIdx, menuOf[hIdx]); setOpacity(hIdx, 0);
            animSlot(lIdx, 'farLeft', DUR); animSlot(cIdx, 'left',  DUR);
            animSlot(rIdx, 'center',  DUR); animSlot(hIdx, 'right', DUR);
            animOpacity(lIdx, _roleOp('left'),    0,                DUR);
            animOpacity(cIdx, _roleOp('center'),  _roleOp('left'),  DUR);
            animOpacity(rIdx, _roleOp('right'),   _roleOp('center'), DUR);
            animOpacity(hIdx, 0,                  _roleOp('right'), DUR);
            setTimeout(() => {
                slotOf = { left: cIdx, center: rIdx, right: hIdx, hidden: lIdx };
                hiddenSide = 'farLeft'; currentCenterMenu = mod(currentCenterMenu + 1);
                isAnimating = false;
                if (labelMesh && labelMesh.visible) drawLabel(MENU[currentCenterMenu]);
            }, DUR + 10);
        }

        function goPrev() {
            if (isAnimating) return;
            isAnimating = true;
            const { left: lIdx, center: cIdx, right: rIdx, hidden: hIdx } = slotOf;
            if (hiddenSide === 'farRight') snapSlot(hIdx, 'farLeft');
            menuOf[hIdx] = mod(menuOf[lIdx] - 1);
            setSlotModel(hIdx, menuOf[hIdx]); setOpacity(hIdx, 0);
            animSlot(rIdx, 'farRight', DUR); animSlot(cIdx, 'right', DUR);
            animSlot(lIdx, 'center',   DUR); animSlot(hIdx, 'left',  DUR);
            animOpacity(rIdx, _roleOp('right'),   0,                 DUR);
            animOpacity(cIdx, _roleOp('center'),  _roleOp('right'),  DUR);
            animOpacity(lIdx, _roleOp('left'),    _roleOp('center'), DUR);
            animOpacity(hIdx, 0,                  _roleOp('left'),   DUR);
            setTimeout(() => {
                slotOf = { left: hIdx, center: lIdx, right: cIdx, hidden: rIdx };
                hiddenSide = 'farRight'; currentCenterMenu = mod(currentCenterMenu - 1);
                isAnimating = false;
                if (labelMesh && labelMesh.visible) drawLabel(MENU[currentCenterMenu]);
            }, DUR + 10);
        }

        // ── Placement ─────────────────────────────────────────────────
        function onSelect() {
            if (placed || !reticle.visible) return;
            carouselRoot.position.setFromMatrixPosition(reticle.matrix);
            carouselRoot.quaternion.setFromRotationMatrix(reticle.matrix);
            carouselRoot.visible = true;
            reticle.visible      = false;
            placed               = true;
            gestureLayer.style.display = 'block';
            document.getElementById('xr-place-hint').style.display      = 'none';
            document.getElementById('xr-nav-row').style.display          = 'flex';
            document.getElementById('xr-move-hint').style.display        = 'block';
            document.getElementById('xr-carousel-toggle').style.display  = 'block';
            if (labelMesh) { drawLabel(MENU[currentCenterMenu]); updateLabelTransform(); labelMesh.visible = true; }
            document.getElementById('xr-label-toggle').style.display = 'block';
        }

        // ── One-time init — deferred until first AR tap ───────────────
        let _setupDone = false;

        async function _setup() {
            if (_setupDone) return;
            _setupDone = true;

            const [threeNS, loaderMod] = await Promise.all([
                import('https://esm.sh/three@0.155.0'),
                import('https://esm.sh/three@0.155.0/examples/jsm/loaders/GLTFLoader')
            ]);
            THREE      = threeNS;
            GLTFLoader = loaderMod.GLTFLoader;
            loader     = new GLTFLoader();

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            renderer.xr.setReferenceSpaceType('local');
            xrCanvas = renderer.domElement;
            Object.assign(xrCanvas.style, {
                position: 'fixed', top: '0', left: '0',
                zIndex: '50', display: 'none'
            });
            document.body.appendChild(xrCanvas);

            scene  = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
            scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(0.5, 1, 0.25);
            scene.add(dirLight);

            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.04, 0.07, 32),
                new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
            );
            reticle.rotation.x       = -Math.PI / 2;
            reticle.matrixAutoUpdate = false;
            reticle.visible          = false;
            scene.add(reticle);

            carouselRoot = new THREE.Group();
            scene.add(carouselRoot);
            carouselRoot.visible = false;
            slotGroups = Array.from({ length: 4 }, () => {
                const g = new THREE.Group(); carouselRoot.add(g); return g;
            });
            createLabelMesh();

            gestureLayer = document.getElementById('xr-gesture-layer');
            xrOverlay    = document.getElementById('xr-overlay');

            // Touch gestures on the gesture layer inside dom-overlay.
            // Canvas touch events are consumed by the XR runtime during a session;
            // dom-overlay elements receive normal HTML touch events instead.
            gestureLayer.addEventListener('touchstart', e => {
                for (const t of e.changedTouches)
                    activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY, prevX: t.clientX, prevY: t.clientY });
            }, { passive: true });

            gestureLayer.addEventListener('touchmove', e => {
                e.preventDefault();
                for (const t of e.changedTouches) {
                    const p = activeTouches.get(t.identifier);
                    if (p) activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY, prevX: p.x, prevY: p.y });
                }
                const all = [...activeTouches.values()];
                if (all.length === 1) {
                    let dx = all[0].x - all[0].prevX;
                    let dy = all[0].y - all[0].prevY;
                    if (Math.abs(dx) < DEAD_ZONE && Math.abs(dy) < DEAD_ZONE) return;
                    dx = Math.max(-MAX_DELTA, Math.min(MAX_DELTA, dx));
                    dy = Math.max(-MAX_DELTA, Math.min(MAX_DELTA, dy));
                    carouselRoot.position.x += dx * MOVE_SCALE;
                    carouselRoot.position.z += dy * MOVE_SCALE;
                } else if (all.length >= 2) {
                    const [left, right] = [...all].sort((a, b) => a.x - b.x);
                    let twist = ((right.y - right.prevY) - (left.y - left.prevY)) * 0.5;
                    if (Math.abs(twist) < DEAD_ZONE) return;
                    twist = Math.max(-MAX_DELTA, Math.min(MAX_DELTA, twist));
                    slotGroups[slotOf.center].rotation.y -= twist * ROTATE_SCALE;
                }
            }, { passive: false });

            gestureLayer.addEventListener('touchend', e => {
                for (const t of e.changedTouches) activeTouches.delete(t.identifier);
            }, { passive: true });

            renderer.xr.addEventListener('sessionstart', async () => {
                try {
                    const session     = renderer.xr.getSession();
                    const viewerSpace = await session.requestReferenceSpace('viewer');
                    hitTestSource     = await session.requestHitTestSource({ space: viewerSpace });
                } catch (e) { console.error('Hit-test setup failed:', e); }
            });

            renderer.xr.addEventListener('sessionend', () => {
                hitTestSource = null; placed = false;
                xrSession = null; xrStarting = false;
                carouselRoot.visible = false; reticle.visible = false;
                if (labelMesh) labelMesh.visible = false;
                xrCanvas.style.display       = 'none';
                xrOverlay.style.display      = 'none';
                gestureLayer.style.display   = 'none';
                document.getElementById('xr-place-hint').style.display     = 'block';
                document.getElementById('xr-nav-row').style.display         = 'none';
                document.getElementById('xr-move-hint').style.display       = 'none';
                document.getElementById('xr-carousel-toggle').style.display = 'none';
                document.getElementById('xr-label-toggle').style.display    = 'none';
                activeTouches.clear();
                slotOf = { left: 0, center: 1, right: 2, hidden: 3 };
                hiddenSide = 'farRight'; isAnimating = false;
                initSlots();
                document.dispatchEvent(new CustomEvent('xr-session-end'));
            });

            renderer.setAnimationLoop((time, frame) => {
                if (frame && !placed && hitTestSource) {
                    const refSpace = renderer.xr.getReferenceSpace();
                    if (refSpace) {
                        const results = frame.getHitTestResults(hitTestSource);
                        if (results.length > 0) {
                            const pose = results[0].getPose(refSpace);
                            if (pose) { reticle.visible = true; reticle.matrix.fromArray(pose.transform.matrix); }
                        } else { reticle.visible = false; }
                    }
                }
                if (labelMesh && labelMesh.visible && labelMode === 'float') labelMesh.quaternion.copy(camera.quaternion);
                renderer.render(scene, camera);
            });

            document.getElementById('xr-exit').addEventListener('click', () => xrSession?.end());
            document.getElementById('xr-prev').addEventListener('click', goPrev);
            document.getElementById('xr-next').addEventListener('click', goNext);
            document.getElementById('xr-label-toggle').addEventListener('click', () => {
                labelMode = labelMode === 'float' ? 'surface' : 'float';
                localStorage.setItem('bl-xr-label', labelMode);
                updateLabelTransform();
            });

            function updateXRToggleBtn() {
    const u = UI[window.__lang || 'en'];
    document.getElementById('xr-carousel-toggle').textContent =
        _xrSingleItem ? u.carouselBtn : u.singleBtn;
}
            updateXRToggleBtn();
            updateLabelTransform();

            document.getElementById('xr-carousel-toggle').addEventListener('click', () => {
                _xrSingleItem = !_xrSingleItem;
                localStorage.setItem('bl-xr-view', _xrSingleItem ? 'single' : 'multi');
                updateXRToggleBtn();
                const { left: lIdx, right: rIdx } = slotOf;
                const from = _xrSingleItem ? CFG.left.opacity : 0;
                const to   = _xrSingleItem ? 0 : CFG.left.opacity;
                animOpacity(lIdx, from, to, DUR);
                animOpacity(rIdx, from, to, DUR);
            });
        }

        // ── Public API ────────────────────────────────────────────────
        window.XR = {
            async start(itemIndex, items) {
                if (xrStarting || xrSession) return;
                xrStarting = true;

                MENU = items; N = MENU.length;
                currentCenterMenu = Math.max(0, Math.min(itemIndex, N - 1));

                await _setup();

                try { await preloadModels(); }
                catch (e) { console.warn('Model preload partial failure:', e); }

                initSlots();

                try {
                    xrSession = await navigator.xr.requestSession('immersive-ar', {
                        requiredFeatures: ['hit-test'],
                        optionalFeatures: ['dom-overlay'],
                        domOverlay: { root: xrOverlay }
                    });
                } catch (e) {
                    console.error('XR session failed:', e);
                    xrStarting = false;
                    window.__arCap = 'none';
                    localStorage.setItem('bl-ar-cap', 'none');
                    localStorage.setItem('bl-ar-cap-ts', String(Date.now()));
                    document.dispatchEvent(new CustomEvent('xr-session-end', { detail: { fallbackIdx: itemIndex } }));
                    return;
                }

                xrSession.addEventListener('select', onSelect);
                await renderer.xr.setSession(xrSession);
                localStorage.setItem('bl-ar-cap', 'webxr');
                localStorage.setItem('bl-ar-cap-ts', String(Date.now()));
                xrCanvas.style.display  = 'block';
                xrOverlay.style.display = 'block';
                document.dispatchEvent(new CustomEvent('xr-session-start'));
            }
        };
    })();
    </script>

        // ── Modal ──────────────────────────────────────────────────────
        const modal       = document.getElementById('modal');
        const modalViewer = document.getElementById('modal-viewer');
        const modalTitle  = document.getElementById('modal-title');

        function openModal(localIdx, catItems) {
            modalItems = catItems || menuItems;
            modalIndex = localIdx;

            modal.style.display = 'flex';
            requestAnimationFrame(() => modal.classList.add('active'));
            document.body.style.overflow = 'hidden';
            // Defer thumbnail teardown past the modal fade-in frame so it doesn't block animation
            requestAnimationFrame(() => {
                document.querySelectorAll('.thumb-wrap model-viewer').forEach(mv => {
                    if (!mv.src) return;
                    const t = _thumbUnload.get(mv);
                    if (t) { clearTimeout(t); _thumbUnload.delete(mv); }
                    mv.dataset.pausedSrc = mv.src;

            modal.classList.remove('active');

        // ── AR capability detection ────────────────────────────────────
        async function detectAR() {
            const cached = localStorage.getItem('bl-ar-cap');
            const ts = parseInt(localStorage.getItem('bl-ar-cap-ts') || '0');
            if (cached && (Date.now() - ts < 7 * 24 * 60 * 60 * 1000)) { window.__arCap = cached; return cached; }

            const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            let cap = 'none';
            if (navigator.xr) {
                try {
                    if (await navigator.xr.isSessionSupported('immersive-ar')) cap = 'webxr';
                } catch {}
            }
            if (cap === 'none' && isIOS) cap = 'arkit';
            window.__arCap = cap;
            if (cap !== 'webxr') {
                localStorage.setItem('bl-ar-cap', cap);
                localStorage.setItem('bl-ar-cap-ts', String(Date.now()));
            }
            return cap;
        }

        function setARButtonsState(loading) {
            const u = UI[window.__lang];
            const label = loading ? u.loading : (window.__arCap === 'none' ? u.view3D : u.viewAR);
            document.querySelectorAll('.ar-btn').forEach(b => {
                b.textContent = label;
                b.disabled    = loading;
            });
        }

        // ── iOS AR launcher — hidden model-viewers pre-load so activateAR()
        //    can fire synchronously from the tap without losing the gesture context.
        const _arLaunchers = {};
        function _getARLauncher(src) {
            if (!_arLaunchers[src]) {
                const mv = document.createElement('model-viewer');
                mv.setAttribute('ar', '');
                mv.setAttribute('ar-modes', 'quick-look');
                mv.src = src;
                mv.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;top:-9999px;left:-9999px;';
                mv.addEventListener('load', () => {
                    if (!mv.model) return;
                    mv.model.materials.forEach(mat => {
                        const pbr = mat.pbrMetallicRoughness;
                        if (pbr) pbr.setMetallicFactor(0);
                    });
                });
                document.body.appendChild(mv);
                _arLaunchers[src] = mv;
            }
            return _arLaunchers[src];
        }

        // Pre-load both models on iOS so USDZ is ready before the user taps
        const _isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (_isIOS) {
            ['food.glb', 'Druidi.glb'].forEach(src => _getARLauncher(src));
            if (!window.__arCap) window.__arCap = 'arkit';
        }

        function _launchIOSAR(launcher, localIdx) {
            function onARStatus(e) {
                const s = e.detail.status;
                if (s === 'failed') {
                    launcher.removeEventListener('ar-status', onARStatus);
                    setARButtonsState(false);
                    _arOpening = false;
                    openModal(localIdx, _arCatItems);
                } else if (s === 'session-started') {
                    launcher.removeEventListener('ar-status', onARStatus);
                }
            }
            launcher.addEventListener('ar-status', onARStatus);
            launcher.activateAR();
            setTimeout(() => { setARButtonsState(false); _arOpening = false; }, 2500);
        }

        // ── AR routing ─────────────────────────────────────────────────
        let _arOpening  = false;
        let _arCatItems = null;

        async function openAR(localIdx, catItems) {
            if (_arOpening) return;
            _arOpening  = true;
            _arCatItems = catItems || menuItems;
            setARButtonsState(true);

            const cap  = window.__arCap ?? await detectAR();
            const item = _arCatItems[localIdx];

            if (!item) { setARButtonsState(false); _arOpening = false; return; }

            if (cap === 'webxr' && window.XR) {
                try {
                    await window.XR.start(localIdx, _arCatItems);
                } catch (err) {
                    console.error('XR start failed:', err);
                    openModal(localIdx, _arCatItems);
                    setARButtonsState(false);
                    _arOpening = false;
                }
            } else if (cap === 'arkit') {
                _launchIOSAR(_getARLauncher(item.model || 'food.glb'), localIdx);
            } else {
                // No AR support (non-ARCore Android, desktop) — open 3D modal
                openModal(localIdx, _arCatItems);
                setARButtonsState(false);
                _arOpening = false;
            }
        }

        // ── Thumbnail loader — staggered load, delayed unload ──────────────
        // Stagger prevents simultaneous WebGL context init spikes on page load.
        // No hard cap — every visible thumbnail loads; unload after 2s off-screen.
        const _thumbPending = new Set();
        const _thumbUnload  = new WeakMap();
        let   _thumbTimer   = null;

        function _drainThumbs() {
            _thumbTimer = null;
            const mv = _thumbPending.values().next().value;
            if (!mv) return;
            _thumbPending.delete(mv);
            if (mv.isConnected && !mv.src) mv.src = mv.dataset.src;
            if (_thumbPending.size > 0) _thumbTimer = setTimeout(_drainThumbs, 150);
        }

        function _scheduleThumb(mv) {
            const t = _thumbUnload.get(mv);
            if (t) { clearTimeout(t); _thumbUnload.delete(mv); }
            if (_thumbPending.has(mv) || mv.src) return;
            _thumbPending.add(mv);
            if (!_thumbTimer) _thumbTimer = setTimeout(_drainThumbs, 0);
        }

        function _unscheduleThumb(mv) {
            _thumbPending.delete(mv);
            if (!mv.src) return;
            const t = setTimeout(() => {
                _thumbUnload.delete(mv);
                if (!mv.dataset.pausedSrc) mv.removeAttribute('src');
                if (_thumbPending.size > 0 && !_thumbTimer)
                    _thumbTimer = setTimeout(_drainThumbs, 0);
            }, 2000);
            _thumbUnload.set(mv, t);
        }

        const thumbObserver = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) _scheduleThumb(entry.target);
                else                       _unscheduleThumb(entry.target);
            });
        }, { rootMargin: '200px' });

        // ── Build menu ─────────────────────────────────────────────────

        async function buildMenu() {
            const fallback = [
                { name: 'Jalapeno Burger', name_ka: 'ჰალაპენიუ ბურგერი', category: 'Burgers', category_ka: 'ბურგერები', description: '300g beef, 4 layers cheddar cheese, 2 layers bacon, caramelized jalapeno with bacon, special sauce, burger bun.', description_ka: 'ხორცი 300 გრ, ყველი ჩედარი 4 ფენა, ბეკონი 2 ფენა, კარამელიზირებული ჰალაპენიო ბეკონით, სპეც სოუსი.', price: '27.5 ₾', model: 'Druidi.glb' },
                { name: 'Druid',           name_ka: 'დრუიდი',             category: 'Burgers', category_ka: 'ბურგერები', description: '600g beef, 5 layers cheddar cheese, 4 layers bacon, special sauce, pickles, iceberg lettuce, burger bun.',         description_ka: 'ხორცი 600 გრ, ყველი ჩედარი 5 ფენა, ბეკონი 4 ფენა, სპეც სოუსი, მჟავე კიტრი, აისბერგი.',               price: '32.8 ₾', model: 'Druidi.glb' },
                { name: 'Lion Sauce Extra',name_ka: 'ლომების სოუსი ექსტრა', category: 'Sides', category_ka: 'გარნირი | სოუსები', description: 'Fries, cheese sauce, jalapeno, beef, bacon, onion, parmesan, cheddar and iceberg.',                         description_ka: 'ფრი, ყველის სოუსი, ჰალაპენიო, საქონლის ხორცი, ბეკონი, ხახვი, პარმეზანი, ჩედარი და აისბერგი.',       price: '23.8 ₾', model: 'Druidi.glb' },
                { name: 'Coca Cola',       name_ka: 'კოკა კოლა',          category: 'Drinks',  category_ka: 'სასმელები',  description: 'Coca-Cola 0.33L',                                                                                                 description_ka: 'კოკა-კოლა 0.33ლ',                                                                                        price: '3.5 ₾',  model: 'food.glb'   },
                { name: 'Tiramisu',        name_ka: 'ტირამისუ',            category: 'Desserts',category_ka: 'ტკბილეული', description: 'Classic tiramisu dessert.',                                                                                       description_ka: 'კლასიკური ტირამისუ.',                                                                                    price: '10 ₾',   model: 'food.glb'   },
            ];

            const cachedCap = localStorage.getItem('bl-ar-cap');
            if (cachedCap) window.__arCap = cachedCap;
            // Start detection in background — don't block menu render on it
            const arCapPromise = detectAR();

            const items = await fetch('./foods/menu.json').then(r => r.json()).catch(() => fallback);
            menuItems = items;

            const initialLabel = window.__arCap === 'none' ? UI[window.__lang].view3D : UI[window.__lang].viewAR;

            // Group by category, preserving order from JSON
            const categories = [];
            const categoryMap = new Map();
            items.forEach((item, globalIdx) => {
                const key = item.category || 'Other';
                if (!categoryMap.has(key)) {
                    const cat = { name: key, name_ka: item.category_ka || key, items: [] };
                    categories.push(cat);
                    categoryMap.set(key, cat);
                }
                categoryMap.get(key).items.push({ item, globalIdx });
            });

            const list = document.getElementById('menu-list');

            categories.forEach(cat => {
                const catItems = cat.items.map(e => e.item);

                const header = document.createElement('div');
                header.className = 'category-header';
                header.dataset.catName   = cat.name;
                header.dataset.catNameKa = cat.name_ka;
                header.textContent = window.__lang === 'ka' ? cat.name_ka : cat.name;
                list.appendChild(header);

                cat.items.forEach(({ item, globalIdx }, localIdx) => {
                    const card = document.createElement('div');
                    card.className = 'menu-item';
                    card.innerHTML = `
                        <div class="thumb-wrap">
                            <model-viewer
                                data-src="${item.model || 'food.glb'}"
                                camera-controls
                                shadow-intensity="0"
                                interaction-prompt="none"
                                min-camera-orbit="auto 0deg auto"
                                max-camera-orbit="auto 85deg auto">
                            </model-viewer>
                        </div>
                        <div class="item-details">
                            <div class="item-header">
                                <p class="item-name" data-field="name" data-idx="${globalIdx}">${t(item, 'name')}</p>
                            </div>
                            <p class="ingredients" data-field="description" data-idx="${globalIdx}">${t(item, 'description')}</p>
                            <div class="price-row">
                                <p class="price">${item.price}</p>
                                <button class="ar-btn">${initialLabel}</button>
                            </div>
                        </div>`;

                    const mv = card.querySelector('model-viewer');
                    thumbObserver.observe(mv);

                    let _px = 0, _py = 0;
                    mv.addEventListener('pointerdown', e => { _px = e.clientX; _py = e.clientY; });
                    mv.addEventListener('pointerup', e => {
                        if (Math.abs(e.clientX - _px) < 6 && Math.abs(e.clientY - _py) < 6)
                            openModal(localIdx, catItems);
                    });

                    card.querySelector('.item-details').addEventListener('click', () => openModal(localIdx, catItems));
                    card.querySelector('.ar-btn').addEventListener('click', e => { e.stopPropagation(); openAR(localIdx, catItems); });

                    list.appendChild(card);
                });
            });

            applyLang(window.__lang);

            // Correct button labels once AR detection resolves (instant if cap was cached)
            arCapPromise.then(() => {
                const u = UI[window.__lang];
                const finalLabel = window.__arCap === 'none' ? u.view3D : u.viewAR;
                if (finalLabel !== initialLabel)
                    document.querySelectorAll('.ar-btn:not(:disabled)').forEach(b => { b.textContent = finalLabel; });
            });
        }

        buildMenu();
    </script>
</body>
</html>
