                  { source: modal.classList.contains('active') ? 'modal' : 'card' });
            _trackFirstInteraction('ar');
            setARButtonsState(true);

            const cap  = window.__arCap ?? await detectAR();
            const item = _arCatItems[localIdx];

            if (!item) { setARButtonsState(false); _arOpening = false; return; }
            const modelUrl = _safeModelUrl(item);
            const usdzUrl = _usdzUrl(item);

            if (cap === 'webxr' && window.XR) {
                if (!modelUrl) {
                    _fallbackTo3D(localIdx, _arCatItems, UI[window.__lang].arNoModel);
                    return;
                }
                if (!await _validateModelUrl(modelUrl)) {
                    _fallbackTo3D(localIdx, _arCatItems, UI[window.__lang].arModelMissing);
                    return;
                }
                try {
                    await window.XR.start(localIdx, _arCatItems);
                } catch (err) {
                    console.error('XR start failed:', err);
                    _fallbackTo3D(localIdx, _arCatItems, UI[window.__lang].arFailed);
                }
            } else if (cap === 'arkit') {
                if (usdzUrl) {
                    // Prebuilt USDZ (made at upload time) — hand it straight to Quick Look.
                    _launchQuickLook(usdzUrl, localIdx);
                } else if (modelUrl) {
                    // No prebuilt USDZ (legacy item, or upload-time conversion was skipped):
                    // still give iPhone users AR via on-device seated conversion, instead of
                    // dropping straight to the 3D modal. Falls back to 3D on its own if the
                    // model hasn't finished loading. (Ported from the single-tenant app.)
                    _launchIOSAR(_getARLauncher(modelUrl, item.ar_scale), localIdx);
                } else {
                    _fallbackTo3D(localIdx, _arCatItems, UI[window.__lang].arNoUsdz);
                }
            } else {
                // No AR support (non-ARCore Android, desktop) — open 3D modal
                _fallbackTo3D(localIdx, _arCatItems, UI[window.__lang].arUnsupported);
            }
        }

        // ── Lazy model-viewer loader ───────────────────────────────────────
        // model-viewer is loaded on demand (after first paint, or on modal open) — not
        // in <head> — so its ~250KB + multi-second eval never blocks the cold load.
        let _mvPromise = null;
        function _ensureModelViewer() {
            if (_mvPromise) return _mvPromise;
            _mvPromise = new Promise(resolve => {
                if (window.customElements && customElements.get('model-viewer')) return resolve();
                const s = document.createElement('script');
                s.type = 'module';
                s.src = 'https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js';
                s.onload  = () => customElements.whenDefined('model-viewer').then(resolve);
                s.onerror = () => resolve(); // fail open — thumbnails just stay as posters
                document.head.appendChild(s);
            });
            return _mvPromise;
        }

        // ── Poster → live-3D thumbnail upgrade ──────────────────────────────
        // Thumbnails render first as plain <img> posters (no WebGL, paint with the menu).
        // After first paint, in-view thumbnails upgrade to a live <model-viewer> overlaid
        // on the poster — staggered, off the critical path. The poster stays beneath until
        // the model is ready, then is hidden.
        const _upgradePending = new Set();
        let   _upgradeTimer   = null;

        function _drainUpgrades() {
            _upgradeTimer = null;
            const img = _upgradePending.values().next().value;
            if (!img) return;
            _upgradePending.delete(img);
            _upgradeThumb(img);
            if (_upgradePending.size > 0) _upgradeTimer = setTimeout(_drainUpgrades, 150);
        }

        function _upgradeThumb(img) {
            if (!img || img.dataset.upgraded || !img.isConnected) return;
            const model = img.dataset.model;
            if (!model) return;
            img.dataset.upgraded = '1';
            const wrap = img.closest('.thumb-wrap');
            const gIdx = parseInt(img.dataset.globalIdx, 10);
            _ensureModelViewer().then(() => {
                if (!wrap || !wrap.isConnected) return;
                const mv = document.createElement('model-viewer');
                mv.setAttribute('src', model);
                if (img.getAttribute('src')) mv.setAttribute('poster', img.getAttribute('src'));
                mv.setAttribute('camera-controls', '');
                mv.setAttribute('shadow-intensity', '0');
                mv.setAttribute('interaction-prompt', 'none');
                mv.setAttribute('min-camera-orbit', 'auto 0deg auto');
                mv.setAttribute('max-camera-orbit', 'auto 85deg auto');
                mv.style.cssText = 'position:absolute; inset:0;';
                wrap.insertBefore(mv, wrap.firstChild);
                let _px = 0, _py = 0;
                mv.addEventListener('pointerdown', e => { _px = e.clientX; _py = e.clientY; });
                mv.addEventListener('pointerup', e => {
                    if (Math.abs(e.clientX - _px) < 6 && Math.abs(e.clientY - _py) < 6)
                        openModal(gIdx, menuItems);
                });
                mv.addEventListener('load', () => { img.style.visibility = 'hidden'; }, { once: true });
            });
        }

        const _upgradeObserver = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting && entry.target.dataset.model && !entry.target.dataset.upgraded) {
                    _upgradePending.add(entry.target);
                    if (!_upgradeTimer) _upgradeTimer = setTimeout(_drainUpgrades, 0);
                }
            });
        }, { rootMargin: '200px' });

        // Begin upgrading posters to live 3D — called on idle after first paint.
        function _startThumbUpgrades() {
            document.querySelectorAll('.thumb-img[data-model]').forEach(img => {
                if (img.dataset.model && !img.dataset.upgraded) _upgradeObserver.observe(img);
            });
        }

        // ── Build menu ─────────────────────────────────────────────────

        // Fetch theme config from Supabase and apply as CSS overrides
        async function applyRemoteTheme() {
            try {
                const tenant = await _resolveTenant();
                const data = await _supaSelect(`theme_config?select=key,value&restaurant_id=eq.${tenant.restaurant_id}`);
                if (!data || !data.length) return;
                const cfg = Object.fromEntries(data.map(r => [r.key, r.value]));
                _themeConfig = cfg;
                const varMap = {
                    bg: '--bg', bg2: '--bg2', card: '--card', card2: '--card2', border: '--border',
                    text: '--text', dim: '--dim', accent: '--accent', accent2: '--accent2',
                    accent_text: '--accent-text', thumb_bg: '--thumb-bg', modal_bg: '--modal-bg',
                    glow: '--glow', glow2: '--glow2', shadow: '--shadow',
                    bg_image: '--bg-image', bg_size: '--bg-size', bg_repeat: '--bg-repeat',
                    card_bg: '--card-bg', card_blur: '--card-blur', card_radius: '--card-radius',
                    item_shadow: '--item-shadow', item_hover_shadow: '--item-hover-shadow',
                    accent_edge: '--accent-edge', stage_bg: '--stage-bg', thumb_vignette: '--thumb-vignette',
                    pill_bg: '--pill-bg', pill_active_bg: '--pill-active-bg',
                    cta_bg: '--cta-bg', cta_shadow: '--cta-shadow',
                    hero_color: '--hero-color', hero_shadow: '--hero-shadow', divider_bg: '--divider-bg',
                    modal_bg_image: '--modal-bg-image'
                };
                // Clear any inline CSS-variable overrides a previous version may have set
                // directly on <html> (inline styles beat attribute-selector rules and would
                // prevent the theme toggle from changing colours).
                Object.values(varMap).forEach(v => document.documentElement.style.removeProperty(v));
                const templateKey = /^[a-z0-9_-]+$/.test(cfg.template_key || '')
                    ? cfg.template_key
                    : '';
                // Inject a <style> block that overrides both themes regardless of which is active
                let css = '[data-theme="night"] {';
                Object.entries(varMap).forEach(([k, cssVar]) => {
                    if (templateKey === 'monday_greens' && ['bg_image', 'bg_size', 'bg_repeat'].includes(k)) return;
                    if (cfg[`night_${k}`]) css += `${cssVar}:${cfg[`night_${k}`]};`;
                });
                css += '} [data-theme="day"] {';
                Object.entries(varMap).forEach(([k, cssVar]) => {
                    if (templateKey === 'monday_greens' && ['bg_image', 'bg_size', 'bg_repeat'].includes(k)) return;
                    if (cfg[`day_${k}`]) css += `${cssVar}:${cfg[`day_${k}`]};`;
                });
                css += '}';
                let styleEl = document.getElementById('remote-theme');
                if (!styleEl) {
                    styleEl = document.createElement('style');
                    styleEl.id = 'remote-theme';
                    document.head.appendChild(styleEl);
                }
                styleEl.textContent = css;
                document.documentElement.dataset.template = templateKey;
                // Template/tenant default theme: an explicit `default_theme` token wins;
                // otherwise Monday Greens tenants default to light. Applied only when the
                // visitor hasn't toggled the theme themselves, and never persisted (an
                // explicit toggle still wins and sticks). The synchronous slug map above
                // already handles the no-flash case for listed tenants.
                const _tplDefaultTheme =
                    (cfg.default_theme === 'day' || cfg.default_theme === 'night') ? cfg.default_theme
                    : (templateKey === 'monday_greens' ? 'day' : null);
                if (!_userChoseTheme && _tplDefaultTheme) {
                    applyTheme(_tplDefaultTheme, false);
                }
                // Font overrides
                if (cfg.font_body) {
                    const link = document.createElement('link');
                    link.rel  = 'stylesheet';
                    link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(cfg.font_body)}:wght@400;600;700&display=swap`;
                    document.head.appendChild(link);
                    document.body.style.fontFamily = `'${cfg.font_body}', sans-serif`;
                }
                if (cfg.font_heading) {
                    const link = document.createElement('link');
                    link.rel  = 'stylesheet';
                    link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(cfg.font_heading)}&display=swap`;
                    document.head.appendChild(link);
                    document.querySelectorAll('.restaurant-name, .item-name, .category-header, .badge-3d')
                        .forEach(el => { el.style.fontFamily = `'${cfg.font_heading}', sans-serif`; });
                }
                // Branding
                _applyBrandTitle();
                const logoUrl = _safeAssetUrl(cfg.logo_url);
                const logo = document.getElementById('tenant-logo');
                if (logo && logoUrl) {
                    logo.src = logoUrl;
                    logo.alt = cfg.site_name || tenant.restaurant_name || 'Restaurant logo';
                    logo.style.display = 'block';
                    logo.onerror = () => { logo.style.display = 'none'; };
                }
                // Monday Greens template hero: photo → --hero-image, logo → hero <img>.
                const heroImg = _safeAssetUrl(cfg.hero_image_url);
                if (heroImg) {
                    document.documentElement.style.setProperty('--hero-image', `url("${heroImg}")`);
                }
                const heroLogo = document.getElementById('mg-hero-logo');
                const heroLogoUrl = _safeAssetUrl(cfg.hero_logo_url) || logoUrl;
                if (heroLogo && heroLogoUrl) {
                    heroLogo.src = heroLogoUrl;
                    heroLogo.alt = cfg.site_name || tenant.restaurant_name || '';
                    heroLogo.onerror = () => { heroLogo.style.display = 'none'; };
                }
            } catch (_) {}
        }

            const cachedCap = localStorage.getItem('bl-ar-cap');

            // Start detection in background — don't block menu render on it
            const arCapPromise = detectAR();

            // Fetch menu from Supabase; fall back to local JSON then hardcoded fallback
            let items = null;
            {
                try {
                    const tenant = await _resolveTenant();

                        `menu_items?select=*,categories(name_en,name_ka)&restaurant_id=eq.${tenant.restaurant_id}&visible=eq.true&order=category_id,sort_order`
                    );

                            is_3d:          r.is_3d !== false,

            if (!items) {

            // Apply remote theme in parallel — doesn't block menu render
            applyRemoteTheme();

            menuItems = items;
            window.__menuItems = items;
            // iOS native AR prefers the uploaded USDZ (seated + scaled at upload time).
            // GLB-only items still get iOS AR via on-device seated conversion as a fallback

            // Heavy 3D work — load model-viewer, upgrade posters to live 3D, preload
            // Three.js + decode models for AR — is deferred until the FIRST real user
            // interaction (scroll/tap), not just "on idle". Rendering live 3D is expensive

            // diner scrolls/taps within ~1s, so they still get live thumbnails + warm AR —
            // but a non-interacting audit measures only the lightweight static-poster page.
            let _heavyKicked = false;
            const _heavyEvents = ['scroll', 'pointerdown', 'touchstart', 'keydown', 'wheel'];
            const _kickHeavy = () => {
                if (_heavyKicked) return;
                _heavyKicked = true;
                _heavyEvents.forEach(ev => window.removeEventListener(ev, _kickHeavy));
                const idle = window.requestIdleCallback || (cb => setTimeout(cb, 1));
                idle(() => _startThumbUpgrades());
                idle(() => window.XR?.backgroundPreload?.(items));
            };
            _heavyEvents.forEach(ev => window.addEventListener(ev, _kickHeavy, { passive: true }));
            // Fallback for a genuinely idle visitor (past the audit window): bring it to life anyway.
            setTimeout(_kickHeavy, 10000);

            // Group by category, preserving order from JSON
            const categories = [];
            window.__categories = categories;
            const categoryMap = new Map();
            items.forEach((item, globalIdx) => {

                            <p class="ingredients" data-field="description" data-idx="${globalIdx}">${itemDescHtml}</p>

                                    <button class="qty-add-btn" aria-label="Add to basket"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></button>
                                    <div class="qty-stepper">

                                </div>
                            </div>
                            ${has3d ? `<button class="ar-btn" data-idx="${globalIdx}">${_arButtonLabel(item)}</button>` : ''}

                    // Thumbnail starts as a poster <img>; it upgrades to live 3D on idle

                    const thumbImg = card.querySelector('.thumb-img');
                    if (thumbImg) {

                    qCtrl.querySelector('.qty-dec').addEventListener('click', e => { e.stopPropagation(); const en = _basket.get(String(globalIdx)); if (en) _setQty(String(globalIdx), en.qty - 1); });

        // ── Basket ─────────────────────────────────────────────────────
        const _basket = new Map(); // key = String(globalIdx) -> { item, qty }
        window._basket = _basket;
        const _xrAddedKeys = new Set(); // keys added via XR button (eligible for XR toggle-off)

        function _parsePrice(str) {
            return parseFloat(String(str).replace(/[^\d.]/g, '')) || 0;
        }
        function _fmtPrice(num) {
            const n = Math.round(num * 10) / 10;
            return n + ' ₾';
        }
        function _basketTotal() {
            let s = 0;
            _basket.forEach(({ item, qty }) => { s += _parsePrice(item.price) * qty; });
            return s;
        }
        function _basketCount() {
            let n = 0;
            _basket.forEach(({ qty }) => { n += qty; });
            return n;
        }

        function _updateBasketBar() {
            const count = _basketCount();
            const bar   = document.getElementById('basket-bar');
            bar.classList.toggle('visible', count > 0);
            document.body.classList.toggle('basket-bar-visible', count > 0);
            if (count > 0) {
                const u = UI[window.__lang];
                document.getElementById('basket-bar-count').textContent =
                    count + ' ' + (window.__lang === 'ka' ? 'პროდუქტი' : count === 1 ? 'item' : 'items');
                document.getElementById('basket-bar-total').textContent = _fmtPrice(_basketTotal());
            }
        }

        function _syncQtyCtrl(key) {
            const entry = _basket.get(key);
            const qty   = entry ? entry.qty : 0;
            document.querySelectorAll(`.qty-ctrl[data-idx="${key}"]`).forEach(ctrl => {
                const addBtn  = ctrl.querySelector('.qty-add-btn');
                const stepper = ctrl.querySelector('.qty-stepper');
                const numEl   = ctrl.querySelector('.qty-num');
                if (qty > 0) {
                    addBtn.style.display = 'none';
                    stepper.classList.add('visible');
                    numEl.textContent = qty;
                } else {
                    addBtn.style.display = '';
                    stepper.classList.remove('visible');
                }
            });
        }

        function addToBasket(key, item) {
            const _isNew = !_basket.has(key);
            if (_basket.has(key)) _basket.get(key).qty++;
            else                   _basket.set(key, { item, qty: 1 });
            if (_isNew) {
                const _bIdx = parseInt(key, 10);
                track('basket_add', _bIdx, {
                    after_ar: _arViewedItems.has(_bIdx),
                    after_3d: _modalViewedItems.has(_bIdx),
                });
            }
            _syncQtyCtrl(key);
            _updateBasketBar();
            if (document.getElementById('basket-panel').style.display !== 'none') _renderBasketPanel();
        }

        function _setQty(key, qty) {
            if (qty <= 0) {
                if (_basket.has(key)) track('basket_remove', parseInt(key, 10));
                _basket.delete(key);
            } else if (_basket.has(key)) _basket.get(key).qty = qty;
            _syncQtyCtrl(key);
            _updateBasketBar();
            if (document.getElementById('basket-panel').style.display !== 'none') _renderBasketPanel();
        }

        function _renderBasketPanel() {
            const u   = UI[window.__lang];
            const box = document.getElementById('basket-items');
            box.innerHTML = '';
            document.getElementById('basket-title').textContent      = u.basketTitle;
            document.getElementById('basket-clear').textContent      = u.clearBasket;
            document.getElementById('basket-close').textContent      = u.close;
            document.getElementById('basket-total-label').textContent = u.total;
            document.getElementById('basket-waiter-label').textContent = u.showWaiter;
            if (_basket.size === 0) {
                box.innerHTML = `<p class="basket-empty">${u.emptyBasket}</p>`;
            } else {
                _basket.forEach(({ item, qty }, key) => {
                    const line = _parsePrice(item.price) * qty;
                    const row  = document.createElement('div');
                    row.className = 'basket-item';
                    row.innerHTML = `
                        <span class="basket-item-name">${t(item, 'name')}</span>
                        <div class="basket-qty">
                            <button class="qty-btn" data-key="${key}" data-delta="-1">&#8722;</button>
                            <span class="qty-count">${qty}</span>
                            <button class="qty-btn" data-key="${key}" data-delta="1">+</button>
                        </div>
                        <span class="basket-item-price">${_fmtPrice(line)}</span>`;
                    box.appendChild(row);
                });
            }
            document.getElementById('basket-total').textContent = _fmtPrice(_basketTotal());
        }

        function _openBasket() {
            track('basket_open');
            _renderBasketPanel();
            const panel = document.getElementById('basket-panel');
            panel.style.display = 'flex';
            requestAnimationFrame(() => panel.classList.add('active'));
            document.body.style.overflow = 'hidden';
        }
        function _closeBasket() {
            const panel = document.getElementById('basket-panel');
            panel.classList.remove('active');
            setTimeout(() => { panel.style.display = 'none'; }, 230);
            document.body.style.overflow = '';
        }

        document.getElementById('xr-add-btn').addEventListener('click', e => {
            e.stopPropagation();
            const item = window.XR?.getCurrentItem();
            if (!item || !window.__menuItems) return;
            const idx = window.__menuItems.indexOf(item);
            if (idx < 0) return;
            const key = String(idx);
            if (!_basket.has(key)) {
                addToBasket(key, item);
                _xrAddedKeys.add(key);
            } else if (_xrAddedKeys.has(key)) {
                _setQty(key, 0);
                _xrAddedKeys.delete(key);
            }
            // Already in basket from outside — do nothing
            document.getElementById('xr-add-btn').classList.toggle('in-basket', _basket.has(key));
        });

        document.getElementById('basket-bar').addEventListener('click', _openBasket);
        document.getElementById('basket-bar-delete').addEventListener('click', e => {
            e.stopPropagation();
            const keys = [..._basket.keys()];
            _basket.clear();
            keys.forEach(k => _syncQtyCtrl(k));
            _updateBasketBar();
        });
        document.getElementById('basket-close').addEventListener('click', _closeBasket);
        document.getElementById('basket-panel').addEventListener('click', e => {
            if (e.target === document.getElementById('basket-panel')) _closeBasket();
        });
        document.getElementById('basket-clear').addEventListener('click', () => {
            if (_basket.size > 0) {
                const snapshot = [];
                let total = 0;
                _basket.forEach(({ item, qty }) => {
                    snapshot.push({ name: item.name, qty, price: item.price });
                    total += _parsePrice(item.price) * qty;
                });
                track('basket_clear', null, {
                    item_count: snapshot.length,
                    items: snapshot,
                    total_gel: Math.round(total * 10) / 10,
                });
            }
            const keys = [..._basket.keys()];
            _basket.clear();
            keys.forEach(k => _syncQtyCtrl(k));
            _updateBasketBar();
            _renderBasketPanel();
        });
document.getElementById('basket-items').addEventListener('click', e => {
            const btn = e.target.closest('.qty-btn');
            if (!btn) return;
            const entry = _basket.get(btn.dataset.key);
            if (entry) _setQty(btn.dataset.key, entry.qty + parseInt(btn.dataset.delta));
        });

        // ── Show-to-waiter QR (order teleport) ────────────────────────────
        // The customer's basket is packed into a URL fragment and drawn as a
        // QR. The waiter scans it → opens /waiter.html which re-resolves the
        // item ids against the LIVE menu (so prices are always current).
        // Everything here is client-only; the QR library loads lazily on the
        // first tap so it never touches the menu's initial load.
        let _qrLibPromise = null;
        function _loadQRLib() {
            if (window.qrcode) return Promise.resolve();
            if (_qrLibPromise) return _qrLibPromise;
            _qrLibPromise = new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = './vendor/qrcode.js';
                s.onload = () => resolve();
                s.onerror = () => { _qrLibPromise = null; reject(new Error('qr lib failed')); };
                document.head.appendChild(s);
            });
            return _qrLibPromise;
        }

        function _packOrder() {
            const it = [];
            _basket.forEach(({ item, qty }) => {
                if (item && item.id) it.push([item.id, qty]);   // stable DB id, never the fragile index
            });
            const tenant = window.__tenant || {};
            const payload = { v: 1, r: tenant.restaurant_slug || '', ts: Date.now(), it };
            // UTF-8-safe base64url (matches decoder in waiter.html)
            const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload))))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            return { b64, count: it.length };
        }

        async function _showWaiterQR() {
            const overlay = document.getElementById('waiter-overlay');
            const box     = document.getElementById('waiter-qr');
            const u       = UI[window.__lang];
            const { b64, count } = _packOrder();
            if (!count) return;   // empty basket → nothing to show

            document.getElementById('waiter-overlay-title').textContent = u.showWaiter;
            document.getElementById('waiter-overlay-hint').textContent  = u.waiterHint;
            box.innerHTML = '';
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            try {
                await _loadQRLib();
                const url = location.origin + '/waiter.html#' + b64;
                // Prefer 'M' (~15% error correction — most reliable scan). Very large
                // baskets exceed 'M' capacity, so fall back to 'L' (~7%, more data).
                let svg = null;
                for (const ecc of ['M', 'L']) {
                    try {
                        const qr = qrcode(0, ecc);   // 0 = auto-size version
                        qr.addData(url);
                        qr.make();
                        svg = qr.createSvgTag({ cellSize: 6, margin: 4, scalable: true });
                        break;
                    } catch (_capacity) { /* try next, lower-ECC level */ }
                }
                if (!svg) throw new Error('too large for a single code');
                box.innerHTML = svg;
                track('waiter_qr_shown', null, { item_count: count });
            } catch (err) {
                box.innerHTML = '<p style="color:#b00020;font-size:0.85rem;padding:24px 12px;">' +
                    'This order is too large for one code — please call the waiter over.</p>';
            }
        }

        function _closeWaiterOverlay() {
            document.getElementById('waiter-overlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('basket-waiter-btn').addEventListener('click', e => {
            e.stopPropagation();
            _showWaiterQR();
        });
        document.getElementById('waiter-overlay-close').addEventListener('click', _closeWaiterOverlay);
        document.getElementById('waiter-overlay').addEventListener('click', e => {
            if (e.target === document.getElementById('waiter-overlay')) _closeWaiterOverlay();
        });

        // Reveal the footer only AFTER the menu is built. While menu-list is
        // empty the footer would render high in the viewport, then get shoved
        // ~700px down when the cards populate — a large CLS. Showing it after
        // the build means it appears below the full menu (off-screen), no shift.
        if (_previewAccessAllowed) {
            buildMenu().finally(() => document.querySelector('.site-footer')?.classList.add('show'));
        }
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            // Auto-reload the page when a new SW takes over — otherwise users
            // would keep running the old cached HTML until they manually refresh.
            let _swReloaded = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (_swReloaded) return;
                _swReloaded = true;
                location.reload();
            });
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(reg => {
                    // Force-check for a new SW on every page load.
                    reg.update().catch(() => {});
                    reg.addEventListener('updatefound', () => {
                        const newSW = reg.installing;
                        if (!newSW) return;
                        newSW.addEventListener('statechange', () => {
                            if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                                // A new SW is waiting — activate it immediately
                                newSW.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });
                }).catch(() => {});
            });
        }
    </script>
</body>
