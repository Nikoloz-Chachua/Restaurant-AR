<!DOCTYPE html>
<html lang="ka" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="./img/betareal-favicon.svg">
    <script>
        // ── KILLSWITCH ────────────────────────────────────────────────
        // One-shot cleanup for anyone who still has an old service worker
        // or stale cache from before the auto-update flow shipped (bl-v41+).
        // Unregisters every SW, deletes every cache, then reloads once.
        // The localStorage flag stops it from running twice.
        (async () => {
            try {
                const KILL_KEY = 'bl-killswitch-v41';
                if (localStorage.getItem(KILL_KEY)) return;
                if (!('serviceWorker' in navigator)) return;
                const regs = await navigator.serviceWorker.getRegistrations();
                const cacheNames = await caches.keys();
                if (regs.length === 0 && cacheNames.length === 0) {
                    localStorage.setItem(KILL_KEY, '1');
                    return;
                }
                localStorage.setItem(KILL_KEY, '1');
                await Promise.all(regs.map(r => r.unregister().catch(() => {})));
                await Promise.all(cacheNames.map(n => caches.delete(n).catch(() => {})));
                location.reload();
            } catch (_) {}
        })();
    </script>
    <meta name="description" content="Restaurant menu. View dishes in Augmented Reality before you order.">
    <meta property="og:title" content="Restaurant Menu">
    <meta property="og:description" content="Browse our menu and place dishes on your table in Augmented Reality.">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://pub-3c68559de18f4aee94d127e180937bdd.r2.dev" crossorigin>
    <!-- Fonts loaded non-render-blocking: the print->all swap drops the stylesheet off
         the critical path. display=swap means text shows immediately in a fallback. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700&display=swap"></noscript>
    <!-- model-viewer is NOT loaded here. It costs ~250KB + several seconds of main-thread
         eval, and is only needed for the grid's live-3D thumbnails and the tap-to-open 3D
         modal — never for AR (Android = WebXR/Three.js, iOS = native Quick Look). So it is
         loaded lazily AFTER first paint via _ensureModelViewer(): the menu paints as static
         poster images, then thumbnails upgrade to live 3D off the critical path. -->
    <!-- Supabase is reached via the REST API with native fetch (see _supaSelect/_supaInsert
         below). We do not load the 51KB @supabase/supabase-js UMD bundle — it was
         render-blocking and cost ~1.3s of main-thread CPU for what is three REST calls. -->
    <style>
        :root { --t: 0.22s ease; }

        [data-theme="night"] {
            --bg:          #14100b;
            --bg2:         #1e1711;
            --glow:        rgba(231,177,90,0.22);
            --glow2:       rgba(201,138,60,0.13);
            --shadow:      rgba(0,0,0,0.55);
            --card:        #211a12;
            --card2:       #2b2218;
            --border:      rgba(231,177,90,0.20);
            --text:        #f1e7d4;
            --dim:         #9a8a70;
            --accent:      #e7b15a;
            --accent2:     #c98a3c;
            --accent-text: #14100b;
            --thumb-bg:    #0d0a07;
            --modal-bg:    #14100b;
            --modal-rgb:   20,16,11;
            --bg-image:
                url("./img/grain.png"),
                radial-gradient(95% 55% at 50% -8%, var(--glow) 0%, transparent 60%),
                radial-gradient(70% 50% at 85% 35%, var(--glow2) 0%, transparent 72%),
                radial-gradient(140% 120% at 50% 40%, transparent 58%, var(--shadow) 130%),
                linear-gradient(175deg, var(--bg) 0%, var(--bg2) 60%, var(--bg) 100%);
            --bg-size: 64px 64px, auto, auto, auto, auto;
            --bg-repeat: repeat, no-repeat, no-repeat, no-repeat, no-repeat;
            --card-bg: linear-gradient(158deg, var(--card) 0%, var(--card2) 100%);
            --card-blur: 0px;
            --card-radius: 20px;
            --item-shadow: 0 3px 10px var(--shadow);
            --item-hover-shadow: 0 10px 22px var(--shadow);
            --accent-edge: linear-gradient(180deg, var(--accent), var(--accent2));
            --stage-bg: var(--thumb-bg);
            --thumb-vignette: radial-gradient(ellipse at center, transparent 32%, var(--card) 100%);
            --pill-bg: var(--card);
            --pill-active-bg: linear-gradient(120deg, var(--accent), var(--accent2));
            --cta-bg: linear-gradient(120deg, var(--accent), var(--accent2));
            --cta-shadow: 0 4px 14px var(--glow);
            --hero-color: var(--accent);
            --hero-shadow: 0 2px 16px var(--glow);
            --divider-bg: linear-gradient(90deg, transparent, var(--accent2), transparent);
            --modal-bg-image:
                radial-gradient(70% 48% at 50% 36%, var(--glow) 0%, transparent 62%),
                radial-gradient(130% 100% at 50% 50%, var(--bg2) 0%, var(--modal-bg) 72%);
        }

        [data-theme="day"] {
            --bg:          #f3e9d6;
            --bg2:         #ead9bd;
            --glow:        rgba(176,122,30,0.18);
            --glow2:       rgba(154,100,24,0.11);
            --shadow:      rgba(120,80,10,0.18);
            --card:        #fbf4e4;
            --card2:       #ecdcc0;
            --border:      rgba(176,122,30,0.22);
            --text:        #221a0e;
            --dim:         #6b5a3c;
            --accent:      #8c6014;
            --accent2:     #86560f;
            --accent-text: #ffffff;
            --thumb-bg:    #c8b898;
            --modal-bg:    #f3e9d6;
            --modal-rgb:   243,233,214;
            --bg-image:
                url("./img/grain.png"),
                radial-gradient(95% 55% at 50% -8%, var(--glow) 0%, transparent 60%),
                radial-gradient(70% 50% at 85% 35%, var(--glow2) 0%, transparent 72%),
                radial-gradient(140% 120% at 50% 40%, transparent 58%, var(--shadow) 130%),
                linear-gradient(175deg, var(--bg) 0%, var(--bg2) 60%, var(--bg) 100%);
            --bg-size: 64px 64px, auto, auto, auto, auto;
            --bg-repeat: repeat, no-repeat, no-repeat, no-repeat, no-repeat;
            --card-bg: linear-gradient(158deg, var(--card) 0%, var(--card2) 100%);
            --card-blur: 0px;
            --card-radius: 20px;
            --item-shadow: 0 3px 10px var(--shadow);
            --item-hover-shadow: 0 10px 22px var(--shadow);
            --accent-edge: linear-gradient(180deg, var(--accent), var(--accent2));
            --stage-bg: var(--thumb-bg);
            --thumb-vignette: radial-gradient(ellipse at center, transparent 32%, var(--card) 100%);
            --pill-bg: var(--card);
            --pill-active-bg: linear-gradient(120deg, var(--accent), var(--accent2));
            --cta-bg: linear-gradient(120deg, var(--accent), var(--accent2));
            --cta-shadow: 0 4px 14px var(--glow);
            --hero-color: var(--accent);
            --hero-shadow: 0 2px 16px var(--glow);
            --divider-bg: linear-gradient(90deg, transparent, var(--accent2), transparent);
            --modal-bg-image:
                radial-gradient(70% 48% at 50% 36%, var(--glow) 0%, transparent 62%),
                radial-gradient(130% 100% at 50% 50%, var(--bg2) 0%, var(--modal-bg) 72%);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        button { touch-action: manipulation; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            padding: 0 16px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: color var(--t);
            overflow-x: hidden;
        }
        html:not([data-template]) body,
        html[data-template=""] body {
            opacity: 0;
        }
        html[data-template] body {
            opacity: 1;
            transition: color var(--t), opacity 0.12s ease;
        }

        /* Fixed background layer — painted once, never repaints on scroll.
           A single layer holds the warm gradient + glow + framing vignette
           + a tiny pre-baked grain tile (no live SVG filter, no extra
           full-screen compositing layer). Kept lightweight for mobile paint. */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background-color: var(--bg);
            background-image: var(--bg-image);
            background-repeat: var(--bg-repeat);
            background-size: var(--bg-size);
            background-position: center;
        }

        .header {
            width: 100%;
            max-width: 450px;
            text-align: center;
            padding: 56px 0 22px;
            position: relative;
        }

        .header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.8rem, 10vw, 3.8rem);
            letter-spacing: 8px;
            color: var(--hero-color);
            line-height: 1;
            text-shadow: var(--hero-shadow);
            transition: color var(--t);
        }

        .tenant-logo {
            display: none;
            max-width: min(210px, 58vw);
            max-height: 120px;
            width: auto;
            height: auto;
            margin: 0 auto 18px;
            object-fit: contain;
            filter: drop-shadow(0 10px 24px var(--shadow));
        }

        /* Glowing divider under the hero title */
        .header::after {
            content: '';
            display: block;
            width: 72px;
            height: 3px;
            margin: 18px auto 0;
            border-radius: 3px;
            background: var(--divider-bg);
            box-shadow: 0 0 14px var(--glow);
        }

        .tagline {
            font-size: 0.68rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--dim);
            margin-top: 6px;
            font-weight: 700;
            transition: color var(--t);
        }

        #theme-toggle, #lang-toggle {
            position: fixed;
            top: 14px;
            z-index: 1000;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px 16px;
            cursor: pointer;
            color: var(--text);
            font-family: 'Nunito', sans-serif;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: background var(--t), color var(--t), border-color var(--t);
        }
        #theme-toggle { right: 14px; }
        #lang-toggle  { left: 14px; }
        #theme-toggle:active, #lang-toggle:active { opacity: 0.65; }

        .menu-list {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .menu-item {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            box-shadow: var(--item-shadow);
            display: grid;
            grid-template-columns: 108px 1fr;
            grid-template-rows: auto 1fr;
            grid-template-areas: "name  right" "left  right";
            padding: 12px;
            column-gap: 12px;
            row-gap: 6px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color var(--t);
            contain: content;
            touch-action: manipulation;
            backdrop-filter: blur(var(--card-blur));
            -webkit-backdrop-filter: blur(var(--card-blur));
        }
        /* Glowing accent edge on every card */
        .menu-item::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--accent-edge);
        }
        .menu-item:active { transform: scale(0.985); box-shadow: 0 2px 6px var(--shadow); }
        @media (hover: hover) {
            .menu-item:hover {
                transform: translateY(-3px);
                box-shadow: var(--item-hover-shadow);
                border-color: var(--accent);
            }
        }

        .thumb-wrap {
            position: relative;
            width: 108px;
            height: 100%;
            min-height: 108px;
            border-radius: 14px;
            overflow: hidden;
            background: var(--stage-bg);
            border: 1px solid var(--border);
            transition: background var(--t), border-color var(--t);
        }
        .thumb-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: var(--thumb-vignette);
            opacity: 0.6;
        }
        .thumb-wrap model-viewer {
            width: 100%;
            height: 100%;
            min-height: 108px;
            background: transparent;
            display: block;
            touch-action: pan-y;
        }
        .thumb-wrap .thumb-img {
            width: 100%;
            height: 100%;
            min-height: 108px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        /* ── Fullscreen image lightbox (photo-only items) ── */
        #img-lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.9);
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            padding: 24px;
            cursor: zoom-out;
            animation: lightbox-fade 0.18s ease;
        }
        #img-lightbox.open { display: flex; }
        @keyframes lightbox-fade { from { opacity: 0; } to { opacity: 1; } }
        #lightbox-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 14px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
        }
        #img-lightbox .close-btn {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 1001;
        }

        .badge-3d {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--cta-bg);
            color: var(--accent-text);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 1.5px;
            padding: 2px 7px 3px;
            line-height: 1.4;
            border-radius: 10px 0 13px 0;
            box-shadow: 0 0 14px var(--glow);
            pointer-events: none;
            z-index: 3;
            transition: background var(--t), color var(--t);
        }

        .item-left {
            grid-area: left;
        }

        .item-right {
            grid-area: right;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            user-select: none;
        }

        .item-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            flex-shrink: 0;
            min-height: 34px;
        }

        .item-name {
            grid-area: name;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 1px;
            color: var(--accent);
            line-height: 1.2;
            transition: color var(--t);
            overflow-wrap: break-word;
            word-break: break-word;
        }

        /* ── Monday Greens template — mobile card layout ──
           Name becomes the full-width top row; image bottom-left, description
           bottom-right. Long Georgian names wrap to the next line instead of
           being clipped in the old narrow (108px) name column. Scoped to this
           template only so other tenants' cards are unchanged. */
        [data-template="monday_greens"] .menu-item {
            grid-template-columns: 108px minmax(0, 1fr);
            grid-template-areas: "name  name" "left  right";
            min-width: 0;
        }
        [data-template="monday_greens"] .item-name {
            overflow-wrap: anywhere;
            word-break: normal;
            white-space: normal;
            min-width: 0;
        }
        /* Photo-only items: tap the image to expand it (see lightbox JS). */
        [data-template="monday_greens"] .thumb-img {
            cursor: zoom-in;
        }

        .ar-btn {
            background: var(--cta-bg);
            color: var(--accent-text);
            border: none;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 0.63rem;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            letter-spacing: 0.8px;
            cursor: pointer;
            white-space: nowrap;
            text-transform: uppercase;
            display: block;
            width: 100%;
            min-height: 44px;
            margin-top: 6px;
            box-shadow: var(--cta-shadow);
            transition: background var(--t), opacity 0.15s, box-shadow 0.15s;
        }
        .ar-btn:active { opacity: 0.7; transition: opacity 0.08s; }
        .ar-btn:disabled { opacity: 0.45; cursor: wait; }

        .ingredients {
            flex: 1;
            font-size: 0.72rem;
            color: var(--dim);
            line-height: 1.3;
            transition: color var(--t);
            overflow-wrap: break-word;
        }

        .price {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 1px;
            color: var(--accent);
            transition: color var(--t);
        }

        .category-header {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 5px;
            color: var(--accent);
            padding: 20px 4px 8px;
            border-bottom: 1px solid var(--border);
            width: 100%;
            max-width: 450px;
            transition: color var(--t), border-color var(--t);
        }

        /* Georgian text should feel clean, not forced through the condensed
           Latin display font or huge tracking. */
        html[lang="ka"] .category-header,
        html[lang="ka"] .cat-pill,
        html[lang="ka"] .tagline,
        html[lang="ka"] .item-name,
        html[lang="ka"] #modal-title,
        html[lang="ka"] #modal-title-d {
            font-family: 'Nunito', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            letter-spacing: 0.7px;
        }
        html[lang="ka"] .category-header {
            font-size: 1.08rem;
            font-weight: 900;
            padding-top: 22px;
        }

        /* ── Footer ── */
        .site-footer {
            width: 100%;
            max-width: 450px;
            margin-top: 48px;
            padding: 28px 16px 8px;
            border-top: 1px solid var(--border);
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
        }
        .site-footer.show { display: flex; }
        .footer-logo {
            height: 34px;
            width: auto;
            opacity: 0.92;
        }
        /* Show the logo variant that matches the active theme */
        .footer-logo-light { display: none; }
        [data-theme="day"] .footer-logo-dark  { display: none; }
        [data-theme="day"] .footer-logo-light { display: block; }
        .footer-email {
            font-family: 'Nunito', sans-serif;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--accent);
            text-decoration: none;
            transition: color var(--t), opacity 0.15s;
        }
        .footer-email:active { opacity: 0.6; }
        @media (hover: hover) { .footer-email:hover { opacity: 0.75; } }
        .footer-copy {
            font-size: 0.66rem;
            letter-spacing: 1px;
            color: var(--dim);
            transition: color var(--t);
        }

        /* ── Modal (3D view page) — a lit stage ── */
        #modal {
            position: fixed;
            inset: 0;
            background: var(--modal-bg-image);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s, background var(--t);
        }
        #modal.active { opacity: 1; }

        /* Mobile: title above viewer */
        #modal-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.2rem, 8vw, 3.2rem);
            letter-spacing: 4px;
            background: linear-gradient(100deg, var(--accent), var(--accent2), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: var(--accent);
            text-shadow: 0 2px 18px var(--glow);
            text-align: center;
            width: 100%;
            padding: 0 24px;
            margin-top: 56px;
            line-height: 1.1;
        }

        /* Viewer wrapper */
        #modal-viewer-wrap {
            position: relative;
            display: inline-block;
            width: 95vw;
            margin-top: 8px;
        }
        #modal-viewer { width: 100%; height: 62vh; background: transparent; display: block; position: relative; z-index: 1; }
        /* Stage floor glow — grounds the model on a pool of light */
        #modal-viewer-wrap::before {
            content: '';
            position: absolute;
            left: 50%; bottom: 7%;
            transform: translateX(-50%);
            width: 66%; height: 16%;
            background: radial-gradient(ellipse at center, var(--glow) 0%, transparent 72%);
            pointer-events: none;
            z-index: 0;
        }
        .modal-vignette {
            position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
            background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.55) 100%);
        }

        /* Mobile: drawer is a flat always-open block */
        #modal-drawer { width: 100%; text-align: center; padding: 0; background: none; }
        #modal-drawer-handle { display: none; }
        #modal-title-d       { display: none; }

        #modal-price {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(1.6rem, 6vw, 2.3rem);
            letter-spacing: 3px;
            background: linear-gradient(100deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: var(--accent);
            text-align: center;
            margin-top: 8px;
        }
        #modal-description {
            font-size: 0.75rem;
            color: var(--dim);
            line-height: 1.5;
            text-align: center;
            padding: 0 28px;
            margin-top: 6px;
            max-width: 380px;
            transition: color var(--t);
        }
        #modal-qty-wrap { display: flex; justify-content: center; margin-top: 10px; }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(var(--modal-rgb), 0.6);
            color: var(--text);
            border: 1px solid var(--accent);
            border-radius: 50%;
            padding: 0;
            cursor: pointer;
            font-size: 1.05rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            line-height: 1;
            box-shadow: 0 4px 16px var(--glow);
            transition: background var(--t), color var(--t), transform 0.12s;
        }
        .close-btn:active { transform: scale(0.92); }

        /* ── Desktop: slide-up drawer (>=640px) ── */
        @media (min-width: 640px) {
            #modal { overflow: hidden; }
            #modal-title { display: none; }

            /* Viewer shifts up when drawer opens */
            #modal-viewer-wrap {
                position: absolute;
                top: 0; left: 0; right: 0; bottom: 88px;
                width: 100%; display: block; margin-top: 0;
                transition: bottom 0.32s cubic-bezier(0.4,0,0.2,1);
            }
            #modal.drawer-expanded #modal-viewer-wrap { bottom: var(--drawer-full-h, 300px); }
            #modal-viewer { width: 100%; height: 100%; }

            #modal-drawer {
                position: absolute;
                bottom: 0; left: 0; right: 0; z-index: 2;
                padding: 12px 32px max(36px, env(safe-area-inset-bottom, 36px));
                background: linear-gradient(to bottom,
                    rgba(var(--modal-rgb),0) 0%,
                    rgba(var(--modal-rgb),0.9) 22%,
                    rgba(var(--modal-rgb),0.98) 100%
                );
                cursor: pointer; user-select: none; text-align: center;
                transition: background var(--t);
            }
            #modal-drawer.expanded { cursor: default; }

            #modal-drawer-handle {
                display: block; width: 36px; height: 4px;
                background: rgba(255,255,255,0.2); border-radius: 2px;
                margin: 0 auto 14px;
            }
            #modal-title-d {
                display: block;
                font-family: 'Bebas Neue', sans-serif;
                font-size: clamp(1.6rem, 3vw, 2.2rem);
                letter-spacing: 3px; color: var(--accent); line-height: 1.1;
                transition: color var(--t);
            }
            #modal-price { font-size: 1rem; letter-spacing: 2px; opacity: 0.6; margin-top: 2px; }

            #modal-drawer-body {
                display: grid; grid-template-rows: 0fr;
                transition: grid-template-rows 0.32s cubic-bezier(0.4,0,0.2,1);
            }
            #modal-drawer.expanded #modal-drawer-body { grid-template-rows: 1fr; }
            #modal-drawer-body > div { overflow: hidden; min-height: 0; padding-bottom: 4px; }

            #modal-description { text-align: center; padding: 0; margin: 14px auto 0; font-size: 0.88rem; max-width: 560px; width: 100%; }
            #modal-qty-wrap { justify-content: center; margin-top: 16px; }
            #modal-ar-btn { width: auto; min-width: 220px; margin: 14px auto 0; display: block; }
            .close-btn { z-index: 3; }
        }

        .tip {
            margin-top: 4px;
            color: var(--dim);
            font-size: 0.82rem;
            letter-spacing: 1px;
            transition: color var(--t);
        }

        #modal-message {
            display: none;
            max-width: 340px;
            margin: 10px auto 0;
            color: var(--accent);
            font-size: 0.82rem;
            font-weight: 800;
            line-height: 1.35;
            letter-spacing: 0.5px;
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 1px solid var(--accent);
            background: rgba(var(--modal-rgb), 0.6);
            color: var(--accent);
            font-size: 1.5rem;
            line-height: 1;
            padding: 0;
            cursor: pointer;
            z-index: 10000;
            box-shadow: 0 4px 18px var(--glow);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.12s;
        }
        .nav-arrow:active { transform: translateY(-50%) scale(0.9); }
        .left-arrow  { left: 10px; }
        .right-arrow { right: 10px; }

        /* ── WebXR overlay ── */
        #xr-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 51;
            pointer-events: none;
        }
        #xr-gesture-layer {
            display: none;
            position: absolute;
            inset: 0;
            pointer-events: all;
            z-index: 1;
        }
        #xr-place-hint {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 14px;
    background: rgba(0,0,0,0.65);
    padding: 10px 20px;
    border-radius: 20px;
    white-space: normal;
    text-align: center;
    width: 80%;
    max-width: 320px;
}
        #xr-nav-row {
            display: none;
            position: absolute;
            z-index: 2;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: all;
            align-items: center;
            gap: 16px;
            background: rgba(0,0,0,0.65);
            padding: 8px 20px;
            border-radius: 30px;
        }
        #xr-nav-row button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.35);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            pointer-events: all;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #xr-move-hint {
            display: none;
            position: absolute;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-family: 'Nunito', sans-serif;
            font-size: 12px;
            white-space: normal;
            text-align: center;
            max-width: 80%;
        }
        #xr-exit, #xr-carousel-toggle, #xr-label-toggle, #xr-place-again, #xr-hide-ui {
            pointer-events: all;
            position: absolute;
            z-index: 2;
            background: rgba(0,0,0,0.65);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Nunito', sans-serif;
            font-size: 13px;
            cursor: pointer;
        }
        #xr-exit             { top: 18px; right: 18px; }
        #xr-place-again      { top: 62px; right: 18px; display: none; }
        #xr-hide-ui          { top: 18px; left: 18px; display: block; transition: opacity 0.25s; }
        #xr-carousel-toggle  { top: 62px; left: 18px; display: none; }
        #xr-label-toggle     { top: 106px; left: 18px; display: none; }
        #xr-hide-ui.ui-hidden { opacity: 0.35; }
        #xr-add-btn {
            display: none;
            pointer-events: all;
            position: absolute;
            z-index: 2;
            bottom: 55px;
            right: 18px;
            background: rgba(0,0,0,0.45);
            color: rgba(255,255,255,0.55);
            border: 1.5px solid rgba(255,255,255,0.25);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        #xr-add-btn.visible   { display: flex; }
        #xr-add-btn.in-basket { background: rgba(240,192,64,0.92); color: #0d0d0d; border-color: transparent; }
        #xr-hint-step {
            font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
            color: rgba(255,255,255,.5); margin-bottom: 3px;
        }
        #xr-hint-main { font-size: 14px; color: #fff; }
        #xr-scale-gauge {
            display: none;
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.65);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 8px 16px;
            pointer-events: none;
            min-width: 130px;
            text-align: center;
        }
        #xr-scale-track {
            height: 4px;
            background: rgba(255,255,255,0.18);
            border-radius: 2px;
            position: relative;
            margin-bottom: 5px;
        }
        #xr-scale-fill {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            background: #f0c040;
            border-radius: 2px;
        }
        #xr-scale-mark {
            position: absolute;
            top: -3px;
            width: 2px;
            height: 10px;
            background: rgba(255,255,255,0.55);
            border-radius: 1px;
            left: calc(53.7% - 1px);
        }
        #xr-scale-pct {
            font-family: 'Nunito', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        /* ── Category filter bar ── */
        .cat-filter {
            width: 100%;
            max-width: 450px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 0 8px;
            margin-bottom: 2px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .cat-filter::-webkit-scrollbar { display: none; }

        .cat-pill {
            background: var(--pill-bg);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px 14px;
            min-height: 40px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--dim);
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background var(--t), border-color var(--t), color var(--t);
            touch-action: manipulation;
        }
        .cat-pill:active { opacity: 0.7; transition: opacity 0.08s; }
        .cat-pill.active {
            background: var(--pill-active-bg);
            color: var(--accent-text);
            border-color: transparent;
            box-shadow: var(--cta-shadow);
        }

        .cat-section { display: contents; }

        [data-template="fresh_glass"] {
            --card-blur: 14px;
            --card-radius: 22px;
        }
        [data-template="fresh_glass"] .menu-item {
            box-shadow: 0 14px 34px var(--shadow);
        }
        [data-template="fresh_glass"] .menu-item::before {
            width: 100%;
            height: 1px;
            right: 0;
            bottom: auto;
            background: linear-gradient(90deg, transparent, var(--accent2), transparent);
        }
        [data-template="minimal_sushi"] {
            --card-radius: 14px;
        }
        [data-template="minimal_sushi"] .menu-item::before {
            width: 2px;
        }
        [data-template="monday_greens"] {
            --bg-image: linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%);
            --bg-size: auto;
            --bg-repeat: no-repeat;
        }
        [data-template="minimal_sushi"] .ar-btn,
        [data-template="minimal_sushi"] .cat-pill.active,
        [data-template="urban_night"] .ar-btn,
        [data-template="urban_night"] .cat-pill.active,
        [data-template="elegant_black"] .ar-btn,
        [data-template="elegant_black"] .cat-pill.active {
            box-shadow: 0 7px 20px var(--glow);
        }
        [data-template="mediterranean_air"] .thumb-wrap,
        [data-template="soft_cafe"] .thumb-wrap {
            background:
                radial-gradient(90% 70% at 50% 20%, var(--glow2), transparent 72%),
                var(--thumb-bg);
        }

        /* ── Monday Greens template: full-bleed hero photo + logo ── */
        .mg-hero { display: none; }
        [data-template="monday_greens"] .mg-hero {
            position: relative;
            width: 100vw;
            margin-left: calc(50% - 50vw);
            margin-right: calc(50% - 50vw);
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }
        /* The default text title is replaced by branded Monday Greens logos. */
        [data-template="monday_greens"] .header {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: none;
            padding: 34px 18px 10px;
            margin: 0 auto 8px;
        }
        [data-template="monday_greens"] .header::after { display: none; }
        [data-template="monday_greens"] .header h1 { display: none; }
        [data-template="monday_greens"] .tenant-logo {
            display: block;
            max-width: min(300px, 64vw);
            margin: 0 auto;
            filter: drop-shadow(0 8px 18px rgba(0,0,0,0.08));
        }
        [data-template="monday_greens"] .mg-hero-photo {
            position: absolute; inset: 0; z-index: 0;
            background-color: #063236; /* fallback while the photo loads / if unset */
            background-image: var(--hero-image, none);
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }
        [data-template="monday_greens"] .mg-hero-veil {
            position: absolute; inset: 0; z-index: 1;
            background:
                radial-gradient(66% 40% at 50% 46%, rgba(0,0,0,0.40) 0%, transparent 70%),
                linear-gradient(to bottom, rgba(0,0,0,0.16) 0%, transparent 20%, transparent 68%, var(--bg) 100%);
        }
        [data-theme="day"] [data-template="monday_greens"] .mg-hero-veil,
        [data-template="monday_greens"][data-theme="day"] .mg-hero-veil {
            background:
                radial-gradient(62% 36% at 50% 46%, rgba(0,0,0,0.28) 0%, transparent 72%),
                linear-gradient(to bottom, transparent 90%, var(--bg) 100%);
        }
        [data-template="monday_greens"] .mg-hero-logo {
            position: relative; z-index: 2;
            width: clamp(240px, 74vw, 540px);
            max-width: calc(100% - 48px);
            height: auto;
            filter: drop-shadow(0 2px 9px rgba(0,0,0,0.6)) drop-shadow(0 10px 40px rgba(0,0,0,0.45));
            animation: mg-hero-rise 0.9s cubic-bezier(0.2,0.7,0.2,1) both;
        }
        /* No logo set → hide the <img> (its alt text would otherwise show). */
        [data-template="monday_greens"] .mg-hero-logo:not([src]) { display: none; }
        @keyframes mg-hero-rise {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        [data-template="monday_greens"] .mg-hero-scroll {
            position: absolute; z-index: 2;
            bottom: max(26px, env(safe-area-inset-bottom, 26px));
            left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            color: rgba(255,255,255,0.82);
            font-size: 0.62rem; font-weight: 800; letter-spacing: 3px;
            text-transform: uppercase; text-decoration: none;
        }
        [data-template="monday_greens"] .mg-hero-scroll svg {
            width: 22px; height: 22px; animation: mg-nudge 1.8s ease-in-out infinite;
        }
        @keyframes mg-nudge {
            0%, 100% { transform: translateY(0); opacity: 0.7; }
            50%      { transform: translateY(5px); opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
            [data-template="monday_greens"] .mg-hero-logo,
            [data-template="monday_greens"] .mg-hero-scroll svg { animation: none; }
        }

        /* ── Quantity stepper (add-to-basket control) ── */
        .qty-ctrl { flex-shrink: 0; }

        .qty-add-btn {
            background: transparent;
            color: var(--accent);
            border: 1.5px solid var(--accent);
            border-radius: 9px;
            width: 34px;
            height: 34px;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background var(--t), color var(--t), border-color var(--t), opacity 0.15s;
            touch-action: manipulation;
        }
        .qty-add-btn:active { opacity: 0.7; transition: opacity 0.08s; }

        .qty-stepper {
            display: none;
            align-items: stretch;
            border: 1.5px solid var(--accent);
            border-radius: 9px;
            overflow: hidden;
            height: 34px;
            box-sizing: border-box;
            transition: border-color var(--t);
        }
        .qty-stepper.visible { display: flex; }

        .qty-dec, .qty-inc {
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: 1rem;
            font-weight: 700;
            padding: 0 10px;
            cursor: pointer;
            line-height: 1;
            display: flex;
            align-items: center;
            touch-action: manipulation;
            transition: background var(--t), color var(--t);
            user-select: none;
        }
        .qty-dec { border-right: 1px solid var(--accent); }
        .qty-inc { border-left:  1px solid var(--accent); }
        .qty-dec:active, .qty-inc:active {
            background: var(--accent);
            color: var(--accent-text);
            transition: none;
        }

        .qty-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            color: var(--accent);
            min-width: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 2px;
            user-select: none;
            transition: color var(--t);
        }

        /* ── Basket bar (fixed bottom) ── */
        #basket-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: var(--cta-bg);
            color: var(--accent-text);
            padding: 15px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 5000;
            cursor: pointer;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), background var(--t);
            touch-action: manipulation;
            font-family: 'Nunito', sans-serif;
        }
        #basket-bar.visible { transform: translateY(0); }
        body.basket-bar-visible { padding-bottom: 80px; }
        #basket-bar-count { font-size: 0.82rem; font-weight: 700; }
        #basket-bar-delete {
            background: transparent;
            border: 1.5px solid var(--accent-text);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            color: var(--accent-text);
            display: flex;
            align-items: center;
            opacity: 0.75;
            touch-action: manipulation;
            transition: opacity 0.15s;
            flex-shrink: 0;
        }
        #basket-bar-delete:active { opacity: 1; transition: none; }
        #basket-bar-total {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 2px;
        }

        /* ── Basket panel ── */
        #basket-panel {
            position: fixed;
            inset: 0;
            z-index: 9000;
            display: none;
            flex-direction: column;
            background: var(--bg);
            opacity: 0;
            transition: opacity 0.22s ease, background var(--t);
        }
        #basket-panel.active { opacity: 1; }

        .basket-header {
            display: flex;
            align-items: center;
            padding: 20px 20px 14px;
            border-bottom: 1px solid var(--border);
            gap: 10px;
            transition: border-color var(--t);
        }
        #basket-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 4px;
            color: var(--accent);
            flex: 1;
            transition: color var(--t);
        }
        #basket-clear {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 12px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--dim);
            cursor: pointer;
            touch-action: manipulation;
            transition: border-color var(--t), color var(--t);
        }
        #basket-close {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 14px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            touch-action: manipulation;
            transition: background var(--t), color var(--t), border-color var(--t);
        }
        #basket-items {
            flex: 1;
            overflow-y: auto;
            padding: 8px 20px;
        }
        .basket-empty {
            color: var(--dim);
            text-align: center;
            padding: 48px 0;
            font-size: 0.9rem;
            transition: color var(--t);
        }
        .basket-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 0;
            border-bottom: 1px solid var(--border);
            transition: border-color var(--t);
        }
        .basket-item-name {
            flex: 1;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            color: var(--accent);
            transition: color var(--t);
        }
        .basket-qty {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card2);
            border-radius: 8px;
            padding: 3px 8px;
            transition: background var(--t);
        }
        .qty-btn {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1.1rem;
            width: 26px;
            height: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            transition: color var(--t);
        }
        .qty-count {
            font-weight: 700;
            font-size: 0.88rem;
            min-width: 18px;
            text-align: center;
            color: var(--text);
            transition: color var(--t);
        }
        .basket-item-price {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            color: var(--text);
            min-width: 56px;
            text-align: right;
            transition: color var(--t);
        }
.basket-footer {
            padding: 16px 20px;
            border-top: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color var(--t);
        }
        #basket-total-label {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: var(--dim);
            transition: color var(--t);
        }
        #basket-total {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 3px;
            color: var(--accent);
            transition: color var(--t);
        }

        /* ── Show-to-waiter button (in basket footer) ── */
        .basket-footer { flex-direction: column; gap: 12px; }
        .basket-total-row {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%;
        }
        #basket-waiter-btn {
            width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 13px 18px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.15rem; letter-spacing: 2px;
            color: #111; background: var(--accent);
            border: none; border-radius: 12px; cursor: pointer;
            transition: opacity 0.15s ease, transform 0.1s ease;
        }
        #basket-waiter-btn:active { transform: scale(0.98); }
        #basket-waiter-btn:disabled { opacity: 0.55; cursor: default; }

        /* ── Show-to-waiter QR overlay ── */
        #waiter-overlay {
            position: fixed; inset: 0; z-index: 100000; /* above basket-panel (9000) — it opens from within the basket */
            display: none; align-items: center; justify-content: center;
            padding: 24px;
            background: rgba(0,0,0,0.74);

            _rrPath(ctx, 6, 6, W - 12, H - 12, 20);
            ctx.fill();

            ctx.strokeStyle = 'rgba(240, 192, 64, 0.7)';
            ctx.lineWidth = 3;
            _rrPath(ctx, 6, 6, W - 12, H - 12, 20);
            ctx.stroke();

            ctx.fillStyle = '#f0c040';
            ctx.font = 'bold 44px Arial, sans-serif';
            ctx.fillText(name, 28, 52, W - 56);

            ctx.strokeStyle = 'rgba(240, 192, 64, 0.30)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(28, 66); ctx.lineTo(W - 28, 66); ctx.stroke();

            ctx.fillStyle = '#c0c0c0';
            ctx.font = '22px Arial, sans-serif';
            _wrapText(ctx, desc, 28, 88, W - 56, 28, 3);

            ctx.fillStyle = '#f0c040';
            ctx.font = 'bold 36px Arial, sans-serif';
            ctx.fillText(item.price, 28, H - 20);

            if (labelTexture) labelTexture.needsUpdate = true;
        }

        function createLabelMesh() {
            const W = 512, H = 210;
            labelCanvas = document.createElement('canvas');
            labelCanvas.width = W; labelCanvas.height = H;
            labelCtx = labelCanvas.getContext('2d');
            labelTexture = new THREE.CanvasTexture(labelCanvas);
            const mat = new THREE.MeshBasicMaterial({
                map: labelTexture, transparent: true, depthWrite: false, depthTest: false, side: THREE.DoubleSide
            });
            const planeW = 0.15, planeH = planeW * H / W;
            labelMesh = new THREE.Mesh(new THREE.PlaneGeometry(planeW, planeH), mat);
            labelMesh.position.set(0, 0.22, 0.015);
            labelMesh.visible = false;
            carouselRoot.add(labelMesh);
        }

        function updateLabelTransform() {
            if (!labelMesh) return;
            if (labelMode === 'float') {
                labelMesh.position.set(0, 0.22, 0.015);
            }
            // surface rotation updated per-frame in render loop
            const btn = document.getElementById('xr-label-toggle');
            const u = UI[window.__lang || 'en'];
            if (btn) btn.textContent = labelMode === 'float' ? u.onTable : u.floating;
        }

        // ── Models ────────────────────────────────────────────────────
        function preloadModels() {
            const paths = [...new Set(MENU.map(m => _safeAssetUrl(m.model) || m.model).filter(Boolean))];
            return Promise.allSettled(paths.map(p => {
                if (modelGLTFs[p]) return Promise.resolve();
                if (_modelLoadPromises[p]) return _modelLoadPromises[p];
                _modelLoadPromises[p] = new Promise((res, rej) =>
                    loader.load(p, gltf => { modelGLTFs[p] = gltf; res(); }, undefined, rej)
                );
                return _modelLoadPromises[p];
            })).then(results => {
                const failed = results.filter(r => r.status === 'rejected');
                if (failed.length) console.warn('Model load failures:', failed.map(f => f.reason));
                return failed;
            });
        }

        function cloneModel(menuIdx) {
            const modelUrl = _safeAssetUrl(MENU[menuIdx].model) || MENU[menuIdx].model || 'food.glb';
            const gltf = modelGLTFs[modelUrl];
            if (!gltf) return null;
            const obj = gltf.scene.clone(true);
            obj.traverse(n => { if (n.isMesh && n.material) n.material = n.material.clone(); });
            return obj;
        }

        function setSlotModel(slotIdx, menuIdx) {
            const old = meshObjs[slotIdx];
            if (old) slotGroups[slotIdx].remove(old);
            const obj = cloneModel(menuIdx);
            if (obj) {
                // Trust the GLB's own scale (1 unit = 1 metre).
                // ar_scale is an optional per-item override (default 1.0 = no change).
                const arScale = MENU[menuIdx].ar_scale || 1.0;
                if (arScale !== 1.0) obj.scale.setScalar(arScale);
                // Seat the model: bottom of bounding box sits at y=0
                const seated = new THREE.Box3().setFromObject(obj);
                if (isFinite(seated.min.y)) obj.position.y = -seated.min.y;
                slotGroups[slotIdx].add(obj);
                meshObjs[slotIdx] = obj;
            }
        }

        function initSlots() {
            const c = currentCenterMenu;
            menuOf = [mod(c - 1), c, mod(c + 1), mod(c + 2)];
            for (let i = 0; i < 4; i++) setSlotModel(i, menuOf[i]);
            const opacities = [_roleOp('left'), _roleOp('center'), _roleOp('right'), 0];
            INIT_ROLES.forEach((role, i) => {
                slotGroups[i].position.x = CFG[role].x;
                slotGroups[i].position.z = CFG[role].z;
                slotGroups[i].scale.setScalar(CFG[role].s);
                slotGroups[i].rotation.set(0, 0, 0);
                setOpacity(i, opacities[i]);
            });
            _syncXRAddBtn();
        }

        // ── Opacity ───────────────────────────────────────────────────
        function setOpacity(idx, opacity) {
            const obj = meshObjs[idx];
            if (!obj) return;
            obj.traverse(n => {
                if (n.isMesh && n.material) {
                    n.material.transparent = opacity < 1.0;
                    n.material.opacity     = Math.max(0, Math.min(1, opacity));
                    n.material.needsUpdate = true;
                }
            });
        }

        function animOpacity(idx, from, to, dur) {
            const t0 = performance.now();
            (function tick(now) {
                const t = Math.min((now - t0) / dur, 1);
                const e = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
                setOpacity(idx, from + (to - from) * e);
                if (t < 1) requestAnimationFrame(tick);
            })(performance.now());
        }

        // ── Slot animation ────────────────────────────────────────────
        function snapSlot(idx, role) {
            slotGroups[idx].position.x = CFG[role].x;
            slotGroups[idx].position.z = CFG[role].z;
            slotGroups[idx].scale.setScalar(CFG[role].s);
        }

        function animSlot(idx, role, dur) {
            const x0 = slotGroups[idx].position.x, x1 = CFG[role].x;
            const z0 = slotGroups[idx].position.z, z1 = CFG[role].z;
            const s0 = slotGroups[idx].scale.x,    s1 = CFG[role].s;
            const t0 = performance.now();
            (function tick(now) {
                const t = Math.min((now - t0) / dur, 1);
                const e = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
                slotGroups[idx].position.x = x0 + (x1 - x0) * e;
                slotGroups[idx].position.z = z0 + (z1 - z0) * e;
                slotGroups[idx].scale.setScalar(s0 + (s1 - s0) * e);
                if (t < 1) requestAnimationFrame(tick);
            })(performance.now());
        }

        // ── Navigation ────────────────────────────────────────────────
        function goNext() {
            if (isAnimating) return;
            isAnimating = true;
            const { left: lIdx, center: cIdx, right: rIdx, hidden: hIdx } = slotOf;
            if (hiddenSide === 'farLeft') snapSlot(hIdx, 'farRight');
            menuOf[hIdx] = mod(menuOf[rIdx] + 1);
            setSlotModel(hIdx, menuOf[hIdx]); setOpacity(hIdx, 0);
            animSlot(lIdx, 'farLeft', DUR); animSlot(cIdx, 'left',  DUR);
            animSlot(rIdx, 'center',  DUR); animSlot(hIdx, 'right', DUR);
            animOpacity(lIdx, _roleOp('left'),    0,                DUR);
            animOpacity(cIdx, _roleOp('center'),  _roleOp('left'),  DUR);
            animOpacity(rIdx, _roleOp('right'),   _roleOp('center'), DUR);
            animOpacity(hIdx, 0,                  _roleOp('right'), DUR);
            setTimeout(() => {
                slotOf = { left: cIdx, center: rIdx, right: hIdx, hidden: lIdx };
                hiddenSide = 'farLeft'; currentCenterMenu = mod(currentCenterMenu + 1);
                isAnimating = false;
                if (labelMesh && labelMesh.visible) drawLabel(MENU[currentCenterMenu]);
                _syncXRAddBtn();
                const _nItem = MENU[currentCenterMenu];
                const _nIdx  = (_nItem && window.__menuItems) ? window.__menuItems.indexOf(_nItem) : -1;
                if (_nIdx >= 0) window._arViewedItems?.add(_nIdx);
                window.track?.('xr_nav', _nIdx >= 0 ? _nIdx : null, { direction: 'next' });
            }, DUR + 10);
        }

        function goPrev() {
            if (isAnimating) return;
            isAnimating = true;
            const { left: lIdx, center: cIdx, right: rIdx, hidden: hIdx } = slotOf;
            if (hiddenSide === 'farRight') snapSlot(hIdx, 'farLeft');
            menuOf[hIdx] = mod(menuOf[lIdx] - 1);
            setSlotModel(hIdx, menuOf[hIdx]); setOpacity(hIdx, 0);
            animSlot(rIdx, 'farRight', DUR); animSlot(cIdx, 'right', DUR);
            animSlot(lIdx, 'center',   DUR); animSlot(hIdx, 'left',  DUR);
            animOpacity(rIdx, _roleOp('right'),   0,                 DUR);
            animOpacity(cIdx, _roleOp('center'),  _roleOp('right'),  DUR);
            animOpacity(lIdx, _roleOp('left'),    _roleOp('center'), DUR);
            animOpacity(hIdx, 0,                  _roleOp('left'),   DUR);
            setTimeout(() => {
                slotOf = { left: hIdx, center: lIdx, right: cIdx, hidden: rIdx };
                hiddenSide = 'farRight'; currentCenterMenu = mod(currentCenterMenu - 1);
                isAnimating = false;
                if (labelMesh && labelMesh.visible) drawLabel(MENU[currentCenterMenu]);
                _syncXRAddBtn();
                const _pItem = MENU[currentCenterMenu];
                const _pIdx  = (_pItem && window.__menuItems) ? window.__menuItems.indexOf(_pItem) : -1;
                if (_pIdx >= 0) window._arViewedItems?.add(_pIdx);
                window.track?.('xr_nav', _pIdx >= 0 ? _pIdx : null, { direction: 'prev' });
            }, DUR + 10);
        }

        // ── Scan/tap hint state ───────────────────────────────────────
        function _updateScanHint(found) {
            const stepEl = document.getElementById('xr-hint-step');
            const mainEl = document.getElementById('xr-hint-main');
            if (!stepEl) return;
            const u = UI[window.__lang || 'en'];
            stepEl.textContent = found ? u.hintStep2 : u.hintStep1;
            mainEl.textContent = found ? u.hintTap   : u.hintScan;
        }

        // ── Add-btn basket state sync ─────────────────────────────────
        function _syncXRAddBtn() {
            const btn = document.getElementById('xr-add-btn');
            if (!btn || !window.__menuItems) return;
            const item = MENU.length ? MENU[currentCenterMenu] : null;
            const idx  = item ? window.__menuItems.indexOf(item) : -1;
            const inBasket = idx >= 0 && window._basket && window._basket.has(String(idx));
            btn.classList.toggle('in-basket', inBasket);
        }

        function _applyUIHidden(hidden) {
            _xrUIHidden = hidden;
            const u = UI[window.__lang || 'en'];
            const hideBtn = document.getElementById('xr-hide-ui');
            if (!hideBtn) return;
            // Hidden: collapse info clutter; keep exit, place-again, arrows, cart visible
            if (hidden) {
                document.getElementById('xr-move-hint').style.display      = 'none';
                document.getElementById('xr-carousel-toggle').style.display = 'none';
                document.getElementById('xr-label-toggle').style.display    = 'none';
                document.getElementById('xr-scale-gauge').style.display     = 'none';
                if (labelMesh) labelMesh.visible = false;
                hideBtn.textContent = u.showUI;
            } else {
                if (placed) {
                    document.getElementById('xr-move-hint').style.display      = 'block';
                    document.getElementById('xr-carousel-toggle').style.display = 'block';
                    document.getElementById('xr-label-toggle').style.display    = 'block';
                    if (labelMesh) { drawLabel(MENU[currentCenterMenu]); updateLabelTransform(); labelMesh.visible = true; }
                }
                hideBtn.textContent = u.hideUI;
            }
        }

        // ── Placement ─────────────────────────────────────────────────
        function onSelect() {
            if (_ignoreNextSelect) { _ignoreNextSelect = false; return; }
            if (placed || !reticle.visible) return;
            carouselRoot.position.setFromMatrixPosition(reticle.matrix);
            carouselRoot.quaternion.setFromRotationMatrix(reticle.matrix);
            carouselRoot.visible = true;
            reticle.visible      = false;
            placed               = true;
            const _plItem = MENU[currentCenterMenu];
            const _plIdx  = (_plItem && window.__menuItems) ? window.__menuItems.indexOf(_plItem) : -1;
            window.track?.('ar_placed', _plIdx >= 0 ? _plIdx : null);
            gestureLayer.style.display = 'block';
            document.getElementById('xr-place-hint').style.display      = 'none';
            document.getElementById('xr-place-again').style.display     = 'block';
            document.getElementById('xr-nav-row').style.display          = 'flex';
            document.getElementById('xr-move-hint').style.display        = 'block';
            document.getElementById('xr-carousel-toggle').style.display  = 'block';
            if (labelMesh) { drawLabel(MENU[currentCenterMenu]); updateLabelTransform(); labelMesh.visible = true; }
            document.getElementById('xr-label-toggle').style.display = 'block';
            const _hBtn = document.getElementById('xr-hide-ui');
            _hBtn.textContent = UI[window.__lang || 'en'].hideUI;
        }

        function _resetPlacement() {
            _ignoreNextSelect = true;
            placed = false;
            carouselRoot.scale.setScalar(1);
            _pinchDist0 = null; _pinchScale0 = null;
            if (_scaleHideTimer) { clearTimeout(_scaleHideTimer); _scaleHideTimer = null; }
            document.getElementById('xr-scale-gauge').style.display = 'none';
            carouselRoot.visible = false;
            reticle.visible = false;
            gestureLayer.style.display = 'none';
            document.getElementById('xr-place-hint').style.display      = '';
            _reticleWasVisible = false; _updateScanHint(false);
            document.getElementById('xr-place-again').style.display     = 'none';
            document.getElementById('xr-nav-row').style.display          = 'none';
            document.getElementById('xr-move-hint').style.display        = 'none';
            document.getElementById('xr-carousel-toggle').style.display  = 'none';
            document.getElementById('xr-label-toggle').style.display     = 'none';
            if (labelMesh) labelMesh.visible = false;
            _xrUIHidden = false;
            _lastTouchStart = null;
            const _hBtnR = document.getElementById('xr-hide-ui');
            _hBtnR.classList.remove('ui-hidden');
            _hBtnR.textContent = UI[window.__lang || 'en'].hideUI;
        }

        // ── Loader bootstrap (shared between bg preload and _setup) ───
        let _setupDone = false;
        let _loaderPromise = null;
        const _modelLoadPromises = {};

        async function _ensureLoader() {
            if (loader) return;
            if (!_loaderPromise) {
                _loaderPromise = Promise.all([
                    import('https://esm.sh/three@0.155.0'),
                    import('https://esm.sh/three@0.155.0/examples/jsm/loaders/GLTFLoader'),
                    import('https://esm.sh/three@0.155.0/examples/jsm/exporters/GLTFExporter'),
                    import('https://esm.sh/three@0.155.0/examples/jsm/loaders/DRACOLoader'),
                ]);
            }
            const [threeNS, loaderMod, exporterMod, dracoMod] = await _loaderPromise;
            if (loader) return; // concurrent call already finished
            THREE        = threeNS;
            GLTFLoader   = loaderMod.GLTFLoader;
            GLTFExporter = exporterMod.GLTFExporter;
            loader       = new GLTFLoader();
            // Draco support for the WebXR carousel. model-viewer (3D modal + thumbnails)
            // bundles its own Draco decoder, but this Three.js path never did — that's
            // why Draco GLBs broke in AR before. The decoder is fetched lazily (only when
            // a model actually uses Draco) so non-Draco models pay nothing, and the SW
            // caches it after first use.
            const draco = new dracoMod.DRACOLoader();
            draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
            draco.setDecoderConfig({ type: 'wasm' });
            loader.setDRACOLoader(draco);
        }

        // ── iOS y-offset correction ───────────────────────────────────────────
        // Quick Look places the GLB's raw origin on the detected surface.
        // Most 3D tools export with origin at the model centre, so half the model
        // sinks below the table.  After backgroundPreload decodes every GLB with
        // Three.js we re-export a seated version (same fix as Android's setSlotModel)
        // and swap the launcher's src to the corrected blob.
        const _iosSeatedBlobs = {};
        let _resolvePreload;
        const _preloadDone = new Promise(res => { _resolvePreload = res; });

        async function _makeSeatedBlob(modelUrl, arScale) {
            const safeModelUrl = _safeAssetUrl(modelUrl) || modelUrl;
            const gltf = modelGLTFs[safeModelUrl];
            if (!gltf || !GLTFExporter) return null;
            const scale    = arScale || 1.0;
            const cacheKey = scale !== 1.0 ? `${safeModelUrl}::${scale}` : safeModelUrl;
            if (_iosSeatedBlobs[cacheKey]) return _iosSeatedBlobs[cacheKey];
            // Clone, apply ar_scale, seat so bottom sits at y=0
            const root = gltf.scene.clone(true);
            root.traverse(n => { if (n.isMesh && n.material) n.material = n.material.clone(); });
            if (scale !== 1.0) root.scale.setScalar(scale);
            root.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(root);
            if (isFinite(box.min.y) && box.min.y < -0.001) {
                root.position.y = -box.min.y;
                root.updateMatrixWorld(true);
            }
            return new Promise(resolve => {
                try {
                    new GLTFExporter().parse(
                        root,
                        glb => {
                            const url = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
                            _iosSeatedBlobs[cacheKey] = url;
                            resolve(url);
                        },
                        err => { console.warn('iOS seat export:', err); resolve(null); },
                        { binary: true }
                    );
                } catch (e) { console.warn('iOS seat export:', e); resolve(null); }
            });
        }

        // ── One-time init — deferred until first AR tap ───────────────
        async function _setup() {
            if (_setupDone) return;
            _setupDone = true;

            await _ensureLoader();

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            renderer.xr.setReferenceSpaceType('local');
            xrCanvas = renderer.domElement;
            Object.assign(xrCanvas.style, {
                position: 'fixed', top: '0', left: '0',
                zIndex: '50', display: 'none'
            });
            document.body.appendChild(xrCanvas);

            scene  = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
            scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(0.5, 1, 0.25);
            scene.add(dirLight);

            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.04, 0.07, 32),
                new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
            );
            reticle.rotation.x       = -Math.PI / 2;
            reticle.matrixAutoUpdate = false;
            reticle.visible          = false;
            scene.add(reticle);

            carouselRoot = new THREE.Group();
            scene.add(carouselRoot);
            carouselRoot.visible = false;
            slotGroups = Array.from({ length: 4 }, () => {
                const g = new THREE.Group(); carouselRoot.add(g); return g;
            });
            createLabelMesh();

            gestureLayer = document.getElementById('xr-gesture-layer');
            xrOverlay    = document.getElementById('xr-overlay');

            // Touch gestures on the gesture layer inside dom-overlay.
            // Canvas touch events are consumed by the XR runtime during a session;
            // dom-overlay elements receive normal HTML touch events instead.
            gestureLayer.addEventListener('touchstart', e => {
                _rotVelocity = 0;
                for (const t of e.changedTouches)
                    activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY, prevX: t.clientX, prevY: t.clientY });
                if (activeTouches.size === 1) {
                    const t = e.changedTouches[0];
                    _lastTouchStart = { x: t.clientX, y: t.clientY };
                } else {
                    _lastTouchStart = null;
                }
                if (activeTouches.size >= 2) {
                    const [a, b] = [...activeTouches.values()];
                    _pinchDist0  = Math.hypot(a.x - b.x, a.y - b.y);
                    _pinchScale0 = carouselRoot.scale.x;
                }
            }, { passive: true });

            gestureLayer.addEventListener('touchmove', e => {
                e.preventDefault();
                for (const t of e.changedTouches) {
                    const p = activeTouches.get(t.identifier);
                    if (p) activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY, prevX: p.x, prevY: p.y });
                }
                const all = [...activeTouches.values()];
                if (all.length === 1) {
                    let dx = all[0].x - all[0].prevX;
                    if (Math.abs(dx) < DEAD_ZONE) return;
                    dx = Math.max(-MAX_DELTA, Math.min(MAX_DELTA, dx));
                    _rotVelocity = dx * ROTATE_SCALE;
                    slotGroups[slotOf.center].rotation.y += _rotVelocity;
                } else if (all.length >= 2 && _pinchDist0) {
                    const [a, b] = all;
                    const dist = Math.hypot(a.x - b.x, a.y - b.y);
                    const s = Math.max(SCALE_MIN, Math.min(SCALE_MAX, _pinchScale0 * (dist / _pinchDist0)));
                    carouselRoot.scale.setScalar(s);
                    _showScaleGauge();
                }
            }, { passive: false });

            gestureLayer.addEventListener('touchend', e => {
                for (const t of e.changedTouches) {
                    if (_xrUIHidden && placed && _lastTouchStart && activeTouches.size === 1) {
                        const dx = t.clientX - _lastTouchStart.x;
                        const dy = t.clientY - _lastTouchStart.y;
                        if (Math.hypot(dx, dy) < 10) _applyUIHidden(false);
                    }
                    activeTouches.delete(t.identifier);
                }
                if (activeTouches.size < 2) {
                    _pinchDist0 = null; _pinchScale0 = null;
                    _lastTouchStart = null;
                    _hideScaleGauge(1200);
                }
            }, { passive: true });

            renderer.xr.addEventListener('sessionstart', async () => {
                _reticleWasVisible = false;
                _updateScanHint(false);
                const _hBtnStart = document.getElementById('xr-hide-ui');
                if (_hBtnStart) _hBtnStart.textContent = UI[window.__lang || 'en'].hideUI;
                try {
                    const session     = renderer.xr.getSession();
                    const viewerSpace = await session.requestReferenceSpace('viewer');
                    hitTestSource     = await session.requestHitTestSource({ space: viewerSpace });
                } catch (e) { console.error('Hit-test setup failed:', e); }
            });

            renderer.xr.addEventListener('sessionend', () => {
                hitTestSource = null; placed = false; _reticleWasVisible = false;
                xrSession = null; xrStarting = false;
                carouselRoot.visible = false; reticle.visible = false;
                if (labelMesh) labelMesh.visible = false;
                xrCanvas.style.display       = 'none';
                xrOverlay.style.display      = 'none';
                gestureLayer.style.display   = 'none';
                document.getElementById('xr-place-hint').style.display     = 'block';
                document.getElementById('xr-nav-row').style.display         = 'none';
                document.getElementById('xr-move-hint').style.display       = 'none';
                document.getElementById('xr-carousel-toggle').style.display = 'none';
                document.getElementById('xr-label-toggle').style.display    = 'none';
                _xrUIHidden = false;
                _lastTouchStart = null;
                const _hBtnS = document.getElementById('xr-hide-ui');
                _hBtnS.classList.remove('ui-hidden');
                activeTouches.clear();
                _rotVelocity = 0;
                _xrAddedKeys.clear();
                _pinchDist0 = null; _pinchScale0 = null;
                if (_scaleHideTimer) { clearTimeout(_scaleHideTimer); _scaleHideTimer = null; }
                document.getElementById('xr-scale-gauge').style.display = 'none';
                carouselRoot.scale.setScalar(1);
                slotOf = { left: 0, center: 1, right: 2, hidden: 3 };
                hiddenSide = 'farRight'; isAnimating = false;
                initSlots();
                document.dispatchEvent(new CustomEvent('xr-session-end'));
            });

            renderer.setAnimationLoop((time, frame) => {
                if (frame && !placed && hitTestSource) {
                    const refSpace = renderer.xr.getReferenceSpace();
                    if (refSpace) {
                        const results = frame.getHitTestResults(hitTestSource);
                        if (results.length > 0) {
                            const pose = results[0].getPose(refSpace);
                            if (pose) { reticle.visible = true; reticle.matrix.fromArray(pose.transform.matrix); }
                        } else { reticle.visible = false; }
                    }
                }
                const _rvNow = !placed && reticle.visible;
                if (_rvNow !== _reticleWasVisible) { _reticleWasVisible = _rvNow; _updateScanHint(_rvNow); }
