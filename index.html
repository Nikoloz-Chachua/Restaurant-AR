<!DOCTYPE html>
<html lang="ka" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Lions — AR Menu</title>
    <meta name="description" content="Burger Lions restaurant menu. View dishes in Augmented Reality before you order.">
    <meta property="og:title" content="Burger Lions — AR Menu">
    <meta property="og:description" content="Browse our menu and place dishes on your table in Augmented Reality.">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Georgian:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        :root {
            --t: 0.24s ease;
            --radius-xl: 28px;
            --radius-pill: 999px;
            --leaf-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
            --font-ui: 'Manrope', 'Noto Sans Georgian', system-ui, sans-serif;
            --font-display: 'Bebas Neue', 'Manrope', sans-serif;
        }

        [data-theme="night"] {
            --bg:          #050604;
            --card:        rgba(18, 15, 10, 0.92);
            --card2:       rgba(42, 32, 18, 0.96);
            --border:      rgba(235, 162, 45, 0.24);
            --text:        #fff1d0;
            --dim:         #c8ad78;
            --accent:      #f0b833;
            --accent-text: #120d05;
            --leaf:        #102717;
            --leaf2:       #1e4a27;
            --rose:        #b94a37;
            --wood:        #7a3f1f;
            --glow:        rgba(240, 150, 38, 0.30);
            --thumb-bg:    #0b0906;
            --modal-bg:    #050604;
        }

        [data-theme="day"] {
            --bg:          #f3ead7;
            --card:        rgba(255, 248, 232, 0.90);
            --card2:       rgba(236, 219, 184, 0.96);
            --border:      rgba(198, 129, 12, 0.26);
            --text:        #3b2914;
            --dim:         #7b684c;
            --accent:      #c97905;
            --accent-text: #fff8e8;
            --leaf:        #496c34;
            --leaf2:       #7f9a4b;
            --rose:        #b65a34;
            --wood:        #9b612a;
            --glow:        rgba(218, 139, 16, 0.18);
            --thumb-bg:    #ddd0b2;
            --modal-bg:    #f3ead7;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        button { touch-action: manipulation; }

        body {
            background:
                radial-gradient(circle at 16% 6%, var(--glow), transparent 18rem),
                radial-gradient(circle at 88% 10%, rgba(32, 85, 41, 0.16), transparent 22rem),
                radial-gradient(circle at 68% 88%, rgba(140, 66, 28, 0.16), transparent 24rem),
                radial-gradient(ellipse at 50% 0%, rgba(255, 185, 70, 0.08), transparent 30rem),
                linear-gradient(145deg, var(--bg), #020302 72%, color-mix(in srgb, var(--leaf) 45%, #020302 55%));
            color: var(--text);
            font-family: var(--font-ui);
            min-height: 100vh;
            padding: 0 16px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background var(--t), color var(--t);
            overflow-x: hidden;
            position: relative;
        }


        [data-theme="day"] body {
            background:
                radial-gradient(circle at 14% 8%, rgba(207, 126, 13, 0.16), transparent 20rem),
                radial-gradient(circle at 88% 8%, rgba(96, 128, 61, 0.16), transparent 24rem),
                radial-gradient(circle at 22% 78%, rgba(95, 125, 58, 0.10), transparent 28rem),
                radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.34), transparent 30rem),
                linear-gradient(145deg, #f3ead7, #efe2c6 58%, #e6d7b5);
        }

        body::before, body::after {
            content: none;
            display: none;
        }
        body::before {
            width: 260px;
            height: 360px;
            top: 40px;
            left: -130px;
            background:
                radial-gradient(ellipse at 48% 16%, var(--leaf) 0 20%, transparent 21%),
                radial-gradient(ellipse at 62% 34%, var(--leaf2) 0 18%, transparent 19%),
                radial-gradient(ellipse at 42% 55%, var(--leaf) 0 19%, transparent 20%),
                radial-gradient(ellipse at 58% 75%, var(--leaf2) 0 16%, transparent 17%);
            transform: rotate(-24deg);
            border-left: 2px solid color-mix(in srgb, var(--leaf2) 65%, transparent);
        }
        body::after {
            width: 240px;
            height: 420px;
            right: -145px;
            top: 180px;
            background:
                radial-gradient(ellipse at 44% 18%, color-mix(in srgb, var(--leaf) 80%, #000 20%) 0 20%, transparent 21%),
                radial-gradient(ellipse at 60% 38%, var(--leaf2) 0 18%, transparent 19%),
                radial-gradient(ellipse at 40% 61%, var(--leaf) 0 19%, transparent 20%),
                radial-gradient(ellipse at 55% 82%, var(--leaf2) 0 16%, transparent 17%);
            transform: rotate(20deg);
            border-right: 2px solid color-mix(in srgb, var(--leaf2) 58%, transparent);
        }

        .header {
            width: 100%;
            max-width: 450px;
            text-align: center;
            padding: 76px 0 28px;
            position: relative;
            z-index: 1;
        }
        .header::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 44px;
            width: 42px;
            height: 10px;
            transform: translateX(-50%);
            border-radius: 999px 0 999px 0;
            background: linear-gradient(90deg, var(--leaf), var(--accent));
            box-shadow: 0 0 22px var(--glow);
            opacity: 0.85;
        }

        .header h1 {
            font-family: var(--font-display);
            font-size: clamp(3rem, 11vw, 4.6rem);
            letter-spacing: 5px;
            color: var(--accent);
            line-height: 0.94;
            text-shadow: 0 0 24px var(--glow);
            transition: color var(--t), text-shadow var(--t);
        }

        html[lang="en"] .restaurant-name {
            font-family: 'Manrope', var(--font-ui) !important;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        html[lang="en"] .item-name,
        html[lang="en"] .category-header,
        html[lang="en"] #modal-title,
        html[lang="en"] #basket-title,
        html[lang="en"] .basket-item-name {
            font-family: 'Manrope', var(--font-ui) !important;
            font-weight: 800;
            letter-spacing: 0.035em;
            line-height: 1.2;
        }

        html[lang="en"] .ingredients {
            font-family: 'Manrope', var(--font-ui) !important;
            font-size: 0.78rem;
            line-height: 1.58;
            letter-spacing: 0.01em;
        }

        html[lang="en"] .cat-pill,
        html[lang="en"] .ar-btn {
            font-family: 'Manrope', var(--font-ui) !important;
            letter-spacing: 0.035em;
        }

        html[lang="ka"] .item-name,
        html[lang="ka"] .category-header,
        html[lang="ka"] #modal-title,
        html[lang="ka"] #basket-title {
            font-family: 'Noto Sans Georgian', var(--font-ui) !important;
            font-weight: 800;
            letter-spacing: 0.08em;
            line-height: 1.22;
        }

        html[lang="ka"] .ingredients,
        html[lang="ka"] .cat-pill,
        html[lang="ka"] .ar-btn {
            font-family: 'Noto Sans Georgian', var(--font-ui) !important;
            letter-spacing: 0.02em;
        }

        .tagline {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.68rem;
            letter-spacing: 3.4px;
            text-transform: uppercase;
            color: var(--dim);
            margin-top: 12px;
            font-weight: 900;
            transition: color var(--t);
        }
        .tagline::before, .tagline::after {
            content: '';
            width: 28px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent));
            opacity: 0.7;
        }
        .tagline::after { background: linear-gradient(90deg, var(--accent), transparent); }

        #theme-toggle, #lang-toggle {
            position: fixed;
            top: 14px;
            z-index: 1000;
            background: color-mix(in srgb, var(--card) 86%, transparent);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 9px 16px;
            cursor: pointer;
            color: var(--text);
            font-family: var(--font-ui);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.16);
            transition: background var(--t), color var(--t), border-color var(--t), transform var(--t);
        }
        #theme-toggle { right: 14px; }
        #lang-toggle  { left: 14px; }
        #theme-toggle:active, #lang-toggle:active { opacity: 0.65; transform: scale(0.97); }

        .menu-list {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .menu-item {
            background:
                radial-gradient(circle at 50% 0%, rgba(255, 184, 62, 0.08), transparent 42%),
                linear-gradient(155deg, color-mix(in srgb, var(--card) 94%, transparent), color-mix(in srgb, var(--card2) 84%, transparent)),
                radial-gradient(circle at 92% 10%, color-mix(in srgb, var(--leaf2) 18%, transparent), transparent 34%);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            display: grid;
            grid-template-columns: 128px minmax(0, 1fr);
            grid-template-areas: "left right";
            padding: 12px;
            column-gap: 14px;
            row-gap: 0;
            transition: background var(--t), border-color var(--t), transform var(--t), box-shadow var(--t);
            contain: content;
            touch-action: manipulation;
            overflow: hidden;
            position: relative;
            box-shadow: var(--leaf-shadow);
            backdrop-filter: blur(18px);
        }
        .menu-item::before {
            content: '';
            position: absolute;
            width: 110px;
            height: 110px;
            right: -48px;
            top: -42px;
            border-radius: 70% 0 70% 0;
            background: linear-gradient(135deg, color-mix(in srgb, var(--leaf) 42%, transparent), transparent 72%);
            transform: rotate(26deg);
            opacity: 0.75;
            pointer-events: none;
        }
        .menu-item:active { opacity: 0.82; transform: scale(0.99); transition: opacity 0.08s, transform 0.08s; }

        .thumb-wrap {
            position: relative;
            width: 118px;
            height: 100%;
            min-height: 118px;
            border-radius: 20px;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 44%, rgba(255, 196, 90, 0.16), transparent 36%),
                radial-gradient(circle at 82% 18%, color-mix(in srgb, var(--leaf2) 18%, transparent), transparent 42%),
                linear-gradient(145deg, #090806, color-mix(in srgb, var(--thumb-bg) 76%, var(--wood) 24%));
            border: 1px solid color-mix(in srgb, var(--border) 72%, transparent);
            box-shadow: inset 0 0 48px rgba(0,0,0,0.52), 0 18px 42px rgba(0,0,0,0.28);
            transition: background var(--t), border-color var(--t);
        }
        .thumb-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse at center, transparent 34%, color-mix(in srgb, var(--card) 82%, transparent) 100%),
                linear-gradient(135deg, transparent 0 70%, rgba(240,184,51,0.10));
            opacity: 0.72;
        }

        [data-theme="day"] .menu-item {
            background:
                radial-gradient(circle at 50% 0%, rgba(210, 132, 8, 0.08), transparent 42%),
                linear-gradient(180deg, rgba(255, 248, 232, 0.92), rgba(238, 222, 188, 0.94));
            border-color: rgba(198, 129, 12, 0.24);
            box-shadow: 0 20px 46px rgba(91, 58, 16, 0.14);
        }
        [data-theme="day"] .thumb-wrap {
            background:
                radial-gradient(circle at 50% 44%, rgba(255,255,255,0.24), transparent 34%),
                radial-gradient(circle at 82% 18%, rgba(86, 122, 55, 0.14), transparent 42%),
                linear-gradient(145deg, #d8ceb3, #cabc9b);
            border-color: rgba(198, 129, 12, 0.22);
            box-shadow: inset 0 0 52px rgba(89, 68, 28, 0.16);
        }
        [data-theme="day"] .thumb-vignette {
            background:
                radial-gradient(ellipse at center, transparent 38%, rgba(235, 221, 190, 0.72) 100%),
                linear-gradient(135deg, transparent 0 72%, rgba(126, 154, 75, 0.10));
            opacity: 0.58;
        }
        .thumb-wrap model-viewer {
            width: 100%;
            height: 100%;
            min-height: 108px;
            background: transparent;
            display: block;
            touch-action: pan-y;
        }
        .thumb-wrap .thumb-img {
            width: 100%;
            height: 100%;
            min-height: 108px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }

        .item-left {
            grid-area: left;
        }

        .item-right {
            grid-area: right;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            user-select: none;
        }

        .item-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            flex-shrink: 0;
            min-height: 34px;
        }

        .item-name {
            grid-area: auto;
            font-family: var(--font-display);
            font-size: 1.16rem;
            letter-spacing: 1.4px;
            color: var(--accent);
            line-height: 1.18;
            margin-bottom: 7px;
            text-shadow: 0 0 18px var(--glow);
            transition: color var(--t);
            overflow-wrap: break-word;
            word-break: break-word;
            position: relative;
            z-index: 1;
        }

        .ar-btn {
            background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--leaf2) 70%, var(--accent) 30%));
            color: var(--accent-text);
            border: none;
            border-radius: 14px;
            padding: 9px 12px;
            font-size: 0.66rem;
            font-weight: 800;
            font-family: var(--font-ui);
            letter-spacing: 0.8px;
            cursor: pointer;
            white-space: nowrap;
            text-transform: uppercase;
            display: block;
            width: 100%;
            margin-top: 6px;
            box-shadow: 0 12px 30px color-mix(in srgb, var(--accent) 26%, transparent);
            transition: background var(--t), opacity 0.15s, transform var(--t);
        }
        .ar-btn:active { opacity: 0.7; transition: opacity 0.08s; }
        .ar-btn:disabled { opacity: 0.45; cursor: wait; }

        .ingredients {
            flex: 1;
            font-size: 0.72rem;
            color: var(--dim);
            line-height: 1.45;
            transition: color var(--t);
            overflow-wrap: break-word;
        }

        .price {
            font-family: var(--font-display);
            font-size: 1.24rem;
            letter-spacing: 1.4px;
            color: var(--accent);
            transition: color var(--t);
        }

        .category-header {
            font-family: var(--font-display);
            font-size: 1.55rem;
            letter-spacing: 5px;
            color: var(--accent);
            padding: 26px 4px 10px;
            border-bottom: 1px solid var(--border);
            width: 100%;
            max-width: 450px;
            transition: color var(--t), border-color var(--t);
            position: relative;
            z-index: 1;
            text-shadow: 0 0 18px var(--glow);
        }
        .category-header::before {
            content: '';
            display: inline-block;
            width: 13px;
            height: 8px;
            margin-right: 12px;
            border-radius: 999px 0 999px 0;
            background: linear-gradient(135deg, var(--leaf2), var(--leaf));
            transform: rotate(-18deg) translateY(-2px);
            box-shadow: 0 0 12px color-mix(in srgb, var(--leaf2) 40%, transparent);
        }


        /* ── Authentic jungle background details ── */
        .safari-scene {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .jungle-cover {
            position: absolute;
            display: block;
            object-fit: cover;
            user-select: none;
            pointer-events: none;
        }
        .jungle-cover.canopy {
            left: 0;
            top: 0;
            width: 100vw;
            height: min(34vh, 360px);
            object-position: 0 0;
            opacity: 0.055;
            mix-blend-mode: screen;
            filter: saturate(0.65) contrast(1.02) brightness(0.74) sepia(0.12);
            -webkit-mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,0.78) 44%, transparent 100%);
            mask-image: linear-gradient(180deg, #000 0%, rgba(0,0,0,0.78) 44%, transparent 100%);
        }
        .jungle-cover.side-left {
            left: -170px;
            top: 18vh;
            width: clamp(300px, 31vw, 520px);
            opacity: 0.05;
            transform: rotate(-9deg);
            mix-blend-mode: screen;
            filter: saturate(0.62) contrast(1.02) brightness(0.58);
            -webkit-mask-image: radial-gradient(ellipse at 46% 52%, #000 0 48%, transparent 72%);
            mask-image: radial-gradient(ellipse at 46% 52%, #000 0 48%, transparent 72%);
        }
        .jungle-cover.side-right {
            right: -180px;
            top: 32vh;
            width: clamp(310px, 34vw, 560px);
            opacity: 0.045;
            transform: scaleX(-1) rotate(8deg);
            mix-blend-mode: screen;
            filter: saturate(0.62) contrast(1.02) brightness(0.58);
            -webkit-mask-image: radial-gradient(ellipse at 48% 52%, #000 0 50%, transparent 74%);
            mask-image: radial-gradient(ellipse at 48% 52%, #000 0 50%, transparent 74%);
        }
        .jungle-cover.bottom-haze {
            left: 50%;
            bottom: -210px;
            width: min(760px, 78vw);
            opacity: 0.035;
            transform: translateX(-50%) rotate(3deg);
            mix-blend-mode: screen;
            filter: saturate(0.58) contrast(1.02) brightness(0.54);
            -webkit-mask-image: radial-gradient(ellipse at center, #000 0 40%, transparent 76%);
            mask-image: radial-gradient(ellipse at center, #000 0 40%, transparent 76%);
        }
        [data-theme="day"] .jungle-cover.canopy { opacity: 0.18; mix-blend-mode: multiply; filter: saturate(0.74) contrast(0.92) brightness(1.08) sepia(0.12); }
        [data-theme="day"] .jungle-cover.side-left,
        [data-theme="day"] .jungle-cover.side-right { opacity: 0.13; mix-blend-mode: multiply; filter: saturate(0.72) contrast(0.92) brightness(1.04); }
        [data-theme="day"] .jungle-cover.bottom-haze { opacity: 0.09; mix-blend-mode: multiply; filter: saturate(0.68) contrast(0.9) brightness(1.06); }

        .palm-frond {
            display: none;
            position: absolute;
            width: 330px;
            height: 330px;
            opacity: 0.23;
            filter: blur(0.2px) saturate(1.06);
            background:
                linear-gradient(90deg, transparent 48%, color-mix(in srgb, var(--leaf2) 72%, transparent) 49% 51%, transparent 52%),
                radial-gradient(ellipse at 50% 10%, color-mix(in srgb, var(--leaf) 82%, transparent) 0 7%, transparent 8%),
                radial-gradient(ellipse at 34% 18%, color-mix(in srgb, var(--leaf2) 76%, transparent) 0 8%, transparent 9%),
                radial-gradient(ellipse at 66% 18%, color-mix(in srgb, var(--leaf2) 76%, transparent) 0 8%, transparent 9%),
                radial-gradient(ellipse at 24% 34%, color-mix(in srgb, var(--leaf) 78%, transparent) 0 9%, transparent 10%),
                radial-gradient(ellipse at 76% 34%, color-mix(in srgb, var(--leaf) 78%, transparent) 0 9%, transparent 10%),
                radial-gradient(ellipse at 17% 52%, color-mix(in srgb, var(--leaf2) 70%, transparent) 0 9%, transparent 10%),
                radial-gradient(ellipse at 83% 52%, color-mix(in srgb, var(--leaf2) 70%, transparent) 0 9%, transparent 10%);
            transform-origin: 50% 0;
        }
        .palm-frond.left  { left: -120px; top: 150px; transform: rotate(124deg) scale(1.12); }
        .palm-frond.right { right: -115px; top: 58px; transform: rotate(-124deg) scale(1.05); opacity: 0.18; }
        .palm-frond.low   { left: 8vw; bottom: -168px; transform: rotate(18deg) scale(1.25); opacity: 0.12; }

        .lion-bg {
            position: absolute;
            right: max(10px, calc((100vw - 1160px) / 2 - 28px));
            bottom: 42px;
            width: clamp(170px, 20vw, 320px);
            aspect-ratio: 76 / 57.3;
            background: linear-gradient(135deg, rgba(215,255,99,0.14), rgba(0,0,0,0.88));
            -webkit-mask: url('./assets/lion-silhouette.svg') center / contain no-repeat;
            mask: url('./assets/lion-silhouette.svg') center / contain no-repeat;
            opacity: 0.22;
            mix-blend-mode: screen;
            filter: drop-shadow(0 0 34px rgba(255, 202, 72, 0.14));
        }
        [data-theme="day"] .lion-bg {
            opacity: 0.18;
            mix-blend-mode: multiply;
            background: linear-gradient(135deg, rgba(30,45,18,0.22), rgba(0,0,0,0.72));
        }
        .ground-rocks {
            position: absolute;
            left: 50%;
            bottom: -38px;
            width: min(680px, 92vw);
            height: 92px;
            transform: translateX(-50%);
            opacity: 0.16;
            background:
                radial-gradient(ellipse at 12% 72%, #17110b 0 11%, transparent 12%),
                radial-gradient(ellipse at 28% 58%, #21170e 0 16%, transparent 17%),
                radial-gradient(ellipse at 48% 68%, #130f0a 0 13%, transparent 14%),
                radial-gradient(ellipse at 66% 56%, #24180d 0 18%, transparent 19%),
                radial-gradient(ellipse at 84% 70%, #16100a 0 13%, transparent 14%);
            filter: blur(0.2px);
        }

        /* ── Modal ── */
        #modal {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 46%, rgba(240, 184, 51, 0.18), transparent 28rem),
                radial-gradient(ellipse at 50% 64%, rgba(94, 54, 18, 0.18), transparent 34rem),
                radial-gradient(circle at 82% 18%, rgba(30, 74, 39, 0.10), transparent 28rem),
                linear-gradient(145deg, color-mix(in srgb, var(--modal-bg) 92%, #16110a 8%), #020302 78%);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s, background var(--t);
        }
        #modal.active { opacity: 1; }

        #modal-title {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 6vw, 2.6rem);
            letter-spacing: 4px;
            color: var(--accent);
            text-align: center;
            width: 100%;
            padding: 0 24px;
            margin-top: 56px;
            line-height: 1.2;
            transition: color var(--t);
        }

        #modal-qty-wrap {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
        #modal-price {
            font-family: var(--font-display);
            font-size: clamp(1.4rem, 5vw, 2rem);
            letter-spacing: 3px;
            color: var(--accent);
            text-align: center;
            margin-top: 6px;
            transition: color var(--t);
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: var(--card2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 0.85rem;
            font-family: var(--font-ui);
            font-weight: 700;
            transition: background var(--t), color var(--t);
        }

        #modal-viewer {
            width: 95vw;
            height: 68vh;
            background: transparent;
            margin-top: 8px;
        }

        .tip {
            margin-top: 4px;
            color: var(--dim);
            font-size: 0.82rem;
            letter-spacing: 1px;
            transition: color var(--t);
        }

        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.5);
            color: var(--text);
            font-size: 1.4rem;
            line-height: 1;
            padding: 0;
            cursor: pointer;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-arrow:active { opacity: 0.65; }
        .left-arrow  { left: 10px; }
        .right-arrow { right: 10px; }

        /* ── WebXR overlay ── */
        #xr-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 51;
            pointer-events: none;
        }
        #xr-gesture-layer {
            display: none;
            position: absolute;
            inset: 0;
            pointer-events: all;
        }
        #xr-place-hint {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-family: var(--font-ui);
    font-size: 14px;
    background: rgba(0,0,0,0.65);
    padding: 10px 20px;
    border-radius: 20px;
    white-space: normal;
    text-align: center;
    width: 80%;
    max-width: 320px;
}
        #xr-nav-row {
            display: none;
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: all;
            align-items: center;
            gap: 16px;
            background: rgba(0,0,0,0.65);
            padding: 8px 20px;
            border-radius: 30px;
        }
        #xr-nav-row button {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.35);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            pointer-events: all;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #xr-move-hint {
            display: none;
            position: absolute;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-family: var(--font-ui);
            font-size: 12px;
            white-space: normal;
            text-align: center;
            max-width: 80%;
        }
        #xr-exit, #xr-carousel-toggle, #xr-label-toggle, #xr-place-again, #xr-hide-ui {
            pointer-events: all;
            position: absolute;
            background: rgba(0,0,0,0.65);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: var(--font-ui);
            font-size: 13px;
            cursor: pointer;
        }
        #xr-exit             { top: 18px; right: 18px; }
        #xr-place-again      { top: 62px; right: 18px; display: none; }
        #xr-carousel-toggle  { top: 18px; left: 18px; display: none; }
        #xr-label-toggle     { top: 58px; left: 18px; display: none; }
        #xr-hide-ui          { bottom: 18px; left: 18px; display: none; transition: opacity 0.25s; }
        #xr-hide-ui.ui-hidden { opacity: 0.35; }
        #xr-add-btn {
            display: none;
            pointer-events: all;
            position: absolute;
            bottom: 55px;
            right: 18px;
            background: rgba(0,0,0,0.45);
            color: rgba(255,255,255,0.55);
            border: 1.5px solid rgba(255,255,255,0.25);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        #xr-add-btn.visible   { display: flex; }
        #xr-add-btn.in-basket { background: rgba(240,192,64,0.92); color: #0d0d0d; border-color: transparent; }
        #xr-hint-step {
            font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
            color: rgba(255,255,255,.5); margin-bottom: 3px;
        }
        #xr-hint-main { font-size: 14px; color: #fff; }
        #xr-scale-gauge {
            display: none;
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.65);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 8px 16px;
            pointer-events: none;
            min-width: 130px;
            text-align: center;
        }
        #xr-scale-track {
            height: 4px;
            background: rgba(255,255,255,0.18);
            border-radius: 2px;
            position: relative;
            margin-bottom: 5px;
        }
        #xr-scale-fill {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            background: #f0c040;
            border-radius: 2px;
        }
        #xr-scale-mark {
            position: absolute;
            top: -3px;
            width: 2px;
            height: 10px;
            background: rgba(255,255,255,0.55);
            border-radius: 1px;
            left: calc(53.7% - 1px);
        }
        #xr-scale-pct {
            font-family: var(--font-ui);
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        /* ── Category filter bar ── */
        .cat-filter {
            width: 100%;
            max-width: 450px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 8px;
            position: sticky;
            top: 8px;
            z-index: 50;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .cat-filter::-webkit-scrollbar { display: none; }

        .cat-pill {
            background: color-mix(in srgb, var(--card) 88%, transparent);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 9px 15px;
            backdrop-filter: blur(14px);
            font-family: var(--font-ui);
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--dim);
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: background var(--t), border-color var(--t), color var(--t);
            touch-action: manipulation;
        }
        .cat-pill:active { opacity: 0.7; transition: opacity 0.08s; }
        .cat-pill.active {
            background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--leaf2) 70%, var(--accent) 30%));
            color: var(--accent-text);
            border-color: transparent;
            box-shadow: 0 12px 28px color-mix(in srgb, var(--accent) 24%, transparent);
        }

        .cat-section { display: contents; }

        /* ── Quantity stepper (add-to-basket control) ── */
        .qty-ctrl { flex-shrink: 0; }

        .qty-add-btn {
            background: transparent;
            color: var(--accent);
            border: 1.5px solid var(--accent);
            border-radius: 9px;
            width: 34px;
            height: 34px;
            padding: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background var(--t), color var(--t), border-color var(--t), opacity 0.15s;
            touch-action: manipulation;
        }
        .qty-add-btn:active { opacity: 0.7; transition: opacity 0.08s; }

        .qty-stepper {
            display: none;
            align-items: stretch;
            border: 1.5px solid var(--accent);
            border-radius: 9px;
            overflow: hidden;
            height: 34px;
            box-sizing: border-box;
            transition: border-color var(--t);
        }
        .qty-stepper.visible { display: flex; }

        .qty-dec, .qty-inc {
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: 1rem;
            font-weight: 700;
            padding: 0 10px;
            cursor: pointer;
            line-height: 1;
            display: flex;
            align-items: center;
            touch-action: manipulation;
            transition: background var(--t), color var(--t);
            user-select: none;
        }
        .qty-dec { border-right: 1px solid var(--accent); }
        .qty-inc { border-left:  1px solid var(--accent); }
        .qty-dec:active, .qty-inc:active {
            background: var(--accent);
            color: var(--accent-text);
            transition: none;
        }

        .qty-num {
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 1px;
            color: var(--accent);
            min-width: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 2px;
            user-select: none;
            transition: color var(--t);
        }

        /* ── Basket bar (fixed bottom) ── */
        #basket-bar {
            position: fixed;
            bottom: 14px; left: 14px; right: 14px;
            background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--leaf2) 70%, var(--accent) 30%));
            color: var(--accent-text);
            padding: 14px 18px;
            border-radius: 22px;
            box-shadow: 0 18px 50px rgba(0,0,0,0.32);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 5000;
            cursor: pointer;
            transform: translateY(calc(100% + 28px));
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.2s ease, background var(--t);
            touch-action: manipulation;
            font-family: var(--font-ui);
        }
        #basket-bar.visible { transform: translateY(0); opacity: 1; pointer-events: auto; }
        body.basket-bar-visible { padding-bottom: 98px; }
        #basket-bar-count { font-size: 0.82rem; font-weight: 700; }
        #basket-bar-delete {
            background: transparent;
            border: 1.5px solid var(--accent-text);
            border-radius: 8px;
            padding: 6px 10px;
            cursor: pointer;
            color: var(--accent-text);
            display: flex;
            align-items: center;
            opacity: 0.75;
            touch-action: manipulation;
            transition: opacity 0.15s;
            flex-shrink: 0;
        }
        #basket-bar-delete:active { opacity: 1; transition: none; }
        #basket-bar-total {
            font-family: var(--font-display);
            font-size: 1.4rem;
            letter-spacing: 2px;
        }

        /* ── Basket panel ── */
        #basket-panel {
            position: fixed;
            inset: 0;
            z-index: 9000;
            display: none;
            flex-direction: column;
            background: var(--bg);
            opacity: 0;
            transition: opacity 0.22s ease, background var(--t);
        }
        #basket-panel.active { opacity: 1; }

        .basket-header {
            display: flex;
            align-items: center;
            padding: 20px 20px 14px;
            border-bottom: 1px solid var(--border);
            gap: 10px;
            transition: border-color var(--t);
        }
        #basket-title {
            font-family: var(--font-display);
            font-size: 1.8rem;
            letter-spacing: 4px;
            color: var(--accent);
            flex: 1;
            transition: color var(--t);
        }
        #basket-clear {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 12px;
            font-family: var(--font-ui);
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--dim);
            cursor: pointer;
            touch-action: manipulation;
            transition: border-color var(--t), color var(--t);
        }
        #basket-close {
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 14px;
            font-family: var(--font-ui);
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            touch-action: manipulation;
            transition: background var(--t), color var(--t), border-color var(--t);
        }
        #basket-items {
            flex: 1;
            overflow-y: auto;
            padding: 8px 20px;
        }
        .basket-empty {
            color: var(--dim);
            text-align: center;
            padding: 48px 0;
            font-size: 0.9rem;
            transition: color var(--t);
        }
        .basket-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 0;
            border-bottom: 1px solid var(--border);
            transition: border-color var(--t);
        }
        .basket-item-name {
            flex: 1;
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 1px;
            color: var(--accent);
            transition: color var(--t);
        }
        .basket-qty {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card2);
            border-radius: 8px;
            padding: 3px 8px;
            transition: background var(--t);
        }
        .qty-btn {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1.1rem;
            width: 26px;
            height: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            transition: color var(--t);
        }
        .qty-count {
            font-weight: 700;
            font-size: 0.88rem;
            min-width: 18px;
            text-align: center;
            color: var(--text);
            transition: color var(--t);
        }
        .basket-item-price {
            font-family: var(--font-display);
            font-size: 1rem;
            letter-spacing: 1px;
            color: var(--text);
            min-width: 56px;
            text-align: right;
            transition: color var(--t);
        }
.basket-footer {
            padding: 16px 20px;
            border-top: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color var(--t);
        }
        #basket-total-label {
            font-family: var(--font-display);
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: var(--dim);
            transition: color var(--t);
        }
        #basket-total {
            font-family: var(--font-display);
            font-size: 2rem;
            letter-spacing: 3px;
            color: var(--accent);
            transition: color var(--t);
        }

        @media (max-width: 720px) {
            body { padding: 0 12px 44px; }
            .header { padding: 62px 0 20px; }
            .header h1 { font-size: clamp(2.55rem, 13vw, 3.8rem); letter-spacing: 3px; }
            .tagline { font-size: 0.58rem; letter-spacing: 2px; }
            #theme-toggle, #lang-toggle { top: 12px; padding: 9px 14px; }
            .cat-filter { max-width: 100%; gap: 8px; top: 8px; padding: 5px 0 10px; }
            .cat-pill { padding: 9px 14px; font-size: 0.72rem; }
            .category-header { font-size: clamp(1.28rem, 6.4vw, 1.78rem); letter-spacing: 0.09em; padding: 24px 4px 10px; }
            .menu-list { gap: 14px; }
            .menu-item { grid-template-columns: 132px minmax(0, 1fr); min-height: 174px; padding: 12px; column-gap: 14px; }
            .thumb-wrap { width: 132px; min-height: 132px; height: 100%; border-radius: 18px; align-self: stretch; }
            .thumb-wrap model-viewer, .thumb-wrap .thumb-img { min-height: 128px; }
            .item-right { justify-content: flex-start; }
            .item-name { font-size: 1.04rem; letter-spacing: 0.045em; margin-bottom: 8px; word-break: normal; overflow-wrap: anywhere; }
            .ingredients { font-size: 0.68rem; line-height: 1.42; max-height: 4.3em; overflow: hidden; }
            .item-actions { margin-top: auto; min-height: 34px; }
            .price { font-size: 1.16rem; }
            .ar-btn { padding: 10px 10px; font-size: 0.67rem; margin-top: 8px; }
            .jungle-cover.canopy { height: 230px; opacity: 0.16; }
            .jungle-cover.side-left { left: -210px; top: 14vh; opacity: 0.12; }
            .jungle-cover.side-right { right: -240px; top: 42vh; opacity: 0.11; }
            .jungle-cover.bottom-haze { width: 520px; bottom: -150px; opacity: 0.06; }
            .lion-bg { width: 190px; right: -64px; bottom: 18px; opacity: 0.12; }
            .palm-frond.right { opacity: 0.11; }
            .nav-arrow { width: 42px; height: 42px; }
            .left-arrow { left: 8px; }
            .right-arrow { right: 8px; }
        }

        /* ── Responsive: desktop grid layout ── */
        @media (min-width: 640px) {
            body { padding: 0 32px 64px; }

            .header, .cat-filter { max-width: 880px; }
            .cat-filter { justify-content: center; }

            .menu-list {
                max-width: 880px;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
                align-items: start;
            }

            .category-header {
                max-width: none;
                grid-column: 1 / -1;
                padding: 24px 2px 10px;
            }

            .menu-item {
                display: flex;
                flex-direction: column;
                padding: 0;
                overflow: hidden;
            }

            .item-left  { order: 1; width: 100%; }
            .item-right { order: 2; padding: 10px 14px 14px; }
            .item-name  { padding: 0; }

            .item-left .thumb-wrap {
                width: 100%;
                height: 220px;
                min-height: unset;
                border-radius: 16px 16px 0 0;
                border-bottom: none;
            }

        }

        @media (min-width: 1100px) {
            .header, .cat-filter { max-width: 1160px; }

            .menu-list {
                max-width: 1160px;
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }

            .item-left .thumb-wrap { height: 240px; }
        }

        /* ── Modal AR button ── */
        #modal-ar-btn {
            display: none;
            background: var(--accent);
            color: var(--accent-text);
            border: none;
            border-radius: 12px;
            padding: 14px 0;
            width: 80%;
            max-width: 320px;
            font-family: var(--font-ui);
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 14px;
            transition: background var(--t), opacity 0.15s;
            touch-action: manipulation;
        }
        #modal-ar-btn:active  { opacity: 0.7; transition: opacity 0.08s; }
        #modal-ar-btn:disabled { opacity: 0.45; cursor: wait; }

    </style>
</head>
<body>

                        background:radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,0.55) 100%);">

        </div>

            <button id="xr-next">&#10095;</button>
        </div>

        <button id="xr-place-again"></button>
        <button id="xr-carousel-toggle"></button>
        <button id="xr-label-toggle"></button>
        <button id="xr-hide-ui"></button>
        <div id="xr-scale-gauge">

                <div id="xr-scale-mark"></div>
            </div>
            <span id="xr-scale-pct">100%</span>
        </div>
        <button id="xr-add-btn" aria-label="Add to basket">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        </button>
    </div>


    <!-- Basket bar -->
    <div id="basket-bar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;margin-right:8px"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span id="basket-bar-count"></span>
        <span id="basket-bar-total"></span>
        <button id="basket-bar-delete" aria-label="Clear basket">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
    </div>

    <!-- Basket panel -->
    <div id="basket-panel">
        <div class="basket-header">
            <span id="basket-title">Basket</span>
            <button id="basket-clear">Clear</button>
            <button id="basket-close">Close</button>
        </div>
        <div id="basket-items"></div>
        <div class="basket-footer">
            <span id="basket-total-label">Total</span>
            <span id="basket-total">0 ₾</span>
        </div>
    </div>

    <!-- WebXR — Three.js loaded lazily on first AR tap, not on page load -->
    <script>
    (function () {
        let THREE, GLTFLoader, GLTFExporter;
        let renderer, scene, camera, reticle, xrCanvas;
        let carouselRoot, slotGroups = [];
        let gestureLayer, xrOverlay;
        let hitTestSource = null, xrSession = null, xrStarting = false;
        let placed = false, isAnimating = false, _ignoreNextSelect = false;
        let _reticleWasVisible = false;
        let _xrSingleItem = (localStorage.getItem('bl-xr-view') || 'single') === 'single';

        let MENU = [], N = 0;
        const mod = i => ((i % N) + N) % N;
        let currentCenterMenu = 0;
        let slotOf     = { left: 0, center: 1, right: 2, hidden: 3 };
        let menuOf     = [0, 0, 0, 0];
        let hiddenSide = 'farRight';
        const meshObjs   = [null, null, null, null];
        const modelGLTFs = {};
        let loader;
        let labelMesh = null, labelCanvas = null, labelCtx = null, labelTexture = null;
        let labelMode = localStorage.getItem('bl-xr-label') || 'float';

        const CFG = {
            farLeft:  { x: -0.35, z: -0.12, s: 0.85, opacity: 0    },
            left:     { x: -0.14, z: -0.08, s: 0.85, opacity: 0.65 },
            center:   { x:  0,    z:  0,    s: 1.0,  opacity: 1.0  },
            right:    { x:  0.14, z: -0.08, s: 0.85, opacity: 0.65 },
            farRight: { x:  0.35, z: -0.12, s: 0.85, opacity: 0    },
        };
        // Returns target opacity for a role based on current view mode
        const _roleOp = role => _xrSingleItem ? (role === 'center' ? 1.0 : 0) : CFG[role].opacity;

        const INIT_ROLES    = ['left', 'center', 'right', 'farRight'];
        const DUR           = 350;
        const ROTATE_SCALE  = 0.0125;
        const INERTIA_DAMP  = 0.88;
        let   _rotVelocity  = 0;
        const SCALE_MIN     = 0.2;
        const SCALE_MAX     = 4.0;
        const DEAD_ZONE     = 3;
        const MAX_DELTA     = 40;
        const activeTouches = new Map();
        let _pinchDist0 = null, _pinchScale0 = null, _scaleHideTimer = null;
        let _xrUIHidden = false;
        let _lastTouchStart = null;
        const _LOG_MIN = Math.log(SCALE_MIN), _LOG_MAX = Math.log(SCALE_MAX);
        function _showScaleGauge() {
            if (_xrUIHidden) return;
            const s = carouselRoot.scale.x;
            const fill = (Math.log(s) - _LOG_MIN) / (_LOG_MAX - _LOG_MIN) * 100;
            document.getElementById('xr-scale-fill').style.width = fill.toFixed(1) + '%';
            document.getElementById('xr-scale-pct').textContent  = Math.round(s * 100) + '%';
            document.getElementById('xr-scale-gauge').style.display = 'block';
            if (_scaleHideTimer) { clearTimeout(_scaleHideTimer); _scaleHideTimer = null; }
        }
        function _hideScaleGauge(delay) {
            if (_scaleHideTimer) clearTimeout(_scaleHideTimer);
            _scaleHideTimer = setTimeout(() => {
                document.getElementById('xr-scale-gauge').style.display = 'none';
                _scaleHideTimer = null;
            }, delay);
        }

        // ── AR label (museum card) ────────────────────────────────────
        function _rrPath(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y,     x + w, y + r,     r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x,     y + h, x,         y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x,     y,     x + r,     y,         r);
            ctx.closePath();
        }

        function _wrapText(ctx, text, x, y, maxW, lh, maxLines) {
            const words = text.split(' ');
            let line = '', count = 0;
            for (const word of words) {
                const test = line ? line + ' ' + word : word;
                if (ctx.measureText(test).width > maxW && line) {
                    ctx.fillText(line, x, y + count * lh);
                    if (++count >= maxLines) return;
                    line = word;
                } else { line = test; }
            }
            if (line) ctx.fillText(line, x, y + count * lh);
        }

        function drawLabel(item) {
            if (!labelCtx) return;
            const ctx = labelCtx;
            const W = labelCanvas.width, H = labelCanvas.height;
            const lang = window.__lang || 'en';
            const name = (lang === 'ka' && item.name_ka)        ? item.name_ka        : item.name;
            const desc = (lang === 'ka' && item.description_ka) ? item.description_ka : item.description;

            ctx.clearRect(0, 0, W, H);

            ctx.fillStyle = 'rgba(8, 8, 8, 0.92)';
            _rrPath(ctx, 6, 6, W - 12, H - 12, 20);
            ctx.fill();

            ctx.strokeStyle = 'rgba(240, 192, 64, 0.7)';
            ctx.lineWidth = 3;
            _rrPath(ctx, 6, 6, W - 12, H - 12, 20);
            ctx.stroke();

            ctx.fillStyle = '#f0c040';
            ctx.font = 'bold 44px Arial, sans-serif';
            ctx.fillText(name, 28, 52, W - 56);

            ctx.strokeStyle = 'rgba(240, 192, 64, 0.30)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(28, 66); ctx.lineTo(W - 28, 66); ctx.stroke();

            ctx.fillStyle = '#c0c0c0';
            ctx.font = '22px Arial, sans-serif';
            _wrapText(ctx, desc, 28, 88, W - 56, 28, 3);

            ctx.fillStyle = '#f0c040';
            ctx.font = 'bold 36px Arial, sans-serif';
            ctx.fillText(item.price, 28, H - 20);

            if (labelTexture) labelTexture.needsUpdate = true;
        }

        function createLabelMesh() {
            const W = 512, H = 210;
            labelCanvas = document.createElement('canvas');
            labelCanvas.width = W; labelCanvas.height = H;
            labelCtx = labelCanvas.getContext('2d');
            labelTexture = new THREE.CanvasTexture(labelCanvas);
            const mat = new THREE.MeshBasicMaterial({
                map: labelTexture, transparent: true, depthWrite: false, side: THREE.DoubleSide
            });
            const planeW = 0.15, planeH = planeW * H / W;
            labelMesh = new THREE.Mesh(new THREE.PlaneGeometry(planeW, planeH), mat);
            labelMesh.position.set(0, 0.13, 0.05);
            labelMesh.visible = false;
            carouselRoot.add(labelMesh);
        }

        function updateLabelTransform() {
            if (!labelMesh) return;
            if (labelMode === 'float') {
                labelMesh.position.set(0, 0.13, 0.05);
            }
            // surface rotation updated per-frame in render loop
            const btn = document.getElementById('xr-label-toggle');
            const u = UI[window.__lang || 'en'];
            if (btn) btn.textContent = labelMode === 'float' ? u.onTable : u.floating;
        }

        // ── Models ────────────────────────────────────────────────────
        function preloadModels() {
            const paths = [...new Set(MENU.map(m => m.model).filter(Boolean))];
            return Promise.allSettled(paths.map(p => {
                if (modelGLTFs[p]) return Promise.resolve();
                if (_modelLoadPromises[p]) return _modelLoadPromises[p];
                _modelLoadPromises[p] = new Promise((res, rej) =>
                    loader.load(p, gltf => { modelGLTFs[p] = gltf; res(); }, undefined, rej)
                );
                return _modelLoadPromises[p];
            })).then(results => {
                const failed = results.filter(r => r.status === 'rejected');
                if (failed.length) console.warn('Model load failures:', failed.map(f => f.reason));
            });
        }

        function cloneModel(menuIdx) {
            const gltf = modelGLTFs[MENU[menuIdx].model || 'food.glb'];
            if (!gltf) return null;
            const obj = gltf.scene.clone(true);
            obj.traverse(n => { if (n.isMesh && n.material) n.material = n.material.clone(); });
            return obj;
        }

        function setSlotModel(slotIdx, menuIdx) {
            const old = meshObjs[slotIdx];
            if (old) slotGroups[slotIdx].remove(old);
            const obj = cloneModel(menuIdx);
            if (obj) {
                // Trust the GLB's own scale (1 unit = 1 metre).
                // ar_scale is an optional per-item override (default 1.0 = no change).
                const arScale = MENU[menuIdx].ar_scale || 1.0;
                if (arScale !== 1.0) obj.scale.setScalar(arScale);
                // Seat the model: bottom of bounding box sits at y=0
                const seated = new THREE.Box3().setFromObject(obj);
                if (isFinite(seated.min.y)) obj.position.y = -seated.min.y;
                slotGroups[slotIdx].add(obj);
                meshObjs[slotIdx] = obj;
            }
        }

        function initSlots() {
            const c = currentCenterMenu;
            menuOf = [mod(c - 1), c, mod(c + 1), mod(c + 2)];
            for (let i = 0; i < 4; i++) setSlotModel(i, menuOf[i]);
            const opacities = [_roleOp('left'), _roleOp('center'), _roleOp('right'), 0];
            INIT_ROLES.forEach((role, i) => {
                slotGroups[i].position.x = CFG[role].x;
                slotGroups[i].position.z = CFG[role].z;
                slotGroups[i].scale.setScalar(CFG[role].s);
                slotGroups[i].rotation.set(0, 0, 0);
                setOpacity(i, opacities[i]);
            });
            _syncXRAddBtn();
        }

        // ── Opacity ───────────────────────────────────────────────────
        function setOpacity(idx, opacity) {
            const obj = meshObjs[idx];
            if (!obj) return;
            obj.traverse(n => {
                if (n.isMesh && n.material) {
                    n.material.transparent = opacity < 1.0;
                    n.material.opacity     = Math.max(0, Math.min(1, opacity));
                    n.material.needsUpdate = true;
                }
            });
        }

        function animOpacity(idx, from, to, dur) {
            const t0 = performance.now();
            (function tick(now) {
                const t = Math.min((now - t0) / dur, 1);
                const e = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
                setOpacity(idx, from + (to - from) * e);
                if (t < 1) requestAnimationFrame(tick);
            })(performance.now());
        }

        // ── Slot animation ────────────────────────────────────────────
        function snapSlot(idx, role) {
            slotGroups[idx].position.x = CFG[role].x;
            slotGroups[idx].position.z = CFG[role].z;
            slotGroups[idx].scale.setScalar(CFG[role].s);
        }

        function animSlot(idx, role, dur) {
            const x0 = slotGroups[idx].position.x, x1 = CFG[role].x;
            const z0 = slotGroups[idx].position.z, z1 = CFG[role].z;
            const s0 = slotGroups[idx].scale.x,    s1 = CFG[role].s;
            const t0 = performance.now();
            (function tick(now) {
                const t = Math.min((now - t0) / dur, 1);
                const e = t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t;
                slotGroups[idx].position.x = x0 + (x1 - x0) * e;
                slotGroups[idx].position.z = z0 + (z1 - z0) * e;
                slotGroups[idx].scale.setScalar(s0 + (s1 - s0) * e);
                if (t < 1) requestAnimationFrame(tick);
            })(performance.now());
        }

        // ── Navigation ────────────────────────────────────────────────
        function goNext() {
            if (isAnimating) return;
            isAnimating = true;
            const { left: lIdx, center: cIdx, right: rIdx, hidden: hIdx } = slotOf;
            if (hiddenSide === 'farLeft') snapSlot(hIdx, 'farRight');
            menuOf[hIdx] = mod(menuOf[rIdx] + 1);
            setSlotModel(hIdx, menuOf[hIdx]); setOpacity(hIdx, 0);
            animSlot(lIdx, 'farLeft', DUR); animSlot(cIdx, 'left',  DUR);
            animSlot(rIdx, 'center',  DUR); animSlot(hIdx, 'right', DUR);
            animOpacity(lIdx, _roleOp('left'),    0,                DUR);
            animOpacity(cIdx, _roleOp('center'),  _roleOp('left'),  DUR);
            animOpacity(rIdx, _roleOp('right'),   _roleOp('center'), DUR);
            animOpacity(hIdx, 0,                  _roleOp('right'), DUR);
            setTimeout(() => {
                slotOf = { left: cIdx, center: rIdx, right: hIdx, hidden: lIdx };
                hiddenSide = 'farLeft'; currentCenterMenu = mod(currentCenterMenu + 1);
                isAnimating = false;
                if (labelMesh && labelMesh.visible) drawLabel(MENU[currentCenterMenu]);
                _syncXRAddBtn();
                const _nItem = MENU[currentCenterMenu];
                const _nIdx  = (_nItem && window.__menuItems) ? window.__menuItems.indexOf(_nItem) : -1;
                if (_nIdx >= 0) window._arViewedItems?.add(_nIdx);
                window.track?.('xr_nav', _nIdx >= 0 ? _nIdx : null, { direction: 'next' });
            }, DUR + 10);
        }

        function goPrev() {
            if (isAnimating) return;
            isAnimating = true;
            const { left: lIdx, center: cIdx, right: rIdx, hidden: hIdx } = slotOf;
            if (hiddenSide === 'farRight') snapSlot(hIdx, 'farLeft');
            menuOf[hIdx] = mod(menuOf[lIdx] - 1);
            setSlotModel(hIdx, menuOf[hIdx]); setOpacity(hIdx, 0);
            animSlot(rIdx, 'farRight', DUR); animSlot(cIdx, 'right', DUR);
            animSlot(lIdx, 'center',   DUR); animSlot(hIdx, 'left',  DUR);
            animOpacity(rIdx, _roleOp('right'),   0,                 DUR);
            animOpacity(cIdx, _roleOp('center'),  _roleOp('right'),  DUR);
            animOpacity(lIdx, _roleOp('left'),    _roleOp('center'), DUR);
            animOpacity(hIdx, 0,                  _roleOp('left'),   DUR);
            setTimeout(() => {
                slotOf = { left: hIdx, center: lIdx, right: cIdx, hidden: rIdx };
                hiddenSide = 'farRight'; currentCenterMenu = mod(currentCenterMenu - 1);
                isAnimating = false;
                if (labelMesh && labelMesh.visible) drawLabel(MENU[currentCenterMenu]);
                _syncXRAddBtn();
                const _pItem = MENU[currentCenterMenu];
                const _pIdx  = (_pItem && window.__menuItems) ? window.__menuItems.indexOf(_pItem) : -1;
                if (_pIdx >= 0) window._arViewedItems?.add(_pIdx);
                window.track?.('xr_nav', _pIdx >= 0 ? _pIdx : null, { direction: 'prev' });
            }, DUR + 10);
        }

        // ── Scan/tap hint state ───────────────────────────────────────
        function _updateScanHint(found) {
            const stepEl = document.getElementById('xr-hint-step');
            const mainEl = document.getElementById('xr-hint-main');
            if (!stepEl) return;
            const u = UI[window.__lang || 'en'];
            stepEl.textContent = found ? u.hintStep2 : u.hintStep1;
            mainEl.textContent = found ? u.hintTap   : u.hintScan;
        }

        // ── Add-btn basket state sync ─────────────────────────────────
        function _syncXRAddBtn() {
            const btn = document.getElementById('xr-add-btn');
            if (!btn || !window.__menuItems) return;
            const item = MENU.length ? MENU[currentCenterMenu] : null;
            const idx  = item ? window.__menuItems.indexOf(item) : -1;
            const inBasket = idx >= 0 && window._basket && window._basket.has(String(idx));
            btn.classList.toggle('in-basket', inBasket);
        }

        function _applyUIHidden(hidden) {
            _xrUIHidden = hidden;
            const u = UI[window.__lang || 'en'];
            const hideBtn = document.getElementById('xr-hide-ui');
            if (!hideBtn) return;
            if (hidden) {
                ['xr-nav-row','xr-move-hint','xr-carousel-toggle','xr-label-toggle','xr-place-again'].forEach(id => {
                    const el = document.getElementById(id); if (el) el.style.display = 'none';
                });
                document.getElementById('xr-add-btn').classList.remove('visible');
                document.getElementById('xr-scale-gauge').style.display = 'none';
                document.getElementById('xr-exit').style.display = 'none';
                if (labelMesh) labelMesh.visible = false;
                hideBtn.textContent = u.showUI;
            } else {
                document.getElementById('xr-nav-row').style.display         = 'flex';
                document.getElementById('xr-move-hint').style.display       = 'block';
                document.getElementById('xr-carousel-toggle').style.display = 'block';
                document.getElementById('xr-label-toggle').style.display    = 'block';
                document.getElementById('xr-place-again').style.display     = 'block';
                document.getElementById('xr-add-btn').classList.add('visible');
                document.getElementById('xr-exit').style.display = '';
                if (labelMesh) { drawLabel(MENU[currentCenterMenu]); updateLabelTransform(); labelMesh.visible = true; }
                hideBtn.textContent = u.hideUI;
            }
        }

        // ── Placement ─────────────────────────────────────────────────
        function onSelect() {
            if (_ignoreNextSelect) { _ignoreNextSelect = false; return; }
            if (placed || !reticle.visible) return;
            carouselRoot.position.setFromMatrixPosition(reticle.matrix);
            carouselRoot.quaternion.setFromRotationMatrix(reticle.matrix);
            carouselRoot.visible = true;
            reticle.visible      = false;
            placed               = true;
            const _plItem = MENU[currentCenterMenu];
            const _plIdx  = (_plItem && window.__menuItems) ? window.__menuItems.indexOf(_plItem) : -1;
            window.track?.('ar_placed', _plIdx >= 0 ? _plIdx : null);
            gestureLayer.style.display = 'block';
            document.getElementById('xr-place-hint').style.display      = 'none';
            document.getElementById('xr-place-again').style.display     = 'block';
            document.getElementById('xr-nav-row').style.display          = 'flex';
            document.getElementById('xr-move-hint').style.display        = 'block';
            document.getElementById('xr-carousel-toggle').style.display  = 'block';
            if (labelMesh) { drawLabel(MENU[currentCenterMenu]); updateLabelTransform(); labelMesh.visible = true; }
            document.getElementById('xr-label-toggle').style.display = 'block';
            const _hBtn = document.getElementById('xr-hide-ui');
            _hBtn.textContent = UI[window.__lang || 'en'].hideUI;
            _hBtn.style.display = 'block';
        }

        function _resetPlacement() {
            _ignoreNextSelect = true;
            placed = false;
            carouselRoot.scale.setScalar(1);
            _pinchDist0 = null; _pinchScale0 = null;
            if (_scaleHideTimer) { clearTimeout(_scaleHideTimer); _scaleHideTimer = null; }
            document.getElementById('xr-scale-gauge').style.display = 'none';
            carouselRoot.visible = false;
            reticle.visible = false;
            gestureLayer.style.display = 'none';
            document.getElementById('xr-place-hint').style.display      = '';
            _reticleWasVisible = false; _updateScanHint(false);
            document.getElementById('xr-place-again').style.display     = 'none';
            document.getElementById('xr-nav-row').style.display          = 'none';
            document.getElementById('xr-move-hint').style.display        = 'none';
            document.getElementById('xr-carousel-toggle').style.display  = 'none';
            document.getElementById('xr-label-toggle').style.display     = 'none';
            if (labelMesh) labelMesh.visible = false;
            _xrUIHidden = false;
            _lastTouchStart = null;
            const _hBtnR = document.getElementById('xr-hide-ui');
            _hBtnR.style.display = 'none'; _hBtnR.classList.remove('ui-hidden');
            document.getElementById('xr-exit').style.display = '';
        }

        // ── Loader bootstrap (shared between bg preload and _setup) ───
        let _setupDone = false;
        let _loaderPromise = null;
        const _modelLoadPromises = {};

        async function _ensureLoader() {
            if (loader) return;
            if (!_loaderPromise) {
                _loaderPromise = Promise.all([
                    import('https://esm.sh/three@0.155.0'),
                    import('https://esm.sh/three@0.155.0/examples/jsm/loaders/GLTFLoader'),
                    import('https://esm.sh/three@0.155.0/examples/jsm/exporters/GLTFExporter'),
                ]);
            }
            const [threeNS, loaderMod, exporterMod] = await _loaderPromise;
            if (loader) return; // concurrent call already finished
            THREE        = threeNS;
            GLTFLoader   = loaderMod.GLTFLoader;
            GLTFExporter = exporterMod.GLTFExporter;
            loader       = new GLTFLoader();
        }

        // ── iOS y-offset correction ───────────────────────────────────────────
        // Quick Look places the GLB's raw origin on the detected surface.
        // Most 3D tools export with origin at the model centre, so half the model
        // sinks below the table.  After backgroundPreload decodes every GLB with
        // Three.js we re-export a seated version (same fix as Android's setSlotModel)
        // and swap the launcher's src to the corrected blob.
        const _iosSeatedBlobs = {};
        let _resolvePreload;
        const _preloadDone = new Promise(res => { _resolvePreload = res; });

        async function _makeSeatedBlob(modelUrl, arScale) {
            const gltf = modelGLTFs[modelUrl];
            if (!gltf || !GLTFExporter) return null;
            const scale    = arScale || 1.0;
            const cacheKey = scale !== 1.0 ? `${modelUrl}::${scale}` : modelUrl;
            if (_iosSeatedBlobs[cacheKey]) return _iosSeatedBlobs[cacheKey];
            // Clone, apply ar_scale, seat so bottom sits at y=0
            const root = gltf.scene.clone(true);
            root.traverse(n => { if (n.isMesh && n.material) n.material = n.material.clone(); });
            if (scale !== 1.0) root.scale.setScalar(scale);
            root.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(root);
            if (isFinite(box.min.y) && box.min.y < -0.001) {
                root.position.y = -box.min.y;
                root.updateMatrixWorld(true);
            }
            return new Promise(resolve => {
                try {
                    new GLTFExporter().parse(
                        root,
                        glb => {
                            const url = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
                            _iosSeatedBlobs[cacheKey] = url;
                            resolve(url);
                        },
                        err => { console.warn('iOS seat export:', err); resolve(null); },
                        { binary: true }
                    );
                } catch (e) { console.warn('iOS seat export:', e); resolve(null); }
            });
        }

        // ── One-time init — deferred until first AR tap ───────────────
        async function _setup() {
            if (_setupDone) return;
            _setupDone = true;

            await _ensureLoader();

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
